<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>longwind-world · flight sky demo</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #000; font: 12px system-ui, sans-serif; }
  #hud { position: fixed; left: 10px; top: 10px; color: #fff; background: rgba(0, 0, 0, .45); padding: 6px 10px; border-radius: 4px; line-height: 1.5; }
</style>
<script>
  // three from jsDelivr by default; ?three=/path/to/three/ points the import map elsewhere (tests, offline)
  const T = new URLSearchParams(location.search).get('three') || 'https://cdn.jsdelivr.net/npm/three@0.161.0/';
  document.write(`<script type="importmap">${JSON.stringify({ imports: { three: T + 'build/three.module.js', 'three/addons/': T + 'examples/jsm/' } })}<\/script>`);
</script>
</head>
<body>
<div id="hud"></div>
<script type="module">
// Minimal use of every longwind-world piece: tuned Preetham sky + overlay, height fog, cumulus, cloud shadows on a sea.
// URL: ?e=<sun elevation deg> ?alt=<camera altitude m> ?q=low|med|high ?still (no motion, for screenshots)
import * as THREE from 'three';
import { Sky } from 'three/addons/objects/Sky.js';
import { installHeightFog, bakeCloudNoise, createCumulus, createSkyOverlay, createCloudShadow, tuneSky, pickQuality } from '../src/index.js';

const P = new URLSearchParams(location.search), SEA = 0;
installHeightFog(THREE, { seaY: SEA, scale: 1100 });            // before anything compiles
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 1.5)); renderer.setSize(innerWidth, innerHeight);
renderer.outputColorSpace = THREE.SRGBColorSpace; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 0.5;
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene(), fog = new THREE.FogExp2(0xc8d8e4, 0.00015); scene.fog = fog;
const camera = new THREE.PerspectiveCamera(55, innerWidth / innerHeight, 0.5, 40000);
addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); });

const elev = +(P.get('e') ?? 50), s = Math.min(1, Math.max(0, elev / 28));
const sunDir = new THREE.Vector3().setFromSphericalCoords(1, (90 - elev) * Math.PI / 180, 75 * Math.PI / 180);
const sky = new Sky(); sky.scale.setScalar(10000); scene.add(sky);
const su = sky.material.uniforms; su.sunPosition.value.copy(sunDir);
su.turbidity.value = 5.5 + (2.0 - 5.5) * s; su.rayleigh.value = 2.4 + (1.0 - 2.4) * s; su.mieCoefficient.value = 0.005; su.mieDirectionalG.value = 0.8;
const tune = tuneSky(sky); tune.sat.value = 1.5 + 0.9 * s; tune.zen.value = 0.92 - 0.12 * s;

const sun = new THREE.DirectionalLight(0xfff2e0, 0.9 + 2.3 * s); sun.position.copy(sunDir).multiplyScalar(100); scene.add(sun, sun.target);
const hemi = new THREE.HemisphereLight(0xbfd9ff, 0x4f7f96, 0.35 + 0.55 * s); scene.add(hemi);
const pm = new THREE.PMREMGenerator(renderer), envS = new THREE.Scene(); envS.add(sky); scene.environment = pm.fromScene(envS).texture; scene.add(sky);
const sea = new THREE.Mesh(new THREE.PlaneGeometry(80000, 80000), new THREE.MeshStandardMaterial({ color: 0x0a3550, roughness: 0.25 }));
sea.rotation.x = -Math.PI / 2; sea.position.y = SEA; scene.add(sea);

const Q = pickQuality(renderer);
const noise = bakeCloudNoise(THREE, renderer);
const cu = createCumulus(THREE, { renderer, noise, tile: 26000, seaY: SEA, base: 610, quality: Q.tier, seed: 11 });
scene.add(cu.mesh);
const over = createSkyOverlay(THREE, { noise }); scene.add(over.mesh);
const cs = createCloudShadow(THREE, { renderer, noise, size: Q.tier === 'low' ? 256 : 512, extent: 18000, strength: 0.55 });
cs.patch(sea.material, { indirect: 0.35 }); cs.patchScene(scene);

const sunCol = new THREE.Color(), top = new THREE.Color(), bot = new THREE.Color(), haze = new THREE.Color(0.75, 0.83, 0.9), seaBounce = new THREE.Color(0x6f9fb8);
const alt = +(P.get('alt') ?? 900), still = P.has('still');
let t = 0, last = performance.now(), frames = 0, fps = 60;
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000); last = now; fps = fps * 0.95 + 0.05 / Math.max(dt, 1e-3);
  if (!still) t += dt;
  camera.position.set(t * 120, SEA + alt, -t * 40);
  camera.lookAt(camera.position.x + 1000, camera.position.y + +(P.get('pitch') ?? -60), camera.position.z - 300);
  camera.updateMatrixWorld();
  sunCol.copy(sun.color).multiplyScalar(sun.intensity / Math.PI * 0.92);
  top.copy(hemi.color).multiplyScalar(hemi.intensity * 0.42).add(haze.clone().multiplyScalar(0.55));
  bot.copy(seaBounce).multiplyScalar((0.6 + 1.2 * s) * 0.3).add(hemi.groundColor.clone().multiplyScalar(hemi.intensity * 0.16));   // sea bounce + hemisphere ground
  cu.update(camera, camera.position, { sunDir, sunCol, skyTop: top, skyBot: bot, sunGain: 2.1, dt });
  const u = over.uniforms;
  u.uSunDir.value.copy(sunDir); u.uSunCol.value.set(sunCol.r * 1.6, sunCol.g * 1.6, sunCol.b * 1.6);
  u.uCloudLit.value.set(sunCol.r * 1.7 + top.r * 1.2, sunCol.g * 1.7 + top.g * 1.2, sunCol.b * 1.7 + top.b * 1.2);
  u.uCloudShade.value.set(top.r + bot.r * 0.6, top.g + bot.g * 0.6, top.b + bot.b * 0.6);
  u.uHaze.value.set(haze.r, haze.g, haze.b); const d = fog.color.clone().convertLinearToSRGB(); u.uHazeD.value.set(d.r, d.g, d.b);
  u.uTime.value = t; u.uEye.value.set(alt, 610, 1500, 0);   // w = 0: painted far band off (the 3D field reaches the haze) u.uCloudCover.value.set(-0.04, 1, 0.06, 0.45);
  cs.update(cu.casters(), camera.position, sunDir, SEA);
  renderer.render(scene, camera);
  if (++frames === 3) window.__ready = true;
  document.getElementById('hud').textContent = `longwind-world · ${Q.tier} (${Q.gpu}) · puffs ${cu.stats().drawn}/${cu.stats().puffs} · ${fps.toFixed(0)} fps`;
  requestAnimationFrame(frame);
}
requestAnimationFrame(frame);
window.__app = { stats: () => ({ ...cu.stats(), calls: renderer.info.render.calls, tier: Q.tier, three: THREE.REVISION, shadow: cs.coverage() }) };
</script>
</body>
</html>
