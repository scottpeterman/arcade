let _grainTile = null;
function grainPattern(){
  if (!_grainTile){
    const n = 128, oc = document.createElement('canvas');
    oc.width = oc.height = n;
    const og = oc.getContext('2d'), id = og.createImageData(n,n);
    for (let i=0;i<n*n;i++){
      const v = 90 + ((Math.random()*165)|0);
      id.data[i*4] = id.data[i*4+1] = id.data[i*4+2] = v;
      id.data[i*4+3] = 26;
    }
    og.putImageData(id,0,0);
    _grainTile = oc;
  }
  return patternFor(g, _grainTile);
}
function facePlate(x,y,w,h,r=3){
  const grd = g.createLinearGradient(x,y,x,y+h);
  grd.addColorStop(0, MUST_L); grd.addColorStop(0.14, MUST);
  grd.addColorStop(0.86, MUST); grd.addColorStop(1, MUST_D);
  g.save();
  g.beginPath(); g.roundRect(x,y,w,h,r); g.clip();
  g.fillStyle = grd; g.fillRect(x,y,w,h);
  g.fillStyle = grainPattern(); g.fillRect(x,y,w,h);
  const edge = g.createLinearGradient(x,y,x+w,y);
  edge.addColorStop(0,'rgba(60,42,10,0.30)'); edge.addColorStop(0.10,'rgba(0,0,0,0)');
  edge.addColorStop(0.90,'rgba(0,0,0,0)');    edge.addColorStop(1,'rgba(60,42,10,0.30)');
  g.fillStyle = edge; g.fillRect(x,y,w,h);
  g.restore();
  g.strokeStyle = 'rgba(0,0,0,.5)'; g.lineWidth = 1;
  g.beginPath(); g.roundRect(x,y,w,h,r); g.stroke();
}
function windowInset(x,y,w,h,r=2){
  g.fillStyle = '#0a0d12';
  g.beginPath(); g.roundRect(x,y,w,h,r); g.fill();
  g.save(); g.beginPath(); g.roundRect(x,y,w,h,r); g.clip();
  g.strokeStyle = 'rgba(0,0,0,.85)'; g.lineWidth = 3;
  g.beginPath(); g.moveTo(x,y+h); g.lineTo(x,y); g.lineTo(x+w,y); g.stroke();
  g.restore();
  g.strokeStyle = 'rgba(226,196,110,.35)'; g.lineWidth = 1;

function tinyLabel(txt,cx,y,size,rgb){

// The MAP compartment: the implant's plan of what has been seen. The frame
// study left this well as AWAITING MAP; the dungeon grid now exists.
function miniMap(x, y, w, h){
  const L = game.L; if (!L) return;
  g.save(); g.beginPath(); g.rect(x, y, w, h); g.clip();
  const span = 13, cs = Math.max(2, Math.min(w, h*1.0)/span);
  const cx = x + w/2, cy = y + h/2;
  for (let dz=-10; dz<=10; dz++) for (let dx=-16; dx<=16; dx++){
    const gx = Math.floor(game.px) + dx, gz = Math.floor(game.pz) + dz;
    if (gx<0||gz<0||gx>=L.w||gz>=L.h) continue;
    const i = gz*L.w+gx; if (!game.seen[i]) continue;
    const sx = cx + (gx - game.px)*cs, sy = cy + (gz - game.pz)*cs;
    if (sx < x-cs || sy < y-cs || sx > x+w || sy > y+h) continue;
    const ct = L.grid[i], d = L.door.get(i);
    if (ct === CT.SOLID){ g.fillStyle = `rgba(${CELL_B},0.55)`; g.fillRect(sx+0.5, sy+0.5, cs-1, cs-1); }
    else if (d && d.open < 1){ g.fillStyle = d.locked ? `rgba(${WARN},0.9)` : `rgba(${LBL},0.9)`; g.fillRect(sx+cs*0.2, sy+cs*0.2, cs*0.6, cs*0.6); }
    else { g.fillStyle = `rgba(${CELL_B},0.10)`; g.fillRect(sx+0.5, sy+0.5, cs-1, cs-1); }
  }
  for (const it of game.items){
    const i = it.gz*L.w + it.gx; if (!game.seen[i]) continue;
    const sx = cx + (it.x - game.px)*cs, sy = cy + (it.z - game.pz)*cs;
    const st = it.type === 'lift';
    g.fillStyle = st ? `rgba(${NUM},0.95)` : `rgba(${PHOS},0.9)`;
    g.fillRect(sx - cs*0.2, sy - cs*0.2, cs*0.4, cs*0.4);
  }
  for (const e of game.enemies){
    if (!e.los) continue;
    const sx = cx + (e.x - game.px)*cs, sy = cy + (e.z - game.pz)*cs;
    g.fillStyle = `rgba(${WARN},0.95)`; g.beginPath(); g.arc(sx, sy, Math.max(1.5, cs*0.28), 0, 7); g.fill();
  }
  const a = game.pa, r = cs*0.7;
  g.fillStyle = `rgba(${NUM},0.98)`; g.beginPath();
  g.moveTo(cx + Math.cos(a)*r, cy + Math.sin(a)*r);
  g.lineTo(cx + Math.cos(a+2.5)*r*0.7, cy + Math.sin(a+2.5)*r*0.7);
  g.lineTo(cx + Math.cos(a-2.5)*r*0.7, cy + Math.sin(a-2.5)*r*0.7);
  g.closePath(); g.fill();
  g.restore();
}

const SLOTS = [

const SLOT_TOTAL = SLOTS.reduce((a,s)=>a+s.wt, 0);
function slotGeom(x, y, w, h){
  const pad = w*0.008, ds = h*0.36, vy = y + h*0.80;
  let cx = x + pad;
  return SLOTS.map(sl => {
    const cw = (w - pad*2) * sl.wt/SLOT_TOTAL;
    const cell = {sl, x:cx, y, w:cw, h, cx:cx+cw/2, vy, ds};
    cx += cw;
    return cell;
  });
}
function stripStatic(x, y, w, h){
  facePlate(x, y, w, h, 3);
  const rr = Math.max(2, h*0.035);
  for (let i=0;i<=10;i++){
    const px = x + rr*2.2 + (w - rr*4.4)*i/10;
    rivet(px, y + rr*1.7, rr); rivet(px, y + h - rr*1.7, rr);
  }
  const geo = slotGeom(x, y, w, h), labelY = y + h*0.235;
  geo.forEach((c, i) => {
    tinyLabel(c.sl.name, c.cx, labelY, h*0.125, STENCIL);
    if (i < geo.length-1){
      const gx = c.x + c.w;
      g.strokeStyle = 'rgba(58,40,8,0.7)'; g.lineWidth = 2;
      g.beginPath(); g.moveTo(gx, y+h*0.14); g.lineTo(gx, y+h*0.86); g.stroke();
      g.strokeStyle = 'rgba(236,208,126,0.45)'; g.lineWidth = 1;
      g.beginPath(); g.moveTo(gx+1.6, y+h*0.14); g.lineTo(gx+1.6, y+h*0.86); g.stroke();
    }
  });
}
function stripLive(x, y, w, h, st){ for (const cc of slotGeom(x, y, w, h)) cc.sl.body(cc, st); }

let _staticCv = null, _staticKey = '';
function frameBezel(v){ return Math.max(5, Math.min(v.side, v.band)*0.16); }
function stripRect(v){

function columnGeom(v){
  const colW = v.side*0.46, inset = (v.side-colW)/2;
  const lbl = Math.max(9, v.side*0.20);
  const y = v.y + v.h*0.10, h = v.h*0.74, n = 14;
  const gap = (h/n)*0.16, ch = (h - gap*(n-1))/n;
  return [
    {name:'LIFE', x:inset,              y, w:colW, h, n, ch, lbl},
    {name:'THRT', x:W - v.side + inset, y, w:colW, h, n, ch, lbl},
  ];
}
function buildStatic(v){
  const cv = document.createElement('canvas');
  cv.width = Math.max(1, W*DPR); cv.height = Math.max(1, H*DPR);
  const oc = cv.getContext('2d');
  oc.setTransform(DPR,0,0,DPR,0,0);
  const prev = g; g = oc;
  g.beginPath(); g.rect(0,0,W,H); g.rect(v.x,v.y,v.w,v.h); g.clip('evenodd');
  plate(0,0,W,H,0);
  const bz = frameBezel(v);
  g.fillStyle = '#2b3226';
  g.beginPath(); g.roundRect(v.x-bz, v.y-bz, v.w+bz*2, v.h+bz*2, 7); g.fill();
  g.strokeStyle = STEEL; g.lineWidth = 2;
  g.beginPath(); g.roundRect(v.x-bz*0.5, v.y-bz*0.5, v.w+bz, v.h+bz, 5); g.stroke();
  g.strokeStyle = 'rgba(0,0,0,.8)'; g.lineWidth = 3;
  g.beginPath(); g.roundRect(v.x-1,v.y-1,v.w+2,v.h+2,3); g.stroke();
  const rr = Math.max(2.2, bz*0.26);
  for (const [rx,ry] of [[v.x-bz*0.62,v.y-bz*0.62],[v.x+v.w+bz*0.62,v.y-bz*0.62],
                         [v.x-bz*0.62,v.y+v.h+bz*0.62],[v.x+v.w+bz*0.62,v.y+v.h+bz*0.62]])
    rivet(rx,ry,rr);
  for (const cc of columnGeom(v)){
    well(cc.x-4, cc.y-4, cc.w+8, cc.h+8, 3);
    tinyLabel(cc.name, cc.x+cc.w/2, cc.y + cc.h + cc.lbl*1.25, cc.lbl*0.85, LBL);
  }
  const sr = stripRect(v);
  stripStatic(sr.x, sr.y, sr.w, sr.h);
  g = prev;
  _staticCv = cv;
}
// Threat: how close the nearest hostile that can see you is.
function threat(){
  let t = 0;
  for (const e of game.enemies){
    if (e.state === 0) continue;
    const d = Math.hypot(e.x - game.px, e.z - game.pz);
    t = Math.max(t, Math.max(0, 1 - (d - 1)/8));
  }
  return t;
}
let threatV = 0;
function drawFrame(v){
  const key = `${W}|${H}|${DPR}`;
  if (key !== _staticKey){ buildStatic(v); _staticKey = key; }
  g.drawImage(_staticCv, 0, 0, W, H);
  const col = columnGeom(v);
  const hpFrac = game.hp/game.maxHp;
  cells(col[0].x, col[0].y, col[0].w, col[0].ch, col[0].n, hpFrac, hpFrac < 0.25 ? WARN : CELL_B, true);
  cells(col[1].x, col[1].y, col[1].w, col[1].ch, col[1].n, threatV, threatV > 0.7 ? WARN : CELL_B, true);
  const sr = stripRect(v);
  stripLive(sr.x, sr.y, sr.w, sr.h, {
    floor: String(game.levelNo).padStart(2,'0'),
    score: String(game.score).padStart(6,'0'),
    lives: String(Math.max(0, game.lives)),
    hp: String(Math.round(game.hp)), hpFrac,
    chg: String(Math.floor(game.charge)), chgFrac: game.charge/100,
    keys: String(game.keys),
    cond: hpFrac > 0.66 ? 0 : hpFrac > 0.3 ? 1 : 2,
  });
}

let _scanTile = null;
function scanTile(){
  if (_scanTile) return _scanTile;
  const cv = document.createElement('canvas');
  cv.width = 1; cv.height = 3;
  const o = cv.getContext('2d');
  o.fillStyle = 'rgba(0,0,0,0.20)'; o.fillRect(0,0,1,1.4);
  return (_scanTile = cv);
}
function post(v){
  if (!opt.post) return;
  g.save();
  g.beginPath(); g.rect(v.x,v.y,v.w,v.h); g.clip();
  g.fillStyle = patternFor(g, scanTile());
  g.fillRect(v.x, v.y, v.w, v.h);
  const rad = g.createRadialGradient(
    v.x+v.w/2, v.y+v.h/2, Math.min(v.w,v.h)*0.28,
    v.x+v.w/2, v.y+v.h/2, Math.max(v.w,v.h)*0.72);
  rad.addColorStop(0,'rgba(0,0,0,0)'); rad.addColorStop(1,'rgba(0,0,0,0.55)');
  g.fillStyle = rad; g.fillRect(v.x,v.y,v.w,v.h);
  g.restore();
}

// ===========================================================================
// LOOP
// ===========================================================================
let last = 0;
function update(dt){
  game.t += dt; game.modeT += dt;
  if (game.mode === 'title' || game.mode === 'loading'){ game.pa += dt*0.18; return; }
  if (game.mode !== 'play'){ updateBolts(dt); setHum(0); return; }
  updatePlayer(dt);
  if (game.mode !== 'play') return;
  updateDoors(dt);
  for (const e of game.enemies.slice()) updateEnemy(e, dt);
  updateBolts(dt);
  threatV += (threat() - threatV) * Math.min(1, dt*4);
  setHum(0.035 + threatV*0.13);
  if (game.hp <= 0){
    game.lives--;
    setMode(game.lives > 0 ? 'dead' : 'over');
    sfx('sub', {rate: 0.5}); sfx('hyper', {rate: 0.35, vol: 0.8}); setHum(0);
  }
}
function tick(t){
  const dt = Math.min(0.05, (t - last)/1000) || 0.016;
  last = t;
  if (game.L && !game.paused) update(dt*game.ts);
  const v = viewportRect();
  g.fillStyle = INK; g.fillRect(0,0,W,H);
  if (game.L) drawWorld(v);
  drawFrame(v);
  post(v);
  drawTouch();
  requestAnimationFrame(tick);
}

loadLevel(startFile());
game.msgs = [];
requestAnimationFrame(tick);
Promise.all([loadSprites(), loadTextures()]).then(() => { setMode('title'); }).catch(err => { console.error(err); setMode('title'); });
window.__game = game; window.__loadLevel = loadLevel;
</script>
