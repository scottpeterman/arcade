<!--
  Bounty Hunter — HTML crawler.

  You start on the bottom floor of the tower and fight your way UP. Each
  tier of floors has its own quarry: mutants first, robots next (the robot
  sprites drop into SPRITE_SRC; until they exist the robot floors reuse the
  mutant art). Tiers are one table, TIERS.

  Engine lineage:
    * levels, cell legend, door/key/treasure/stairs rules and the enemy AI
      (IDLE -> ALERT -> CHASE -> ATTACK, DDA line of sight, greedy grid
      steps) are ported from castleofbane (level.py, combat.py).
    * the world layer, motif tracer output, painter's face list, sprite
      mip/bake rules, HUD frame, status strip and post pass come from the
      field-computer frame study (index-drawer.html), with yaw added.

  Draw order per frame:
    rays (visibility) -> floor/ceiling pass -> walls/doors/entities by cell
    Manhattan distance, far to near -> weapon -> frame -> post

  Why Manhattan: on a grid, cell A can only hide cell B if |dx_A| <= |dx_B|
  and |dz_A| <= |dz_B| (measured from the camera cell) with one strict, so
  sorting cells by |dx|+|dz| descending is a correct painter's order for
  anything that stays inside its cell. No BSP needed.

  Sprites: colour art, turned with turnSprite (generalised to RGBA). The
  figure is baked into 24 facings, 15 degrees apart: front turned +/-45,
  side turned -30..+45 (mirrored for the other side), and a synthesized back.
  An enemy's facing is continuous; the view shown is its facing relative to
  the camera, snapped to the nearest bake. That is Wolfenstein's 8-way
  rotation with three times the steps and two drawings of source art.

  Sound: DECKRUNNER's engine (ZzFX core, compressor, reverb send, spatial
  pan and distance falloff, voice caps), with a mutant bank added.

  Controls: W/S or Up/Down move, A/D strafe, Left/Right turn (mouse when
  captured), Space or E opens doors, F / Ctrl / click fires, R restarts after
  death, P toggles the CRT pass, M toggles sound.
-->

const PHOS   = '255,183,48';
const CLASS  = { hostile:{tint:'255,86,72', w:2.4} };
const CELL_B = '38,146,255';
const NUM    = '242,248,255';
const LBL    = '112,182,236';
const WARN   = '226,72,52';
const BOLT   = '170,225,255';
const PANEL  = '#4a5340', PANEL_D = '#333b2c', PANEL_L = '#5c6650';
const STEEL  = '#8d9686', INK = '#05080a', WELL = '#070c11';

const opt = { post:true, bloom:true };

let W=0, H=0, DPR=1;
function resize(){
  DPR = Math.min(devicePixelRatio||1, 2);
  W = c.clientWidth; H = c.clientHeight;
  c.width = W*DPR; c.height = H*DPR;
  g.setTransform(DPR,0,0,DPR,0,0);
}
addEventListener('resize', resize); resize();

// ===========================================================================
// VIEWPORT RECT — the frame study's contract, minus the drawer.
// ===========================================================================
const ASPECT_MAX = 2.75;
function viewportRect(){
  const k = 1;
  const side = W * 0.058, band = H * 0.230, top = H * 0.030, bot = H * 0.014;
  const w = W - side*2;
  let h = H - top - band - bot;
  return {x: side, y: top, w, h, side, band, bot, k, draw:0};
}

// ===========================================================================
// INSTRUMENT VOCABULARY (verbatim from the frame study, toolbar removed)
// ===========================================================================
let _weaveTile = null;
const _patCache = new WeakMap();
function patternFor(ctx, tile){
  let m = _patCache.get(ctx);
  if (!m){ m = new Map(); _patCache.set(ctx, m); }
  let pat = m.get(tile);
  if (!pat){ pat = ctx.createPattern(tile,'repeat'); m.set(tile, pat); }
  return pat;
}
function weaveTile(){
  if (_weaveTile) return _weaveTile;
  const n = 16, cv = document.createElement('canvas');
  cv.width = cv.height = n;
  const o = cv.getContext('2d');
  o.strokeStyle = 'rgba(2,6,10,1)'; o.lineWidth = 1.4;
  for (const [x0,y0,x1,y1] of [[-n,0,0,n],[0,0,n,n],[n,0,n*2,n],
                               [0,n,n,0],[-n,n,0,0],[n,n,n*2,0]]){
    o.beginPath(); o.moveTo(x0,y0); o.lineTo(x1,y1); o.stroke();
  }
  return (_weaveTile = cv);
}
function weave(x,y,w,h,step,alpha){
  g.save();
  g.beginPath(); g.rect(x,y,w,h); g.clip();
  g.globalAlpha *= alpha;
  g.fillStyle = patternFor(g, weaveTile());
  g.fillRect(x,y,w,h);
  g.restore();
}
function cutBlocks(x,y,w,h,cell){
  g.save(); g.beginPath(); g.rect(x,y,w,h); g.clip();
  g.strokeStyle = 'rgba(3,7,11,0.94)';
  g.lineWidth = Math.max(1, cell*0.11);
  g.beginPath();
  for (let vx = x+cell; vx < x+w; vx += cell){ g.moveTo(vx,y); g.lineTo(vx,y+h); }
  for (let vy = y+cell; vy < y+h; vy += cell){ g.moveTo(x,vy); g.lineTo(x+w,vy); }

function blockDigits(cx, baseline, size, text, rgb, maxW, framed){
  const fam = '"Arial Black",Impact,"Helvetica Neue",sans-serif';
  g.font = `900 ${size}px ${fam}`;
  let w = g.measureText(text).width;
  if (maxW && w > maxW){
    size *= maxW / w;
    g.font = `900 ${size}px ${fam}`;
    w = g.measureText(text).width;
  }
  const x = cx - w/2, top = baseline - size*0.74, h = size*0.78;
  const cell = size/4.2;
  if (framed){ const p = size*0.13; windowInset(x-p, top-p, w+p*2, h+p*2, 2); }
  g.fillStyle = `rgba(${rgb},0.88)`;
  g.fillRect(x, top, w, h);
  if (opt.bloom){ g.fillStyle = `rgba(${rgb},0.22)`; g.fillRect(x-2, top-2, w+4, h+4); }
  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = `rgba(${NUM},0.99)`;

function cells(x,y,cw,ch,n,frac,rgb,vertical){

    const cx = vertical ? x : x + i*(cw+gap);
    const cy = vertical ? y + (n-1-i)*(ch+gap) : y;
    const on = i < lit;
    g.fillStyle = on ? `rgba(${rgb},0.95)` : `rgba(${rgb},0.16)`;
    g.fillRect(cx, cy, cw, ch);
    if (on){
      if (opt.bloom){ g.fillStyle = `rgba(${rgb},0.20)`; g.fillRect(cx-1.5, cy-1.5, cw+3, ch+3); }
      weave(cx, cy, cw, ch, Math.min(cw,ch)*0.5, 0.42);
    }
  }
}
function pill(x,y,w,h,frac,rgb){
  g.strokeStyle = `rgba(${rgb},0.85)`; g.lineWidth = Math.max(1.2,h*0.12);
  g.beginPath(); g.roundRect(x,y,w,h,h*0.22); g.stroke();
  g.fillStyle = `rgba(${rgb},0.85)`;
  g.beginPath(); g.roundRect(x+w+h*0.12, y+h*0.30, h*0.20, h*0.40, 1); g.fill();
  const pad = h*0.26;
  g.fillStyle = frac < 0.25 ? `rgba(${WARN},0.95)` : `rgba(${rgb},0.9)`;
  g.fillRect(x+pad, y+pad, Math.max(0,(w-pad*2)*frac), h-pad*2);
}
const SIGIL = [
  ['..#..','.###.','#####','..#..','.#.#.'],
  ['..#..','.##..','#####','..#..','.#..#'],
  ['..#..','.#...','##.##','..#..','#...#'],
];
function sigil(cx,cy,size,cond,rgb){

  const col = cond === 2 ? WARN : rgb;
  for (let r=0;r<5;r++) for (let q=0;q<5;q++){
    const on = rows[r][q] === '#';
    g.fillStyle = on ? `rgba(${col},0.95)` : `rgba(${col},0.13)`;
    g.fillRect(x0+q*cell+cell*0.08, y0+r*cell+cell*0.08, cell*0.84, cell*0.84);
  }
  weave(x0,y0,size,size,cell*0.55,0.35);
}

// ===========================================================================
// WORLD GEOMETRY
// ===========================================================================
// One grid cell is CELL world units; walls run YB..YT with the eye at 0,
// the frame study's proportions. Game logic runs in cell units; the renderer
// multiplies by CELL.
const CELL = 2.0, YB = -1.0, YT = 1.0, NEAR = 0.12;
const HFOV = 86 * Math.PI/180;
const MAX_RAY = 28;                 // cells

const SURF = {
  wall:  {motif:'brick2',   tu:2, tv:1, bias:1.0, edge:1},
  jamb:  {motif:null,       tu:1, tv:1, bias:1.0, edge:1.7},
  floor: {motif:'bigwall',  tu:2, tv:2, bias:1.7, edge:1},
  ceil:  {motif:'aqlite12', tu:2, tv:2, bias:1.7, edge:1},
  door:  {motif:'door15_1', tu:2, tv:1, bias:0.9, edge:1.5},
};
const S_W = 0.55;                   // motif stroke width

let f = 500, pcx = 0, pcy = 0;
const P = p => [pcx + (p[0]*f)/p[2], pcy - (p[1]*f)/p[2]];

// camera, world units
let camX = 0, camZ = 0, camCos = 1, camSin = 0;
function toCam(x, y, z){
  const dx = x - camX, dz = z - camZ;
  return [-dx*camSin + dz*camCos, y, dx*camCos + dz*camSin];
}

function clipNear(poly){
  const out = [];
  for (let i=0;i<poly.length;i++){
    const a = poly[i], b = poly[(i+1)%poly.length];
    const ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain) out.push(a);
    if (ain !== bin){
      const t = (NEAR - a[2]) / (b[2] - a[2]);
      out.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, NEAR]);
    }
  }
  return out;
}
function clipLine(pts){
  const runs = []; let cur = [];
  for (let i=0;i<pts.length;i++){
    const a = pts[i], b = pts[i+1];
    if (a[2] >= NEAR) cur.push(a);
    if (!b) break;
    const ain = a[2] >= NEAR, bin = b[2] >= NEAR;
    if (ain !== bin){
      const t = (NEAR - a[2]) / (b[2] - a[2]);
      cur.push([a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, NEAR]);
      if (ain){ if (cur.length>1) runs.push(cur); cur = []; }
    }
  }
  if (cur.length>1) runs.push(cur);
  return runs;
}
function bilinear(q, u, v){
  const A=q[0], B=q[1], C=q[2], D=q[3];
  const t0 = A[0]+(B[0]-A[0])*u, t1 = A[1]+(B[1]-A[1])*u, t2 = A[2]+(B[2]-A[2])*u;
  const b0 = D[0]+(C[0]-D[0])*u, b1 = D[1]+(C[1]-D[1])*u, b2 = D[2]+(C[2]-D[2])*u;
  return [t0+(b0-t0)*v, t1+(b1-t1)*v, t2+(b2-t2)*v];
}

// Frustum reject in camera space: all corners behind, or all off one side.
function offscreen(q){
  const k = Math.tan(HFOV/2) * 1.02;
  let behind = 0, left = 0, right = 0;
  for (const p of q){
    if (p[2] < NEAR) behind++;
    if (p[0] < -p[2]*k) left++;
    if (p[0] >  p[2]*k) right++;
  }
  // Side tests only mean anything for points in front of the camera; a quad
  // that straddles the camera plane is kept and left to the near clip.
  if (behind === q.length) return true;
  if (behind) return false;
  return left === q.length || right === q.length;
}

// ===========================================================================
// MOTIF DRAWING (frame study, unchanged in substance)
// ===========================================================================
const MOTIF_FAR = 18;
let lodScale = 1;
const BANDS = [['fine',2.5], ['mid',5.5], ['lean',10], ['far',Infinity]];
function pickLod(lib, e){
  for (const [name, edge] of BANDS) if (e < edge) return lib[name];
  return lib.far;
}
function drawMotif(q, paths, e, sf, alpha){
  const fade = Math.pow(Math.max(0, 1 - e/MOTIF_FAR), 1.6);
  if (fade <= 0.02) return 0;
  let n = 0;
  g.beginPath();
  for (let i=0;i<sf.tu;i++) for (let j=0;j<sf.tv;j++){
    for (const p of paths){
      const world = new Array(p.length);
      for (let k=0;k<p.length;k++)
        world[k] = bilinear(q, (i+p[k][0])/sf.tu, (j+p[k][1])/sf.tv);
      for (const run of clipLine(world)){
        let s = P(run[0]); g.moveTo(s[0], s[1]);
        for (let k=1;k<run.length;k++){ s = P(run[k]); g.lineTo(s[0], s[1]); }
        n += run.length;
      }
    }
  }
  g.strokeStyle = `rgba(${PHOS},${(0.82*fade*alpha).toFixed(3)})`;
  g.lineWidth = S_W; g.stroke();
  return n;
}

let statVerts = 0, statSprites = 0;

// A face: camera-space quad, surface key, and whether it occludes (INK fill).
function drawFace(q, surfKey, fill, extra){
  if (offscreen(q)) return;
  const cp = clipNear(q);
  if (cp.length < 3) return;
  const scr = cp.map(P);
  statVerts += scr.length;
  let dmin = Infinity;
  for (const p of q) if (p[2] < dmin) dmin = p[2];
  const d = Math.max(NEAR, dmin);

  g.beginPath();
  g.moveTo(scr[0][0], scr[0][1]);
  for (let i=1;i<scr.length;i++) g.lineTo(scr[i][0], scr[i][1]);
  g.closePath();
  if (fill){ g.fillStyle = INK; g.fill(); }

  const sf = SURF[surfKey];
  const fade = Math.max(0.10, Math.pow(Math.max(0, 1 - d/44), 1.5));
  const bright = extra && extra.bright || 1;
  if (opt.bloom){
    g.strokeStyle = `rgba(${PHOS},${(0.09*fade*bright).toFixed(3)})`;
    g.lineWidth = 4; g.stroke();
  }
  g.strokeStyle = `rgba(${PHOS},${Math.min(0.95, 0.30*fade*sf.edge*bright).toFixed(3)})`;
  g.lineWidth = 1; g.stroke();

  const lib = sf.motif && MOTIFS[sf.motif];
  const e = d * sf.bias / lodScale;
  if (lib && e < MOTIF_FAR) statVerts += drawMotif(q, pickLod(lib, e), e, sf, 1);
}

// ===========================================================================
// turnSprite — generalised from the level-map original. `T` is the
// transparent value and the output array is the input's type, so the same
// routine turns a ramp map (Uint8Array, T=6) or packed RGBA (Uint32Array,
// T=0). Algorithm unchanged: chamfer depth from the silhouette edge, rotate
// about the centre-of-mass column, run-by-run edge mapping, nearer wins.
// ===========================================================================
function turnSprite(m, deg, thickness = 1, T = 6){
  const {w, h, lv} = m;
  const out = {w, h, lv: new lv.constructor(w*h).fill(T)};
  if (!deg) { out.lv.set(lv); return out; }
  const INF = 1e9, d = new Float32Array(w*h);
  for (let i=0;i<w*h;i++) d[i] = lv[i] === T ? 0 : INF;
  const at = (x,y) => (x<0||y<0||x>=w||y>=h) ? 0 : d[y*w+x];
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = y*w+x; if (!d[i]) continue;
    d[i] = Math.min(d[i], at(x-1,y)+3, at(x,y-1)+3, at(x-1,y-1)+4, at(x+1,y-1)+4);
  }
  for (let y=h-1;y>=0;y--) for (let x=w-1;x>=0;x--){
    const i = y*w+x; if (!d[i]) continue;
    d[i] = Math.min(d[i], at(x+1,y)+3, at(x,y+1)+3, at(x+1,y+1)+4, at(x-1,y+1)+4);
  }
  const z = new Float32Array(w*h);
  for (let i=0;i<w*h;i++) if (d[i]) z[i] = thickness * (d[i]/3 - 0.5);
  let sx = 0, n = 0;
  for (let y=0;y<h;y++) for (let x=0;x<w;x++) if (lv[y*w+x] !== T){ sx += x+0.5; n++; }
  if (!n) return out;
  const cx = sx/n, a = deg*Math.PI/180, co = Math.cos(a), s = Math.sin(a);
  const zbuf = new Float32Array(w*h).fill(-INF);
  const proj = (X, Z) => cx + (X-cx)*co + Z*s;
  for (let y=0;y<h;y++){
    const row = y*w;
    for (let x=0;x<w;x++){
      const i = row+x;
      if (lv[i] === T) continue;
      const zl = x>0   && lv[i-1] !== T ? (z[i]+z[i-1])/2 : 0;
      const zr = x<w-1 && lv[i+1] !== T ? (z[i]+z[i+1])/2 : 0;
      const xl = proj(x, zl), xr = proj(x+1, zr);
      if (xr <= xl) continue;
      const near = -(x+0.5-cx)*s + z[i]*co;
      const from = Math.max(0, Math.ceil(xl-0.5)), to = Math.min(w-1, Math.ceil(xr-0.5)-1);
      for (let xd=from; xd<=to; xd++){
        const o = row+xd;
        if (near > zbuf[o]){ zbuf[o] = near; out.lv[o] = lv[i]; }
      }
    }
  }
  return out;
}

// ===========================================================================
// SPRITES — colour art on the frame study's bake rules.
//
// Pixels are packed RGBA in a Uint32Array; 0 is transparent. Alpha was
// thresholded at 128 when the art was packed, so every pixel is either fully
// in or fully out — turnSprite and the majority mip both need a hard edge.
// ===========================================================================
const BRUTE_H = 1.55;      // world units tall; the corridor is 2.0
const TURN_PAD = 26;       // columns added each side so a turn never clips
const THICK = 1.25;        // turnSprite depth scale: he is barrel-chested
const NVIEW = 24;          // 15-degree facings

function imgToMap(img, pad){
  const w = img.width + pad*2, h = img.height;
  const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
  const o = cv.getContext('2d');
  o.drawImage(img, pad, 0);
  const lv = new Uint32Array(o.getImageData(0,0,w,h).data.buffer.slice(0));
  for (let i=0;i<lv.length;i++) if ((lv[i]>>>24) < 128) lv[i] = 0; else lv[i] |= 0xff000000;
  return {w, h, lv};
}
function mirrorMap(m){
  const lv = new Uint32Array(m.w*m.h);
  for (let y=0;y<m.h;y++) for (let x=0;x<m.w;x++) lv[y*m.w+x] = m.lv[y*m.w + (m.w-1-x)];
  return {w:m.w, h:m.h, lv};
}
const rgbaOf = v => [v & 255, (v>>>8) & 255, (v>>>16) & 255];
const pack = (r,gg,b) => (0xff000000 | (Math.min(255,b|0)<<16) | (Math.min(255,gg|0)<<8) | Math.min(255,r|0)) >>> 0;

// Stand-in back view until real art exists: the front silhouette, mirrored,
// with the face and chest detail smoothed out of it and the light taken off.
// A drawn back sprite replaces this — pass it as SPRITE_SRC.back.
function synthBack(front){
  const m = mirrorMap(front), {w,h} = m, lum = new Float32Array(w*h);
  let sr=0, sg=0, sb=0, n=0;
  for (let i=0;i<w*h;i++){
    const v = m.lv[i]; if (!v) continue;
    const [r,gg,b] = rgbaOf(v); lum[i] = (0.3*r + 0.59*gg + 0.11*b)/255;
    if (i < w*h*0.5){ sr+=r; sg+=gg; sb+=b; n++; }
  }
  sr/=n; sg/=n; sb/=n;
  const out = new Uint32Array(w*h);
  for (let y=0;y<h;y++) for (let x=0;x<w;x++){
    const i = y*w+x; if (!m.lv[i]) continue;
    let acc = 0, k = 0;
    for (let dy=-1;dy<=1;dy++) for (let dx=-1;dx<=1;dx++){
      const xx=x+dx, yy=y+dy;
      if (xx<0||yy<0||xx>=w||yy>=h) continue;
      const j = yy*w+xx; if (m.lv[j]){ acc += lum[j]; k++; }
    }
    const L = acc/k;
    if (y < h*0.52){
      const s = 0.18 + 1.25*L;
      out[i] = pack(sr*s*0.85, sg*s*0.78, sb*s*0.78);
    } else {
      const [r,gg,b] = rgbaOf(m.lv[i]);
      out[i] = pack(r*0.62, gg*0.62, b*0.66);
    }
  }
  return {w, h, lv:out};
}

// Halve with the frame study's majority rule; colour is the mean of the
// opaque contributors (there is no ramp to snap back onto).
function mipDown(m){
  const nw = Math.max(1, m.w>>1), nh = Math.max(1, m.h>>1);
  const lv = new Uint32Array(nw*nh);
  for (let y=0;y<nh;y++) for (let x=0;x<nw;x++){
    let r=0, gg=0, b=0, n=0;
    for (let dy=0;dy<2;dy++) for (let dx=0;dx<2;dx++){
      const v = m.lv[Math.min(m.h-1,y*2+dy)*m.w + Math.min(m.w-1,x*2+dx)];
      if (v){ const q = rgbaOf(v); r+=q[0]; gg+=q[1]; b+=q[2]; n++; }
    }
    if (n >= 2) lv[y*nw+x] = pack(r/n, gg/n, b/n);
  }
  return {w:nw, h:nh, lv};
}

// ink (dilated occluder), sil (hostile classification read), body, hit (white).
function bakeLevel(m, pad){
  const Wd = m.w + pad*2, Hd = m.h + pad*2;
  const mk = () => { const cv = document.createElement('canvas'); cv.width = Wd; cv.height = Hd; return cv; };
  const ink = mk(), sil = mk(), body = mk(), hit = mk();
  const iD = ink.getContext('2d').createImageData(Wd,Hd);
  const rD = sil.getContext('2d').createImageData(Wd,Hd);
  const bD = body.getContext('2d').createImageData(Wd,Hd);
  const hD = hit.getContext('2d').createImageData(Wd,Hd);
  const [tr,tg,tb] = CLASS.hostile.tint.split(',').map(Number);
  const r2 = pad*pad + 1;
  const b32 = new Uint32Array(bD.data.buffer);
  for (let y=0;y<m.h;y++) for (let x=0;x<m.w;x++){
    const v = m.lv[y*m.w+x];
    if (!v) continue;
    for (let dy=-pad;dy<=pad;dy++) for (let dx=-pad;dx<=pad;dx++){
      if (dx*dx + dy*dy > r2) continue;
      const o = ((y+pad+dy)*Wd + (x+pad+dx))*4;
      iD.data[o] = 5; iD.data[o+1] = 8; iD.data[o+2] = 10; iD.data[o+3] = 255;
      rD.data[o] = tr; rD.data[o+1] = tg; rD.data[o+2] = tb; rD.data[o+3] = 255;
    }
    const p = (y+pad)*Wd + (x+pad);
    b32[p] = v;
    hD.data[p*4] = 255; hD.data[p*4+1] = 250; hD.data[p*4+2] = 235; hD.data[p*4+3] = 255;
  }
  ink.getContext('2d').putImageData(iD,0,0);
  sil.getContext('2d').putImageData(rD,0,0);
  body.getContext('2d').putImageData(bD,0,0);
  hit.getContext('2d').putImageData(hD,0,0);
  return {w:m.w, h:m.h, pad, ink, sil, body, hit, W:Wd, H:Hd, b32, h32: new Uint32Array(hD.data.buffer)};
}

function comX(m){
  let s = 0, n = 0;
  for (let y=0;y<m.h;y++) for (let x=0;x<m.w;x++) if (m.lv[y*m.w+x]){ s += x+0.5; n++; }
  return n ? s/n : m.w/2;
}

// View k shows the figure turned theta = k*15 degrees from facing the camera,
// positive = turned toward the viewer's right (turnSprite's sign). The side
// art faces the viewer's right, so it sits at +90; negative facings mirror.
function buildViews(front, side, back){
  const views = [];
  for (let k=0;k<NVIEW;k++){
    let th = k*360/NVIEW; if (th > 180) th -= 360;
    const a = Math.abs(th), sgn = th < 0 ? -1 : 1;
    let m;
    if (a <= 45)       m = turnSprite(front, th, THICK, 0);
    else if (a <= 135){ m = turnSprite(side, a - 90, THICK, 0); if (sgn < 0) m = mirrorMap(m); }
    else {
      m = turnSprite(back, a - 180, THICK, 0);
      if (sgn < 0) m = mirrorMap(turnSprite(back, 180 - a, THICK, 0));
    }
    const chain = [];
    let cur = m;
    for (;;){
      chain.push(bakeLevel(cur, Math.max(1, Math.round(CLASS.hostile.w/1.4))));
      if (cur.w <= 12 || cur.h <= 12) break;
      cur = mipDown(cur);
    }
    views.push({chain, com: comX(m), w: m.w, h: m.h});
  }
  return views;
}

const SPRITESETS = {};          // name -> {views, srcH}
let BRUTE = null;                // the set in use on this floor
function loadImg(src){ return new Promise((ok, bad) => { const i = new Image(); i.onload = () => ok(i); i.onerror = bad; i.src = src; }); }
// A set needs a front and a side (facing the viewer's right); a back is optional.
async function bakeSet(src){
  const fi = await loadImg(src.front), si = await loadImg(src.side);
  // Pad both to one frame width so the two bases share an anchor.
  const fw = Math.max(fi.width, si.width);
  const front = imgToMap(fi, TURN_PAD + ((fw - fi.width)>>1));
  const side  = imgToMap(si, TURN_PAD + ((fw - si.width)>>1));
  const back  = src.back ? imgToMap(await loadImg(src.back), TURN_PAD + ((fw - fi.width)>>1)) : synthBack(front);
  return { views: buildViews(front, side, back), srcH: front.h, h: src.h || BRUTE_H };
}
async function loadSprites(){
  for (const [name, src] of Object.entries(SPRITE_SRC)) SPRITESETS[name] = await bakeSet(src);
  pickSpriteSet();
}
function pickSpriteSet(){
  const want = tierFor(game.levelNo).sprite;
  BRUTE = SPRITESETS[want] || SPRITESETS.mutant || null;
}

                       'T':'treasure', '<':'lift', '>':'lift', 'U':'lift', 'V':'lift' };

function parseLevel(text, file){
  const lines = text.replace(/\r/g,'').split('\n');
  let name = file, next = null, prev = null, start = 0;
  for (let i=0;i<lines.length;i++){
    const s = lines[i].trim();
    if (s === '---'){ start = i+1; break; }
    if (s.startsWith('name:')) name = s.slice(5).trim();
    else if (s.startsWith('next:')) next = s.slice(5).trim();
    else if (s.startsWith('prev:')) prev = s.slice(5).trim();
    else { start = 0; break; }
  }
  const rows = lines.slice(start).filter(l => l.trim());
  const h = rows.length, w = Math.max(...rows.map(r => r.length));
  const grid = new Uint8Array(w*h), door = new Map(), ents = [];
  let pstart = [w>>1, h>>1];
  for (let z=0;z<h;z++){
    const row = rows[z].padEnd(w, ' ');
    for (let x=0;x<w;x++){
      const ch = row[x];
      grid[z*w+x] = CELL_CHARS[ch] ?? 0;
      if (ch === '@') pstart = [x, z];
      if (ch === 'D' || ch === 'L') door.set(z*w+x, {open:0, opening:false, locked: ch === 'L'});
      if (ENTITY_CHARS[ch]) ents.push({type: ENTITY_CHARS[ch], gx:x, gz:z});
    }
  }
  return {file, name, next, prev, w, h, grid, door, ents, pstart};
}

  ghost:    {name:'STALKER', hp:1, dmg:15, speed:1.7,  sight:10, atkInt:1.2, atkRange:1.2, turn:260, scale:0.84, score:150},
  zombie:   {name:'BRUTE',   hp:4, dmg:20, speed:0.72, sight:6,  atkInt:1.8, atkRange:1.3, turn:120, scale:1.10, score:250},
  // B: the floor-20 boss. The robot art at 1.3x height and twice the width
  // (wide), whatever the tier. rad / hitR: body and bolt radii. Stays off
  // door cells, so it holds its room; from range it fires twin bolts.
  boss:     {name:'BANE',    hp:30, dmg:25, speed:0.6,  sight:12, atkInt:1.6, atkRange:1.7, turn:90,  scale:1.30, score:5000,
             wide:2, rad:0.9, hitR:0.85, sprite:'robot', boss:true, shotInt:1.5, shotDmg:15, shotSpeed:9},
};
const bossAlive = () => game.enemies.find(e => e.s.boss) || null;

function flash(text, dur = 2, rgb = PHOS){ game.msgs.push({text, until: game.t + dur, dur, rgb}); if (game.msgs.length > 4) game.msgs.shift(); }

function cellAt(x, z){
  const L = game.L;
  if (x < 0 || z < 0 || x >= L.w || z >= L.h) return CT.SOLID;
  return L.grid[z*L.w + x];
}
function doorAt(x, z){ const L = game.L; return (x<0||z<0||x>=L.w||z>=L.h) ? null : L.door.get(z*L.w+x) || null; }
function isSolid(x, z){ return cellAt(x, z) === CT.SOLID; }
function blocks(x, z){                       // for movement
  if (isSolid(x, z)) return true;
  const d = doorAt(x, z);
  return !!(d && d.open < 0.92);
}
function blocksSight(x, z){
  if (isSolid(x, z)) return true;
  const d = doorAt(x, z);
  return !!(d && d.open < 0.5);
}

function loadLevel(file, keepFlash){
  const src = LEVELS[file];
  const L = parseLevel(src, file);
  game.L = L; game.levelFile = file;
  game.levelNo = +(file.match(/\d+/) || [1])[0];
  game.seen = new Uint8Array(L.w*L.h);
  game.enemies = []; game.items = []; game.bolts = []; game.fx = []; game.deaths = [];
  for (const e of L.ents){
    if (STATS[e.type]){
      const s = STATS[e.type];
      game.enemies.push({type:e.type, s, x:e.gx+0.5, z:e.gz+0.5, tx:e.gx+0.5, tz:e.gz+0.5,
        hp:s.hp, hp0:s.hp, shotCd:1, aim:0, state:0, alertT:0, losT:Math.random()*0.25, los:false, atkCd:0,
        facing: Math.floor(Math.random()*4)*Math.PI/2, wanderT: 1+Math.random()*3,
        pain:0, lunge:0, phase:Math.random()*6, walking:false, pause:0, growlT: 4 + Math.random()*10});
    } else {
      game.items.push({type:e.type, gx:e.gx, gz:e.gz, x:e.gx+0.5, z:e.gz+0.5, spin:Math.random()*6});
    }
  }
  game.px = L.pstart[0] + 0.5; game.pz = L.pstart[1] + 0.5;
  // Face the most open direction from the start cell.
  let best = 0, bestN = -1;
  for (let k=0;k<4;k++){
    const dx = [1,0,-1,0][k], dz = [0,1,0,-1][k];
    let n = 0; while (n < 30 && !blocks(L.pstart[0]+dx*(n+1), L.pstart[1]+dz*(n+1))) n++;
    if (n > bestN){ bestN = n; best = k; }
  }
  game.pa = best*Math.PI/2;
  if (!keepFlash) game.msgs = [];
  pickSpriteSet();
  flash(`FLOOR ${String(game.levelNo).padStart(2,'0')} · ${tierFor(game.levelNo).name}`, 3);
  sfx('hyper', {vol: 0.8, rate: 0.7});
}

const keys = new Set();
let mouseDX = 0, locked = false;
// Pause and game speed. Esc pauses; while the mouse is captured the browser
// eats that Esc to release the pointer, so losing the capture mid-play pauses
// too. - / = step the game speed, 0 resets it, H hides crosshair and messages
// for clean screenshots.
const TSTEPS = [0.05, 0.1, 0.25, 0.5, 1];
game.paused = false; game.ts = 1; opt.clean = false;
function setPaused(p){
  if (game.mode !== 'play') p = false;
  game.paused = p; keys.clear(); mouseDX = 0;
  if (AC){ try { p ? AC.suspend() : AC.resume(); } catch(_){} }
}
function stepSpeed(dir){
  let i = TSTEPS.indexOf(game.ts); if (i < 0) i = TSTEPS.length - 1;
  i = Math.max(0, Math.min(TSTEPS.length - 1, i + dir));
  game.ts = TSTEPS[i];
}
addEventListener('keydown', e => {
  if (['ArrowUp','ArrowDown','ArrowLeft','ArrowRight','Space','Tab'].includes(e.code)) e.preventDefault();
  if (e.repeat) return;
  if (e.code === 'Escape'){ setPaused(!game.paused); return; }
  if (e.code === 'Minus' || e.code === 'NumpadSubtract'){ stepSpeed(-1); return; }
  if (e.code === 'Equal' || e.code === 'NumpadAdd'){ stepSpeed(1); return; }
  if (e.code === 'Digit0' || e.code === 'Numpad0'){ game.ts = 1; return; }
  if (e.code === 'KeyH'){ opt.clean = !opt.clean; return; }
  if (game.paused){ if (e.code === 'KeyP') opt.post = !opt.post; return; }
  keys.add(e.code);
  initAudio();
  if (e.code === 'KeyM') toggleSnd();
  if (e.code === 'KeyP') opt.post = !opt.post;
  if (e.code === 'KeyB') opt.bloom = !opt.bloom;
  if (e.code === 'KeyV'){ opt.tex = !opt.tex; flash(opt.tex ? 'TEXTURED WORLD' : 'VECTOR WORLD', 1.2); }
  if (e.code === 'KeyG'){ opt.gun = opt.gun === 'laser' ? 'doom' : 'laser'; flash(opt.gun === 'doom' ? 'SIDEARM' : 'VECTOR PISTOL', 1.2); }
  if (game.mode === 'title' && (e.code === 'Enter' || e.code === 'Space')) startGame();
  else if (game.mode === 'play'){
    if (e.code === 'Space' || e.code === 'KeyE') tryDoor();
    if (e.code === 'KeyF' || e.code === 'ControlLeft' || e.code === 'ControlRight') tryCast();
  }
  else if (game.mode === 'dead' && (e.code === 'KeyR' || e.code === 'Enter') && game.modeT > 0.6) respawn();
  else if ((game.mode === 'over' || game.mode === 'won') && e.code === 'Enter' && game.modeT > 1) newGame();
});
addEventListener('keyup', e => keys.delete(e.code));
addEventListener('blur', () => { keys.clear(); if (game.mode === 'play') setPaused(true); });
c.addEventListener('mousedown', e => {
  c.focus(); initAudio();
  if (game.paused){ setPaused(false); }
  if (game.mode === 'title'){ startGame(); }
  else if (game.mode === 'play'){
    if (!locked && c.requestPointerLock){ try { const r = c.requestPointerLock(); if (r && r.catch) r.catch(()=>{}); } catch(_){} }
    if (e.button === 0) tryCast();
  }
});
document.addEventListener('pointerlockchange', () => {
  const was = locked;
  locked = document.pointerLockElement === c;
  if (was && !locked && game.mode === 'play' && !game.paused) setPaused(true);

document.addEventListener('mousemove', e => { if (locked) mouseDX += e.movementX; });

function startGame(){ newGame(); }
// A bare anchor on the link picks the starting floor: ...#floor11
function startFile(){
  const m = /^#floor(\d+)$/i.exec(location.hash || '');
  const f = m ? `level${+m[1]}.level` : 'level1.level';
  return LEVELS[f] ? f : 'level1.level';
}
function newGame(){
  game.score = 0; game.lives = 3; game.keys = 0; game.treasure = 0;
  game.hp = game.maxHp; game.charge = 100;
  loadLevel(startFile());
  setMode('play');
}
function setMode(m){ game.mode = m; game.modeT = 0; }
function respawn(){

  loadLevel(game.levelFile);

// ===========================================================================
// TOUCH — an arrow pad with FIRE in its hub (right side), and a USE button
// for doors (left side).
// Drawn on the canvas in the instrument palette (they are controls, not
// world), shown once the device reports a touch. Landscape only: in portrait
// the aperture is a letterbox slot, so the game asks to be turned sideways.
// ===========================================================================
const touch = { on: false, held: new Set(), fire: false, use: false, ids: new Map(), bumpT: 0 };
try { touch.on = matchMedia('(pointer: coarse)').matches; } catch (_) {}
const held = k => keys.has(k) || touch.held.has(k);

function padGeom(){
  const v = viewportRect();
  const R = Math.min(v.h*0.24, v.w*0.13);
  // Pad (move, turn, fire) under the right thumb; USE under the left.
  return {
    pad: {x: v.x + v.w - R*1.2, y: v.y + v.h - R*1.15, r: R, hub: R*0.36},
    use: {x: v.x + R*0.85, y: v.y + v.h - R*0.8, r: R*0.45},
  };
}
// What a finger at (x, y) is pressing: 'fire', 'use', a set of arrows, or null.
function touchTarget(x, y){
  const G = padGeom(), p = G.pad, u = G.use;
  if (Math.hypot(x - u.x, y - u.y) < u.r*1.3) return {use: true};
  const dx = x - p.x, dy = y - p.y, d = Math.hypot(dx, dy);
  if (d < p.hub) return {fire: true};
  if (d < p.r*1.35){
    // 8-way: each arrow owns a 135-degree wedge, so diagonals press two.
    const a = Math.atan2(dy, dx), dirs = [];
    const near = (c) => Math.abs(angDiff(a, c)) < Math.PI*0.375;
    if (near(-Math.PI/2)) dirs.push('ArrowUp');
    if (near(Math.PI/2))  dirs.push('ArrowDown');
    if (near(Math.PI))    dirs.push('ArrowLeft');
    if (near(0))          dirs.push('ArrowRight');
    return {dirs};
  }
  return null;
}
function rebuildTouch(){
  touch.held.clear(); touch.fire = false;
  let use = false;
  for (const t of touch.ids.values()){
    if (!t) continue;
    if (t.fire) touch.fire = true;
    if (t.use) use = true;
    if (t.dirs) for (const d of t.dirs) touch.held.add(d);
  }
  if (use && !touch.use && game.mode === 'play') tryDoor();
  touch.use = use;
}
function onTouch(e){
  e.preventDefault();
  touch.on = true;
  initAudio();
  if (e.type === 'touchstart'){
    if (game.paused){ setPaused(false); return; }
    if (game.mode === 'title'){ goFullscreen(); startGame(); return; }
    if (game.mode === 'dead' && game.modeT > 0.6){ respawn(); return; }
    if ((game.mode === 'over' || game.mode === 'won') && game.modeT > 1){ newGame(); return; }
  }
  const r = c.getBoundingClientRect();
  for (const t of e.changedTouches){
    if (e.type === 'touchend' || e.type === 'touchcancel') touch.ids.delete(t.identifier);
    else touch.ids.set(t.identifier, touchTarget(t.clientX - r.left, t.clientY - r.top));
  }
  rebuildTouch();
}
for (const ev of ['touchstart','touchmove','touchend','touchcancel']) c.addEventListener(ev, onTouch, {passive: false});
function goFullscreen(){
  const el = document.documentElement;
  try {
    const p = el.requestFullscreen && el.requestFullscreen({navigationUI: 'hide'});
    if (p && p.then) p.then(() => { try { const q = screen.orientation.lock('landscape'); if (q && q.catch) q.catch(()=>{}); } catch(_){} }).catch(()=>{});
  } catch (_) {}
}
// Called once a frame from updatePlayer.
function touchTick(dt, moved){
  if (!touch.on) return;
  if (touch.fire) tryCast();
  // Walking into a door opens it, so the pad alone can play the game.
  touch.bumpT = Math.max(0, touch.bumpT - dt);
  if (touch.held.has('ArrowUp') && !moved && touch.bumpT <= 0){ touch.bumpT = 0.7; tryDoor(); }
}

function drawTouch(){
  if (!touch.on) return;
  if (H > W){
    g.fillStyle = 'rgba(5,8,10,0.92)'; g.fillRect(0, 0, W, H);
    textGlow('TURN YOUR PHONE SIDEWAYS', W/2, H/2, Math.max(14, W*0.05), PHOS, 0.95);
    return;
  }
  if (game.mode !== 'play') return;
  const G = padGeom(), p = G.pad, u = G.use;
  const lit = (on) => on ? `rgba(${CELL_B},0.55)` : `rgba(${CELL_B},0.12)`;
  g.save();
  // pad ring
  g.beginPath(); g.arc(p.x, p.y, p.r, 0, Math.PI*2);
  g.fillStyle = 'rgba(5,8,10,0.35)'; g.fill();
  g.strokeStyle = `rgba(${CELL_B},0.55)`; g.lineWidth = 1.5; g.stroke();
  // four arrows
  const arrows = [['ArrowUp', -Math.PI/2], ['ArrowRight', 0], ['ArrowDown', Math.PI/2], ['ArrowLeft', Math.PI]];
  for (const [k, a] of arrows){
    const on = touch.held.has(k), ca = Math.cos(a), sa = Math.sin(a);
    const tip = p.r*0.9, base = p.r*0.52, w = p.r*0.3;
    g.beginPath();
    g.moveTo(p.x + ca*tip, p.y + sa*tip);
    g.lineTo(p.x + ca*base - sa*w, p.y + sa*base + ca*w);
    g.lineTo(p.x + ca*base + sa*w, p.y + sa*base - ca*w);
    g.closePath();
    g.fillStyle = lit(on); g.fill();
    g.strokeStyle = `rgba(${on ? NUM : CELL_B},0.9)`; g.lineWidth = 1.4; g.stroke();
  }
  // FIRE hub
  g.beginPath(); g.arc(p.x, p.y, p.hub, 0, Math.PI*2);
  g.fillStyle = touch.fire ? `rgba(${WARN},0.6)` : `rgba(${WARN},0.18)`; g.fill();
  g.strokeStyle = `rgba(${WARN},0.95)`; g.lineWidth = 1.6; g.stroke();
  tinyLabel('FIRE', p.x, p.y + p.hub*0.18, p.hub*0.42, NUM);
  // USE
  g.beginPath(); g.arc(u.x, u.y, u.r, 0, Math.PI*2);
  g.fillStyle = lit(touch.use); g.fill();
  g.strokeStyle = `rgba(${CELL_B},0.9)`; g.lineWidth = 1.5; g.stroke();
  tinyLabel('USE', u.x, u.y + u.r*0.16, u.r*0.4, NUM);
  g.restore();
}


// ===========================================================================
// PLAYER
// ===========================================================================
const P_R = 0.24;
function tryMove(nx, nz){
  const cx = Math.floor(game.px), cz = Math.floor(game.pz);
  const okAt = (x, z) => {
    for (const [ox, oz] of [[-P_R,-P_R],[P_R,-P_R],[-P_R,P_R],[P_R,P_R]])
      if (blocks(Math.floor(x+ox), Math.floor(z+oz))) return false;
    return true;
  };
  if (okAt(nx, game.pz)) game.px = nx;
  if (okAt(game.px, nz)) game.pz = nz;
  // Enemies are solid to the player.
  for (const e of game.enemies){
    const dx = game.px - e.x, dz = game.pz - e.z, d2 = dx*dx + dz*dz, r = e.s.rad || 0.55;
    if (d2 < r*r && d2 > 1e-6){
      const d = Math.sqrt(d2), px = e.x + dx/d*r, pz = e.z + dz/d*r;
      if (okAt(px, pz)){ game.px = px; game.pz = pz; }
    }
  }
}
function updatePlayer(dt){
  const turn = 2.5, speed = 3.3, strafe = 2.8;
  if (held('ArrowLeft'))  game.pa -= turn*dt;
  if (held('ArrowRight')) game.pa += turn*dt;
  game.pa += mouseDX * 0.0028; mouseDX = 0;
  const fx = Math.cos(game.pa), fz = Math.sin(game.pa);
  let mf = 0, ms = 0;
  if (held('KeyW') || held('ArrowUp'))   mf += 1;
  if (held('KeyS') || held('ArrowDown')) mf -= 1;
  if (held('KeyD')) ms += 1;
  if (held('KeyA')) ms -= 1;
  const ox = game.px, oz = game.pz;
  if (mf || ms){
    tryMove(game.px + (fx*mf*speed - fz*ms*strafe)*dt, game.pz + (fz*mf*speed + fx*ms*strafe)*dt);
  }
  const moved = Math.hypot(game.px-ox, game.pz-oz);
  touchTick(dt, moved > 1e-4);
  game.moving = moved > 1e-4;
  const step0 = Math.floor(game.bob / Math.PI);
  game.bob += dt * (game.moving ? 9 : 1.4);
  if (game.moving && Math.floor(game.bob / Math.PI) !== step0)
    sfx('step', {pan: (step0 & 1) ? 0.15 : -0.15, rate: 1 + Math.random()*0.1});

  // pistol: the muzzle flash lasts a moment; recoil rides castCd
  game.castCd = Math.max(0, game.castCd - dt);
  if (game.casting){ game.castT += dt; if (game.castT >= 0.09) game.casting = false; }
  game.charge = Math.min(100, game.charge + 11*dt);
  game.invuln = Math.max(0, game.invuln - dt);
  game.dmgFlash = Math.max(0, game.dmgFlash - dt);

  // pickups and stairs
  const gx = Math.floor(game.px), gz = Math.floor(game.pz);
  for (let i = game.items.length-1; i >= 0; i--){
    const it = game.items[i];
    if (it.gx !== gx || it.gz !== gz) continue;
    if (it.type === 'key' || it.type === 'key_silver'){
      game.keys++; game.score += 50; game.items.splice(i,1); flash('GOT A KEYCARD', 1.6); sndChimes(false);
    } else if (it.type === 'treasure'){
      game.treasure++; game.score += 250; game.items.splice(i,1); flash('BOUNTY CACHE  +250', 1.4);
      sfx('chime', {rate: 1.5}); sfx('chime', {rate: 2, when: 0.07});
    } else if (it.type === 'lift'){
      const boss = bossAlive();
      if (boss){
        if (!(game.t < game.liftMsgT)){ game.liftMsgT = game.t + 1.6; flash(`LIFT SEALED — BRING DOWN ${boss.s.name}`, 1.5, WARN); sfx('denied'); }
        continue;
      }
      game.score += 1000;
      sfx('lift'); sndChimes(true);
      if (game.L.next && LEVELS[game.L.next]){ loadLevel(game.L.next, true); flash('ASCENDING', 2); }
      else { game.score += 5000; setMode('won'); }
      return;
    }
  }
}
function tryCast(){
  if (game.mode !== 'play' || game.castCd > 0) return;
  if (game.charge < 8){ flash('NO CHARGE', 0.8, WARN); sfx('overheat'); game.castCd = 0.3; return; }
  const fx = Math.cos(game.pa), fz = Math.sin(game.pa);
  game.charge -= 8; game.casting = true; game.castT = 0; game.castCd = 0.26;
  game.bolts.push({x: game.px + fx*0.3, z: game.pz + fz*0.3, dx: fx, dz: fz, life: 1.6});
  sfx('laser');
}
function tryDoor(){
  const fx = Math.cos(game.pa), fz = Math.sin(game.pa);
  for (const dist of [0.6, 0.35, 0.95, 1.2]){
    const gx = Math.floor(game.px + fx*dist), gz = Math.floor(game.pz + fz*dist);
    const d = doorAt(gx, gz);
    if (!d || d.opening) continue;
    if (d.locked){
      if (game.keys > 0){
        game.keys--; d.locked = false; d.opening = true; flash('UNLOCKED', 1.5);
        sfx('chime', {rate: 1.5}); sfx('door', {x: gx+0.5, z: gz+0.5, when: 0.1});
      }
      else { flash('LOCKED — NEED A KEYCARD', 1.5, WARN); sfx('denied'); }
    } else { d.opening = true; sfx('door', {x: gx+0.5, z: gz+0.5}); }
    return;
  }
}

// ===========================================================================
// ENEMY AI — combat.py, ported. Two additions: enemies turn in place before
// they step (so the facings get seen), and idle ones wander.
// ===========================================================================
function hasLOS(x1, z1, x2, z2){
  const dx = x2-x1, dz = z2-z1, steps = Math.ceil(Math.max(Math.abs(dx), Math.abs(dz))*3);
  const gx2 = Math.floor(x2), gz2 = Math.floor(z2), gx1 = Math.floor(x1), gz1 = Math.floor(z1);
  for (let i=1;i<steps;i++){
    const x = Math.floor(x1 + dx*i/steps), z = Math.floor(z1 + dz*i/steps);
    if ((x === gx2 && z === gz2) || (x === gx1 && z === gz1)) continue;
    if (blocksSight(x, z)) return false;
  }
  return true;
}
const angDiff = (a, b) => { let d = (b - a) % (Math.PI*2); if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2; return d; };
function turnToward(e, target, dt){
  const d = angDiff(e.facing, target), step = e.s.turn*Math.PI/180*dt;
  e.facing += Math.abs(d) <= step ? d : Math.sign(d)*step;
  return Math.abs(angDiff(e.facing, target));
}
function cellFreeFor(e, gx, gz){
  if (blocks(gx, gz)) return false;
  if (e.s.boss && doorAt(gx, gz)) return false;          // the boss holds its room
  if (gx === Math.floor(game.px) && gz === Math.floor(game.pz)) return false;
  for (const o of game.enemies){
    if (o === e) continue;
    if (Math.floor(o.tx) === gx && Math.floor(o.tz) === gz) return false;
    if (Math.floor(o.x) === gx && Math.floor(o.z) === gz) return false;
  }
  return true;
}
// Walk toward (tx,tz). Returns true on arrival.
function stepToTarget(e, dt, speedMul){
  const dx = e.tx - e.x, dz = e.tz - e.z, d = Math.hypot(dx, dz);
  if (d < 0.02){ e.x = e.tx; e.z = e.tz; e.walking = false; return true; }
  const off = turnToward(e, Math.atan2(dz, dx), dt);
  if (off > 0.7){ e.walking = false; return false; }      // turn first, then walk
  const mv = Math.min(d, e.s.speed*speedMul*dt);
  e.x += dx/d*mv; e.z += dz/d*mv; e.walking = true;
  e.phase += dt * 7 * speedMul;
  return false;
}
function pickChaseStep(e){
  const ex = Math.floor(e.x), ez = Math.floor(e.z);
  const dgx = Math.floor(game.px) - ex, dgz = Math.floor(game.pz) - ez;
  const sx = Math.sign(dgx), sz = Math.sign(dgz), moves = [];
  if (Math.abs(dgx) >= Math.abs(dgz)){
    if (sx) moves.push([sx,0]); if (sz) moves.push([0,sz]); if (sz) moves.push([0,-sz]); if (sx) moves.push([-sx,0]);
    if (!sz){ moves.push([0,1]); moves.push([0,-1]); }
  } else {
    if (sz) moves.push([0,sz]); if (sx) moves.push([sx,0]); if (sx) moves.push([-sx,0]); if (sz) moves.push([0,-sz]);
    if (!sx){ moves.push([1,0]); moves.push([-1,0]); }
  }
  for (const [mx, mz] of moves) if (cellFreeFor(e, ex+mx, ez+mz)){ e.tx = ex+mx+0.5; e.tz = ez+mz+0.5; return true; }
  return false;
}
function hurtPlayer(dmg, when){
  if (game.invuln > 0) return;
  game.hp = Math.max(0, game.hp - dmg); game.invuln = 0.5; game.dmgFlash = 0.4;
  flash(`-${dmg}`, 0.8, WARN);
  sfx('hit', {when}); sfx('sub', {vol: 0.6, rate: 1.4, when});
}
// Boss ranged attack: a bolt from each shoulder, each aimed at the player.
function bossFire(e){
  const fx = Math.cos(e.facing), fz = Math.sin(e.facing), half = 0.55*e.s.wide/2;
  for (const side of [-1, 1]){
    const mx = e.x + fx*0.5 - fz*half*side, mz = e.z + fz*0.5 + fx*half*side;
    const dx = game.px - mx, dz = game.pz - mz, d = Math.hypot(dx, dz) || 1;
    game.bolts.push({x: mx, z: mz, dx: dx/d, dz: dz/d, life: 2.4, v: e.s.shotSpeed, hostile: true, dmg: e.s.shotDmg});
  }
  sfx('laser', {x: e.x, z: e.z, rate: 0.62, vol: 1.3}); sfx('laser', {x: e.x, z: e.z, rate: 0.55, vol: 0.9, when: 0.035});
}
function updateEnemy(e, dt){
  const dx = game.px - e.x, dz = game.pz - e.z, dist = Math.hypot(dx, dz);
  e.atkCd = Math.max(0, e.atkCd - dt);
  e.pain = Math.max(0, e.pain - dt);
  e.lunge = Math.max(0, e.lunge - dt);
  e.shotCd = Math.max(0, e.shotCd - dt);
  e.losT -= dt;
  if (e.losT <= 0){
    e.losT = 0.25;
    e.los = dist <= e.s.sight && hasLOS(e.x, e.z, game.px, game.pz);
  }
  const toPlayer = Math.atan2(dz, dx);
  // Ambient growls from anything nearby that is not already on you.
  e.growlT -= dt;
  if (e.growlT <= 0){ e.growlT = 6 + Math.random()*10; if (dist < 7 && e.state < 2) sfx(VOX().idle, {x:e.x, z:e.z, vol:0.55, rate:0.85 + Math.random()*0.3}); }
  if (e.walking){
    const ph = Math.floor(e.phase / Math.PI);
    if (ph !== e.lastStep){ e.lastStep = ph; sfx(VOX().step, {x:e.x, z:e.z, vol:VOX().stepVol*e.s.scale, rate:VOX().stepRate/e.s.scale}); }
  }
  switch (e.state){
    case 0: if (e.los) { e.state = 1; e.alertT = 0.5; sfx(VOX().alert, {x:e.x, z:e.z, rate: 1/e.s.scale}); } break; // IDLE
    case 1: e.alertT -= dt; if (e.alertT <= 0) e.state = 2; break;             // ALERT
    case 2: if (dist <= e.s.atkRange) e.state = 3;                            // CHASE
            else if (dist > e.s.sight*1.5 && !e.los) e.state = 0; break;
    case 3: if (dist > e.s.atkRange*1.5) e.state = 2; break;                   // ATTACK
  }
  if (e.state === 0){
    // Wander: turn to a random open neighbour, stroll there, stand a while.
    if (!stepToTarget(e, dt, 0.45)) return;
    if (e.look !== undefined) turnToward(e, e.look, dt*0.6);
    e.wanderT -= dt;
    if (e.wanderT > 0) return;
    e.wanderT = 1.5 + Math.random()*3.5;
    const ex = Math.floor(e.x), ez = Math.floor(e.z);
    const dirs = [[1,0],[-1,0],[0,1],[0,-1]].filter(([a,b]) => cellFreeFor(e, ex+a, ez+b));
    if (dirs.length && Math.random() < 0.7){ const [a,b] = dirs[(Math.random()*dirs.length)|0]; e.tx = ex+a+0.5; e.tz = ez+b+0.5; e.look = undefined; }
    else e.look = e.facing + (Math.random() < 0.5 ? -1 : 1) * Math.PI/2 * (1 + (Math.random()*2|0));
  }
  else if (e.state === 1){ turnToward(e, toPlayer, dt); }
  else if (e.state === 2){
    // Ranged boss: on arriving at a cell with the player in sight, stop,
    // square up and fire before the next step.
    if (e.aim > 0){
      e.aim -= dt;
      if (turnToward(e, toPlayer, dt) < 0.2 && e.los){ bossFire(e); e.aim = 0; e.shotCd = e.s.shotInt; }
      return;
    }
    if (stepToTarget(e, dt, 1)){
      if (e.s.shotInt && e.los && e.shotCd <= 0){ e.aim = 1.2; return; }
      e.pause -= dt;
      if (e.pause <= 0){ e.pause = 0.08; if (!pickChaseStep(e)) turnToward(e, toPlayer, dt); }
    }
  }
  else if (e.state === 3){
    // Finish the step in progress, then square up and swing.
    if (!stepToTarget(e, dt, 1)) return;
    const off = turnToward(e, toPlayer, dt);
    if (e.atkCd <= 0 && off < 0.5){
      e.atkCd = e.s.atkInt; e.lunge = 0.3;
      sfx(VOX().swing, {x:e.x, z:e.z}); sfx(VOX().attack, {x:e.x, z:e.z, rate: 0.8/e.s.scale});
      hurtPlayer(e.s.dmg, 0.08);
    }
  }
}
function updateBolts(dt){
  for (let i = game.bolts.length-1; i >= 0; i--){
    const b = game.bolts[i], speed = b.v || 16;
    b.life -= dt;
    let dead = b.life <= 0;
    const n = 4;
    for (let s=0; s<n && !dead; s++){
      b.x += b.dx*speed*dt/n; b.z += b.dz*speed*dt/n;
      if (blocksSight(Math.floor(b.x), Math.floor(b.z))){ dead = true; game.fx.push({x:b.x - b.dx*0.08, z:b.z - b.dz*0.08, age:0, dur:0.18, r:0.35}); sfx('thud', {x:b.x, z:b.z, vol:0.35, rate:1.5}); break; }
      if (b.hostile){
        if (Math.hypot(b.x - game.px, b.z - game.pz) < 0.32){ dead = true; hurtPlayer(b.dmg, 0); sfx('thud', {vol: 0.6}); }
        continue;
      }
      for (const e of game.enemies){
        if (Math.hypot(b.x - e.x, b.z - e.z) < (e.s.hitR || 0.42)){
          dead = true; game.fx.push({x:b.x, z:b.z, age:0, dur:0.3, r:0.6});
          e.hp--; e.pain = 0.14;
          if (e.hp <= 0){
            game.score += e.s.score;
            game.deaths.push({e, age:0, dur: e.s.boss ? 1.8 : 0.8});
            game.enemies.splice(game.enemies.indexOf(e), 1);
            flash(`${nameOf(e)} DOWN  +${e.s.score}`, 1.3, BOLT);
            sfx(VOX().impact, {x:e.x, z:e.z, rate: 0.9/e.s.scale});
            sfx(VOX().die, {x:e.x, z:e.z, rate: 0.9/e.s.scale}); sfx(VOX().dieTail, {x:e.x, z:e.z, rate: 0.6, vol: 0.7}); sfx('sub', {x:e.x, z:e.z, rate: 0.8});
            game.fx.push({x:e.x, z:e.z, age:0, dur:0.45, r:1.1});
            if (e.s.boss){
              // A chain of blasts across the hull, then the lift unseals.
              for (let k = 0; k < 6; k++){
                const ox = (Math.random()*2 - 1)*0.6, oz = (Math.random()*2 - 1)*0.6;
                game.fx.push({x:e.x+ox, z:e.z+oz, age:-0.22*k, dur:0.5, r:1.3});
                sfx('boomS', {x:e.x, z:e.z, rate: 0.55 + Math.random()*0.2, when: 0.22*k});
              }
              sfx('sub', {x:e.x, z:e.z, rate: 0.45, when: 1.2});
              flash('LIFT UNSEALED', 2.5, PHOS);
            }
          } else {
            sfx(VOX().impact, {x:e.x, z:e.z, rate: 1.05/Math.sqrt(e.s.scale)});
            sfx(VOX().pain, {x:e.x, z:e.z, rate: 1.3/e.s.scale, vol: VOX().painVol, when: 0.03});
            if (e.state < 2) e.state = 2;
          }
          break;
        }
      }
    }
    if (dead) game.bolts.splice(i, 1);
  }
  for (const fx of game.fx) fx.age += dt;
  game.fx = game.fx.filter(fx => fx.age < fx.dur);
  for (const d of game.deaths) d.age += dt;
  game.deaths = game.deaths.filter(d => d.age < d.dur);
}
function updateDoors(dt){
  for (const d of game.L.door.values()) if (d.opening && d.open < 1) d.open = Math.min(1, d.open + dt*1.4);
}

// ===========================================================================
// VISIBILITY — Wolfenstein's ray pass, used only to decide WHAT to draw.
// One DDA ray per two aperture columns; every cell a ray crosses is visible,
// and the ray stops at rock or a door that is still mostly shut.
// ===========================================================================
let vis = new Uint8Array(0), visList = [];
function castVisibility(v){
  const L = game.L, n = L.w*L.h;
  if (vis.length !== n) vis = new Uint8Array(n);
  vis.fill(0); visList.length = 0;
  const mark = (x, z) => { const i = z*L.w+x; if (!vis[i]){ vis[i] = 1; visList.push(i); game.seen[i] = 1; } };
  const rays = Math.max(60, Math.round(v.w/2));
  const half = Math.tan(HFOV/2);
  const px = game.px, pz = game.pz, fx = Math.cos(game.pa), fz = Math.sin(game.pa);
  mark(Math.floor(px), Math.floor(pz));
  for (let r=0;r<=rays;r++){
    const s = (r/rays*2 - 1) * half * 1.04;
    let dx = fx - fz*s, dz = fz + fx*s;
    if (Math.abs(dx) < 1e-9) dx = 1e-9;
    if (Math.abs(dz) < 1e-9) dz = 1e-9;
    let mx = Math.floor(px), mz = Math.floor(pz);
    const ddx = Math.abs(1/dx), ddz = Math.abs(1/dz);
    const stx = dx < 0 ? -1 : 1, stz = dz < 0 ? -1 : 1;
    let sdx = dx < 0 ? (px - mx)*ddx : (mx + 1 - px)*ddx;
    let sdz = dz < 0 ? (pz - mz)*ddz : (mz + 1 - pz)*ddz;
    for (let i=0;i<MAX_RAY*2;i++){
      if (sdx < sdz){ sdx += ddx; mx += stx; } else { sdz += ddz; mz += stz; }
      if (mx < 0 || mz < 0 || mx >= L.w || mz >= L.h) break;
      const ct = L.grid[mz*L.w+mx];
      if (ct === CT.SOLID){ game.seen[mz*L.w+mx] = 1; break; }
      mark(mx, mz);
      const d = L.door.get(mz*L.w+mx);
      if (d && d.open < 0.5) break;
    }
  }
}

// ===========================================================================
// DRAW LIST
// ===========================================================================
function wq(x0,y0,z0, x1,y1,z1, x2,y2,z2, x3,y3,z3){
  return [toCam(x0,y0,z0), toCam(x1,y1,z1), toCam(x2,y2,z2), toCam(x3,y3,z3)];
}
function buildDrawList(){
  const L = game.L, list = [];
  const cgx = Math.floor(game.px), cgz = Math.floor(game.pz);
  const man = (x, z) => Math.abs(x - cgx) + Math.abs(z - cgz);
  const wallDone = new Set();
  for (const i of visList){
    const gx = i % L.w, gz = (i / L.w) | 0;
    const door = L.door.get(i);
    // Rock faces bounding this open cell, if they face the camera.
    for (const [nx, nz] of [[gx-1,gz],[gx+1,gz],[gx,gz-1],[gx,gz+1]]){
      if (cellAt(nx, nz) !== CT.SOLID) continue;
      const key = (nz*L.w+nx)*4 + (nx<gx?0:nx>gx?1:nz<gz?2:3);
      if (wallDone.has(key)) continue; wallDone.add(key);
      list.push({k: man(nx, nz), sub: 0, kind: 'wall', gx, gz, nx, nz, jamb: !!door});
    }
    list.push({k: -1, kind: 'flat', gx, gz});
    if (door) list.push({k: man(gx, gz), sub: 1, kind: 'door', gx, gz, d: door});
  }
  const inVis = (x, z) => { const gx = Math.floor(x), gz = Math.floor(z); return gx>=0 && gz>=0 && gx<L.w && gz<L.h && vis[gz*L.w+gx]; };
  const depth = (x, z) => (x*CELL - camX)*camCos + (z*CELL - camZ)*camSin;
  for (const it of game.items) if (inVis(it.x, it.z)) list.push({k: man(it.gx, it.gz), sub: 2 + 1/(1+depth(it.x,it.z)), kind:'item', it});
  for (const e of game.enemies) if (inVis(e.x, e.z)) list.push({k: man(Math.floor(e.x), Math.floor(e.z)), sub: 2 + 1/(1+depth(e.x,e.z)), kind:'enemy', e});
  for (const d of game.deaths) if (inVis(d.e.x, d.e.z)) list.push({k: man(Math.floor(d.e.x), Math.floor(d.e.z)), sub: 2 + 1/(1+depth(d.e.x,d.e.z)), kind:'enemy', e:d.e, death:d});
  for (const b of game.bolts) if (inVis(b.x, b.z)) list.push({k: man(Math.floor(b.x), Math.floor(b.z)), sub: 3, kind:'bolt', b});
  for (const fx of game.fx) if (inVis(fx.x, fx.z)) list.push({k: man(Math.floor(fx.x), Math.floor(fx.z)), sub: 4, kind:'fx', fx});
  list.sort((a, b) => (b.k - a.k) || (a.sub - b.sub));
  return list;
}

function drawWallItem(it){
  const {gx, gz, nx, nz} = it;
  const x0 = gx*CELL, x1 = (gx+1)*CELL, z0 = gz*CELL, z1 = (gz+1)*CELL;
  let q;
  if (nx < gx){ if (camX < x0) return; q = wq(x0,YT,z1, x0,YT,z0, x0,YB,z0, x0,YB,z1); }
  else if (nx > gx){ if (camX > x1) return; q = wq(x1,YT,z0, x1,YT,z1, x1,YB,z1, x1,YB,z0); }
  else if (nz < gz){ if (camZ < z0) return; q = wq(x0,YT,z0, x1,YT,z0, x1,YB,z0, x0,YB,z0); }
  else { if (camZ > z1) return; q = wq(x1,YT,z1, x0,YT,z1, x0,YB,z1, x1,YB,z1); }
  drawFace(q, it.jamb ? 'jamb' : 'wall', true);
}
function drawFlat(it){
  const x0 = it.gx*CELL, x1 = x0+CELL, z0 = it.gz*CELL, z1 = z0+CELL;
  drawFace(wq(x0,YB,z1, x1,YB,z1, x1,YB,z0, x0,YB,z0), 'floor', false);
  drawFace(wq(x0,YT,z0, x1,YT,z0, x1,YT,z1, x0,YT,z1), 'ceil', false);
}
function drawDoor(it){
  const {gx, gz, d} = it;
  if (d.open >= 0.999) return;
  const alongX = isSolid(gx-1, gz) && isSolid(gx+1, gz);
  const o = d.open*CELL;
  let q;
  if (alongX){
    const z = (gz+0.5)*CELL, a = gx*CELL + o, b = (gx+1)*CELL;
    q = wq(a,YT,z, b,YT,z, b,YB,z, a,YB,z);
  } else {
    const x = (gx+0.5)*CELL, a = gz*CELL + o, b = (gz+1)*CELL;
    q = wq(x,YT,a, x,YT,b, x,YB,b, x,YB,a);
  }
  drawFace(q, 'door', true, {bright: d.locked ? 1.6 : 1});
  if (d.locked){
    // Keyhole plate at the panel centre, so a locked door reads from range.
    const cxw = alongX ? (gx*CELL + o + (gx+1)*CELL)/2 : (gx+0.5)*CELL;
    const czw = alongX ? (gz+0.5)*CELL : (gz*CELL + o + (gz+1)*CELL)/2;
    const pc = toCam(cxw, 0, czw); if (pc[2] < NEAR) return;
    const s = f/pc[2], sx = pcx + pc[0]*s, sy = pcy + 0.05*s, r = 0.16*s;
    g.fillStyle = INK; g.strokeStyle = `rgba(${PHOS},0.95)`; g.lineWidth = Math.max(1, s*0.012);
    g.beginPath(); g.arc(sx, sy - r*0.35, r*0.45, 0, Math.PI*2); g.fill(); g.stroke();
    g.beginPath(); g.moveTo(sx - r*0.22, sy - r*0.1); g.lineTo(sx - r*0.34, sy + r*0.75);
    g.lineTo(sx + r*0.34, sy + r*0.75); g.lineTo(sx + r*0.22, sy - r*0.1); g.stroke();
  }
}

// Items are small amber wireframes: they belong to the world, so they wear
// its colour. Each is a set of 3D polylines in local cell units.
function spinPts(pts, cx, cz, ang, sc){
  const co = Math.cos(ang), si = Math.sin(ang);
  return pts.map(([x, y, z]) => toCam(cx + (x*co - z*si)*sc, y, cz + (x*si + z*co)*sc));
}
function strokePolys(polys, alpha, fillFirst){
  for (const poly of polys){
    const runs = clipLine(poly);
    for (const run of runs){
      g.beginPath();
      let s = P(run[0]); g.moveTo(s[0], s[1]);
      for (let k=1;k<run.length;k++){ s = P(run[k]); g.lineTo(s[0], s[1]); }
      if (fillFirst){ g.fillStyle = INK; g.fill(); }
      if (opt.bloom){ g.strokeStyle = `rgba(${PHOS},${(0.12*alpha).toFixed(3)})`; g.lineWidth = 4; g.stroke(); }
      g.strokeStyle = `rgba(${PHOS},${alpha.toFixed(3)})`; g.lineWidth = 1.3; g.stroke();
    }
  }
}
const KEY_SHAPE = (() => {
  const ring = [], n = 10;
  for (let i=0;i<=n;i++){ const a = i/n*Math.PI*2; ring.push([Math.cos(a)*0.18, 0.18 + Math.sin(a)*0.18, 0]); }
  return [ring, [[0,0,0],[0,-0.55,0]], [[0,-0.4,0],[0.14,-0.4,0]], [[0,-0.52,0],[0.18,-0.52,0]]];
})();
function drawItem(it){
  const t = game.t, x = it.it.x*CELL, z = it.it.z*CELL, type = it.it.type;
  const pc = toCam(x, 0, z); if (pc[2] < NEAR) return;
  const d = pc[2], alpha = Math.max(0.25, Math.min(0.98, 1.25 - d/30));
  if (type === 'key' || type === 'key_silver'){
    const y0 = YB + 0.95 + Math.sin(t*2.4 + it.it.spin)*0.06;
    const polys = KEY_SHAPE.map(p => spinPts(p.map(([a,b,cc]) => [a, y0 + b, cc]), x, z, t*1.6 + it.it.spin, 1.0));
    strokePolys(polys, alpha, false);
  } else if (type === 'treasure'){
    const w = 0.42, dp = 0.28, hgt = 0.34, lid = 0.14, y = YB;
    const bx = [[-w,-dp],[w,-dp],[w,dp],[-w,dp]];
    const faces = [];
    const base = bx.map(([a,b]) => [a, y, b]), top = bx.map(([a,b]) => [a, y+hgt, b]);
    const ang = it.it.spin;
    const T = pts => spinPts(pts, x, z, ang, 1);
    // three solid faces toward the camera are enough: fill then stroke.
    const sidesQ = [[0,1],[1,2],[2,3],[3,0]].map(([i,j]) => [base[i], base[j], top[j], top[i]]);
    for (const q of [...sidesQ, top]){
      const cq = T(q); if (offscreen(cq)) continue;
      const cp = clipNear(cq); if (cp.length < 3) continue;
      faces.push({cp, z: cq.reduce((s,p)=>s+p[2],0)/4});
    }
    faces.sort((a,b) => b.z - a.z);
    for (const fc of faces){
      const scr = fc.cp.map(P);
      g.beginPath(); g.moveTo(scr[0][0], scr[0][1]);
      for (let i=1;i<scr.length;i++) g.lineTo(scr[i][0], scr[i][1]);
      g.closePath(); g.fillStyle = INK; g.fill();
      if (opt.bloom){ g.strokeStyle = `rgba(${PHOS},${(0.12*alpha).toFixed(3)})`; g.lineWidth = 4; g.stroke(); }
      g.strokeStyle = `rgba(${PHOS},${alpha.toFixed(3)})`; g.lineWidth = 1.3; g.stroke();
    }
    // domed lid and strap
    const arch = [];
    for (let i=0;i<=8;i++){ const a = i/8*Math.PI; arch.push([-w*Math.cos(a), y+hgt+Math.sin(a)*lid, 0]); }
    strokePolys([T(arch.map(([a,b]) => [a,b,-dp])), T(arch.map(([a,b]) => [a,b,dp])), T(arch.map(([a,b]) => [a,b,0])),
                 T([[-0.06, y+hgt, dp],[-0.06, y+0.05, dp]]), T([[0.06, y+hgt, dp],[0.06, y+0.05, dp]])], alpha*0.9, false);
  } else if (type === 'lift'){
    // Lift shaft: a pad on the floor, a well up through the ceiling, and
    // rings of light climbing between them.
    const sq = (r, y) => [[-r,y,-r],[r,y,-r],[r,y,r],[-r,y,r],[-r,y,-r]].map(([a,b,cc]) => toCam(x + a, b, z + cc));
    const polys = [sq(0.8, YB + 0.01), sq(0.62, YB + 0.01)];
    for (let k=0;k<5;k++) polys.push(sq(0.8 - k*0.1, YT + k*0.22));
    const pulse = 0.6 + 0.4*Math.abs(Math.sin(t*2.2));
    strokePolys(polys, alpha*pulse, false);
    g.save(); g.globalCompositeOperation = 'lighter';
    for (let k=0;k<3;k++){
      const f0 = (t*0.45 + k/3) % 1, y = YB + f0*(YT - YB);
      for (const run of clipLine(sq(0.62 - f0*0.12, y))){
        g.beginPath(); let p = P(run[0]); g.moveTo(p[0], p[1]);
        for (let i=1;i<run.length;i++){ p = P(run[i]); g.lineTo(p[0], p[1]); }
        g.strokeStyle = `rgba(${BOLT},${(alpha*0.6*Math.sin(f0*Math.PI)).toFixed(3)})`; g.lineWidth = 1.4; g.stroke();
      }
    }
    g.restore();
  } else if (type === 'stairs_down' || type === 'stairs_up'){
    // A well of receding frames: steps going down through the floor (or up
    // through the ceiling for the way out).
    const up = type === 'stairs_up', polys = [];
    for (let k=0;k<6;k++){
      const s = 0.8 - k*0.1, y = up ? YT + k*0.22 : YB - k*0.22;
      const r = [[-s,y,-s],[s,y,-s],[s,y,s],[-s,y,s],[-s,y,-s]].map(([a,b,cc]) => toCam(x + a, b, z + cc));
      polys.push(r);
    }
    const pulse = 0.6 + 0.4*Math.abs(Math.sin(t*2.2));
    // fill the mouth so the floor motif does not read through it
    const mouth = clipNear(polys[0].slice(0,4));
    if (mouth.length >= 3){ const s = mouth.map(P); g.beginPath(); g.moveTo(s[0][0], s[0][1]); for (const p of s.slice(1)) g.lineTo(p[0], p[1]); g.closePath(); g.fillStyle = INK; g.fill(); }
    strokePolys(polys, alpha*pulse, false);
  }
}

// Enemy sprite. The facing relative to the camera picks the bake.
function drawEnemy(it){
  const e = it.e, death = it.death;
  const SET = (e.s.sprite && SPRITESETS[e.s.sprite]) || BRUTE, wide = e.s.wide || 1;
  if (!SET) return;
  const ex = e.x*CELL, ez = e.z*CELL;
  const pc = toCam(ex, YB, ez);
  if (pc[2] < NEAR*2) return;
  const psi = Math.atan2(camZ - ez, camX - ex);          // enemy -> camera
  let th = angDiff(e.facing, psi);                         // turned toward our right = +
  let k = Math.round(th/(Math.PI*2)*NVIEW); k = ((k % NVIEW) + NVIEW) % NVIEW;
  const view = SET.views[k];
  const s = f/pc[2];                                       // px per world unit
  const unit = SET.h*e.s.scale / SET.srcH;                 // world units per source px
  let scaleY = 1, alpha = 1;
  if (death){ const t = death.age/death.dur; scaleY = Math.max(0.02, 1 - t*t); alpha = 1 - t; }
  const lunge = e.lunge > 0 ? 1 + 0.07*Math.sin((0.3 - e.lunge)/0.3*Math.PI) : 1;
  const bob = e.walking ? Math.abs(Math.sin(e.phase))*0.045 : 0;
  const dw = view.w*unit*s*lunge*wide, dh = view.h*unit*s*lunge*scaleY;
  const ax = pcx + pc[0]*s, feet = pcy - (YB - 0)*s - bob*s;   // pc[1] is YB
  const x0 = ax - view.com*unit*s*lunge*wide, y0 = feet - dh;
  if (dw < 0.5 || dh < 0.5) return;

  const set = view.chain;
  let li = 0;
  while (li+1 < set.length && set[li+1].w >= dw) li++;
  const Lv = set[li], sx = dw/Lv.w, sy = dh/Lv.h;
  const q = v => Math.round(v*DPR)/DPR;
  const dx = q(x0 - Lv.pad*sx), dy = q(y0 - Lv.pad*sy);
  const w = q(x0 + (Lv.w+Lv.pad)*sx) - dx, h = q(y0 + (Lv.h+Lv.pad)*sy) - dy;

  const SIL_FULL = 8, SIL_NONE = 22;
  const tSil = Math.max(0, Math.min(1, (SIL_NONE - dw)/(SIL_NONE - SIL_FULL)));
  const e2 = pc[2]*0.7/lodScale;
  const fade = Math.max(0.55, Math.pow(Math.max(0, 1 - e2/MOTIF_FAR), 1.6));
  const ghost = false;
  const sm = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  if (!ghost){ g.globalAlpha = alpha; g.drawImage(Lv.ink, dx, dy, w, h); }
  g.globalAlpha = 0.95*tSil*tSil*alpha; g.drawImage(Lv.sil, dx, dy, w, h);
  g.globalAlpha = (ghost ? 0.5 : 1) * fade * (1 - 0.45*tSil) * alpha;
  g.drawImage(Lv.body, dx, dy, w, h);
  if (ghost){ g.globalAlpha = 0.18*alpha; g.globalCompositeOperation = 'lighter'; g.drawImage(Lv.body, dx, dy, w, h); g.globalCompositeOperation = 'source-over'; }
  if (e.pain > 0){ g.globalAlpha = Math.min(1, e.pain/0.14)*0.85; g.drawImage(Lv.hit, dx, dy, w, h); }
  if (death){ g.globalAlpha = (1 - death.age/death.dur)*0.5; g.drawImage(Lv.hit, dx, dy, w, h); }
  g.globalAlpha = 1;
  g.imageSmoothingEnabled = sm;
  statSprites++;
}
// Laser bolt: a short streak along its travel, white core in a blue sheath.
function drawBolt(it){
  const b = it.b, len = 0.55;
  const run = clipLine([toCam(b.x*CELL, -0.18, b.z*CELL), toCam((b.x - b.dx*len)*CELL, -0.18, (b.z - b.dz*len)*CELL)])[0];
  if (!run) return;
  const a = P(run[0]), c2 = P(run[1]), w = Math.max(1.5, 0.05*f/run[0][2]);
  g.save(); g.globalCompositeOperation = 'lighter'; g.lineCap = 'round';
  g.beginPath(); g.moveTo(a[0], a[1]); g.lineTo(c2[0], c2[1]);
  const sheath = b.hostile ? WARN : BOLT;
  if (opt.bloom){ g.strokeStyle = `rgba(${sheath},0.22)`; g.lineWidth = w*4; g.stroke(); }
  g.strokeStyle = `rgba(${sheath},0.9)`; g.lineWidth = w*1.6; g.stroke();
  g.strokeStyle = `rgba(${NUM},0.95)`; g.lineWidth = Math.max(1, w*0.6); g.stroke();
  g.restore();
}
function drawFx(it){
  const fx = it.fx; if (fx.age < 0) return;              // queued blasts wait their turn
  const pc = toCam(fx.x*CELL, -0.12, fx.z*CELL);
  if (pc[2] < NEAR) return;
  const t = fx.age/fx.dur, s = f/pc[2], x = pcx + pc[0]*s, y = pcy - pc[1]*s;
  const r = fx.r*t*s;
  g.strokeStyle = `rgba(${BOLT},${(1-t).toFixed(3)})`; g.lineWidth = 1.5;
  g.beginPath();
  for (let i=0;i<8;i++){ const a = i/8*Math.PI*2; g.moveTo(x + Math.cos(a)*r*0.4, y + Math.sin(a)*r*0.4); g.lineTo(x + Math.cos(a)*r, y + Math.sin(a)*r); }
  g.stroke();
}

// The laser pistol, dead centre like Wolfenstein's. Drawn in the world's
// language: INK fill for occlusion, amber edges, blue for anything that
// carries charge.
function drawWeapon(v){
  const U = v.h, mv = game.moving ? 1 : 0.3;
  const bobX = Math.cos(game.bob*0.5)*U*0.014*mv;
  const bobY = Math.abs(Math.sin(game.bob*0.5))*U*0.02*mv;
  const kick = game.castCd > 0 ? Math.pow(game.castCd/0.26, 2) : 0;
  const cx = v.x + v.w/2 + bobX, by = v.y + v.h + bobY + kick*U*0.045;
  // rear face of the slide (near, big) and the muzzle face (far, small)
  const nw = U*0.24, nh = U*0.11, ny = by - U*0.19;
  const fw = U*0.13, fh = U*0.06, fy = by - U*0.30 + kick*U*0.03;
  const N = [[cx-nw/2,ny],[cx+nw/2,ny],[cx+nw/2,ny+nh],[cx-nw/2,ny+nh]];
  const Fq = [[cx-fw/2,fy],[cx+fw/2,fy],[cx+fw/2,fy+fh],[cx-fw/2,fy+fh]];
  const lerp = (p, q, t) => [p[0]+(q[0]-p[0])*t, p[1]+(q[1]-p[1])*t];
  const poly = (pts, close) => { g.beginPath(); g.moveTo(pts[0][0], pts[0][1]); for (const p of pts.slice(1)) g.lineTo(p[0], p[1]); if (close) g.closePath(); };
  const edge = (a, w) => {
    if (opt.bloom){ g.strokeStyle = `rgba(${PHOS},${(0.12*a).toFixed(3)})`; g.lineWidth = w*3.5; g.stroke(); }
    g.strokeStyle = `rgba(${PHOS},${a.toFixed(3)})`; g.lineWidth = w; g.stroke();
  };
  g.save(); g.beginPath(); g.rect(v.x, v.y, v.w, v.h); g.clip();
  g.lineJoin = 'round'; g.lineCap = 'round';

  // grip and trigger guard, running off the bottom of the aperture
  poly([[cx-nw*0.30, ny+nh], [cx+nw*0.26, ny+nh], [cx+nw*0.34, by+U*0.1], [cx-nw*0.42, by+U*0.1]], true);
  g.fillStyle = INK; g.fill(); edge(0.85, 1.4);
  for (let k=1;k<4;k++){ const y = ny + nh + k*U*0.03; poly([[cx-nw*0.31 - k*nw*0.02, y],[cx+nw*0.27 + k*nw*0.013, y]]); edge(0.35, 1); }
  poly([[cx+nw*0.26, ny+nh+U*0.005],[cx+nw*0.55, ny+nh+U*0.02],[cx+nw*0.52, ny+nh+U*0.07],[cx+nw*0.30, ny+nh+U*0.08]]); edge(0.7, 1.3);

  // slide: the hull of the two faces, then its edges
  poly([N[3], N[0], Fq[0], Fq[1], N[1], N[2]], true); g.fillStyle = INK; g.fill();
  poly(N, true); edge(0.9, 1.6);
  poly(Fq, true); edge(0.9, 1.3);
  for (let k=0;k<4;k++){ poly([N[k], Fq[k]]); edge(0.8, 1.3); }
  poly([lerp(N[0], N[1], 0.5), lerp(Fq[0], Fq[1], 0.5)]); edge(0.3, 1);
  // rear sight notch
  poly([[cx-nw*0.18, ny],[cx-nw*0.18, ny-U*0.018],[cx-nw*0.06, ny-U*0.018],[cx-nw*0.06, ny]]); edge(0.9, 1.3);
  poly([[cx+nw*0.06, ny],[cx+nw*0.06, ny-U*0.018],[cx+nw*0.18, ny-U*0.018],[cx+nw*0.18, ny]]); edge(0.9, 1.3);

  // charge cells along the top of the slide, one per quarter of CHARGE
  const lit = Math.ceil(game.charge/25);
  for (let k=0;k<4;k++){
    const t0 = 0.12 + k*0.2, t1 = t0 + 0.13;
    const a0 = lerp(N[0], Fq[0], t0), b0 = lerp(N[1], Fq[1], t0), a1 = lerp(N[0], Fq[0], t1), b1 = lerp(N[1], Fq[1], t1);
    poly([lerp(a0, b0, 0.22), lerp(a0, b0, 0.78), lerp(a1, b1, 0.78), lerp(a1, b1, 0.22)], true);
    const on = k < lit;
    g.fillStyle = on ? `rgba(${BOLT},${(0.55 + 0.35*(game.charge/100)).toFixed(3)})` : `rgba(${CELL_B},0.10)`;
    g.fill();
    g.strokeStyle = `rgba(${BOLT},${on ? 0.9 : 0.3})`; g.lineWidth = 1; g.stroke();
  }

  // emitter
  const ec = [cx, fy + fh*0.5], er = fw*0.3;
  g.beginPath(); g.ellipse(ec[0], ec[1], er, er*0.8, 0, 0, Math.PI*2);
  g.fillStyle = `rgba(${BOLT},${(0.15 + 0.5*(game.charge/100)).toFixed(3)})`; g.fill();
  g.strokeStyle = `rgba(${BOLT},0.95)`; g.lineWidth = 1.4; g.stroke();
  g.beginPath(); g.ellipse(ec[0], ec[1], er*0.45, er*0.36, 0, 0, Math.PI*2); g.stroke();

  // muzzle flash
  if (game.casting){
    const t = game.castT/0.09, R = U*0.09*(1 - t*0.4);
    g.globalCompositeOperation = 'lighter';
    const grd = g.createRadialGradient(ec[0], ec[1], 0, ec[0], ec[1], R*1.6);
    grd.addColorStop(0, `rgba(${NUM},${(0.9*(1-t)).toFixed(3)})`);
    grd.addColorStop(0.35, `rgba(${BOLT},${(0.5*(1-t)).toFixed(3)})`);
    grd.addColorStop(1, 'rgba(0,0,0,0)');
    g.fillStyle = grd; g.beginPath(); g.arc(ec[0], ec[1], R*1.6, 0, Math.PI*2); g.fill();
    g.strokeStyle = `rgba(${NUM},${(1-t).toFixed(3)})`; g.lineWidth = 1.5;
    g.beginPath();
    for (let i=0;i<8;i++){
      const a = i/8*Math.PI*2 + 0.3, r0 = R*0.25, r1 = R*(i%2 ? 0.7 : 1.2);
      g.moveTo(ec[0] + Math.cos(a)*r0, ec[1] + Math.sin(a)*r0*0.8);
      g.lineTo(ec[0] + Math.cos(a)*r1, ec[1] + Math.sin(a)*r1*0.8);
    }
    g.stroke();
    g.globalCompositeOperation = 'source-over';
  }
  g.restore();
}

// TEXTURED WORLD — Wolfenstein walls, Doom floors, in a low-res buffer that
// is scaled up with hard pixels into the aperture.
//
//   walls    one DDA ray per buffer column; the hit gives perpendicular
//            distance and where along the face it landed, so a column of
//            the wall texture is stretched onto the column. Exact for
//            vertical walls.
//   floors   each row below the horizon is one distance (eye height / row
//            offset); step across it in world space and sample the flat.
//            Ceilings mirror it, since the eye is mid-height.
//   sprites  drawn into the same buffer, far to near, clipped per column
//            against the wall depth buffer.
//   scale    Doom's: one texel is one map unit, 64 per world unit here, so
//            a wall cell is 128 texels wide and tall and a flat tiles twice.

async function loadTextures(){
  const dec = async src => {
    const im = await loadImg(src), cv = document.createElement('canvas');
    cv.width = im.width; cv.height = im.height;
    const o = cv.getContext('2d'); o.drawImage(im, 0, 0);
    return {w: im.width, h: im.height, px: new Uint32Array(o.getImageData(0, 0, im.width, im.height).data.buffer.slice(0)), img: cv};
  };
  for (const [k, s] of Object.entries(TEXSRC.tex)) TX[k] = await dec(s);
  for (const [k, s] of Object.entries(TEXSRC.spr)) SPX[k] = await dec(s);
  TEXREADY = true;
}

// Which texture each rock cell wears, and which cells are lifts. Rebuilt per floor.
let WALLMAP = [], LIFTS = new Uint8Array(0), _mapFor = null;
function buildWallMap(){
  const L = game.L, th = THEMES[tierFor(game.levelNo).sprite] || THEMES.mutant;
  const total = th.walls.reduce((a, w) => a + w[1], 0);
  WALLMAP = new Array(L.w*L.h);
  for (let z=0; z<L.h; z++) for (let x=0; x<L.w; x++){
    // Hash on 2x2 blocks so variants come in patches, not confetti.
    let hsh = (((x>>1)*73856093) ^ ((z>>1)*19349663) ^ (game.levelNo*83492791)) >>> 0;
    hsh = (hsh ^ (hsh >>> 13)) * 1274126177 >>> 0;
    let r = hsh % total, pick = th.walls[0][0];
    for (const [n, wgt] of th.walls){ if (r < wgt){ pick = n; break; } r -= wgt; }
    WALLMAP[z*L.w+x] = TX[pick];
  }
  LIFTS = new Uint8Array(L.w*L.h);
  for (const it of game.items) if (it.type === 'lift') LIFTS[it.gz*L.w + it.gx] = 1;
  _mapFor = L;
}

let RB = null, RV = null;
function rbEnsure(w, h){
  if (!RB || RB.w !== w || RB.h !== h){
    const cv = document.createElement('canvas'); cv.width = w; cv.height = h;
    const ctx = cv.getContext('2d'), img = ctx.createImageData(w, h);
    RB = {w, h, cv, ctx, img, px: new Uint32Array(img.data.buffer), z: new Float32Array(w)};
  }

}
// Doom's light diminishing, roughly: full bright near, a dim floor far out.
const shadeOf = dU => { const s = 1.2 - dU/24; return s < 0.2 ? 0.2 : s > 1 ? 1 : s; };
function shd(c, s){
  return (0xff000000 | ((((c>>>16)&255)*s>>8)<<16) | ((((c>>>8)&255)*s>>8)<<8) | (((c&255)*s)>>8)) >>> 0;
}
function mix(a, b, t){        // a -> b by t (0..256)

          (((((a>>>8)&255)*u + ((b>>>8)&255)*t)>>8)<<8) | ((((a&255)*u + (b&255)*t)>>8))) >>> 0;
}

// Stretch src (w x h Uint32, alpha-keyed) into buffer rect, clipped per column
// against the wall depth. tint: 0..256 blend toward white; alpha: 0..256.
function blit(B, src, sw, sh, x0, y0, dw, dh, depth, s256, tint, alpha){
  if (dw < 0.5 || dh < 0.5) return;
  const xa = Math.max(0, Math.ceil(x0 - 0.5)), xb = Math.min(B.w, Math.ceil(x0 + dw - 0.5));

      const v = Math.min(sh-1, ((y + 0.5 - y0)/dh*sh) | 0);

    const view = SET.views[kv], unit = SET.h*e.s.scale/SET.srcH;

    if (death){ const t = death.age/death.dur; scaleY = Math.max(0.02, 1 - t*t); alpha = ((1 - t)*256)|0; }
    const lunge = e.lunge > 0 ? 1 + 0.07*Math.sin((0.3 - e.lunge)/0.3*Math.PI) : 1;
    const bobE = e.walking ? Math.abs(Math.sin(e.phase))*0.045 : 0;
    const dw = view.w*unit*sc*lunge*wide, dh = view.h*unit*sc*lunge*scaleY;
    const ax = RW/2 + pc[0]*sc, feet = hz + (1 - bobE)*sc;
    const x0 = ax - view.com*unit*sc*lunge*wide, y0 = feet - dh;
    let li = 0; const set = view.chain;
    while (li + 1 < set.length && set[li+1].w >= dw) li++;
    const Lv = set[li], sx = dw/Lv.w, sy = dh/Lv.h;
    const tint = e.pain > 0 ? ((Math.min(1, e.pain/0.14)*200)|0) : death ? (((1 - death.age/death.dur)*120)|0) : 0;
    blit(B, Lv.b32, Lv.W, Lv.H, x0 - Lv.pad*sx, y0 - Lv.pad*sy, Lv.W*sx, Lv.H*sy, s.z, s256, tint, alpha);
  }

  B.ctx.putImageData(B.img, 0, 0);
  const sm = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  g.drawImage(B.cv, v.x, v.y, v.w, v.h);
  g.imageSmoothingEnabled = sm;

  // Vector overlays that still belong to the world, gated by the depth buffer.
  for (const it of game.items) if (it.type === 'lift' && vis2(it.x, it.z) && !texOccluded(it.x, it.z)) drawItem({it});
  for (const b of game.bolts) if (!texOccluded(b.x, b.z)) drawBolt({b});
  for (const fx2 of game.fx) if (!texOccluded(fx2.x, fx2.z)) drawFx({fx: fx2});
}
// Is the world point (cells) behind the wall seen in its buffer column?
function texOccluded(x, z){
  if (!RB || !RV) return false;
  const pc = toCam(x*CELL, 0, z*CELL);
  if (pc[2] < NEAR) return true;
  const sx = pcx + pc[0]*f/pc[2], col = Math.floor((sx - RV.x)/RV.w*RB.w);
  if (col < 0 || col >= RB.w) return false;
  return RB.z[col] < pc[2] - 0.2;
}

// Freedoom's pistol, Doom-style: idle frame A, fire B-C-D with the flash.
function drawWeaponDoom(v){
  const sc = v.h/150, mv = game.moving ? 1 : 0.3;
  const bx = Math.cos(game.bob*0.5)*v.h*0.02*mv, by = Math.abs(Math.sin(game.bob*0.5))*v.h*0.025*mv;
  let name = 'pisga0', flashOn = false;
  if (game.castCd > 0){
    const t = 1 - game.castCd/0.26;
    name = t < 0.3 ? 'pisgb0' : t < 0.6 ? 'pisgc0' : 'pisgd0';
    flashOn = t < 0.3;
  }
  const S = SPX[name]; if (!S) return;
  const w = S.w*sc, h = S.h*sc, x = v.x + v.w/2 - w/2 + bx, y = v.y + v.h - h + by + v.h*0.01;
  g.save(); g.beginPath(); g.rect(v.x, v.y, v.w, v.h); g.clip();
  g.imageSmoothingEnabled = false;
  if (flashOn && SPX.pisfa0){ const F = SPX.pisfa0; g.drawImage(F.img, v.x + v.w/2 - F.w*sc/2 + bx, y - F.h*sc*0.72, F.w*sc, F.h*sc); }
  g.drawImage(S.img, x, y, w, h);
  g.restore();
}


function drawWorld(v){
  g.save();
  g.beginPath(); g.rect(v.x, v.y, v.w, v.h); g.clip();
  g.fillStyle = INK; g.fillRect(v.x, v.y, v.w, v.h);

  pcx = v.x + v.w/2;
  pcy = v.y + v.h/2;
  f = (v.w/2) / Math.tan(HFOV/2);
  lodScale = Math.max(0.45, Math.min(1, v.h / H));

  // Head bob lives in the camera, not the weapon only.
  const bob = game.mode === 'play' && game.moving ? Math.sin(game.bob)*0.025 : 0;
  camX = game.px*CELL; camZ = game.pz*CELL;
  camCos = Math.cos(game.pa); camSin = Math.sin(game.pa);
  pcy += bob*f;

  statVerts = 0; statSprites = 0;
  g.lineJoin = 'round'; g.lineCap = 'round';
  castVisibility(v);
  if (opt.tex && TEXREADY) renderTex(v, bob);
  else {
  const list = buildDrawList();
  // Pass 1: floor and ceiling. Nothing lies below the floor or above the
  // ceiling, so they never occlude and never need sorting.
  for (const it of list) if (it.kind === 'flat') drawFlat(it);
  // Pass 2: everything that stands up, far cells first.
  for (const it of list){
    switch (it.kind){
      case 'wall':  drawWallItem(it); break;
      case 'door':  drawDoor(it); break;
      case 'item':  drawItem(it); break;
      case 'enemy': drawEnemy(it); break;
      case 'bolt':  drawBolt(it); break;
      case 'fx':    drawFx(it); break;
    }
  }
  }
  if (game.mode === 'play'){
    if (opt.tex && TEXREADY && opt.gun === 'doom') drawWeaponDoom(v); else drawWeapon(v);
    g.strokeStyle = opt.clean ? 'rgba(0,0,0,0)' : `rgba(${PHOS},0.8)`; g.lineWidth = 1.2;
    const r = Math.min(v.w,v.h)*0.014, cx = v.x + v.w/2, cy = v.y + v.h/2;
    g.beginPath();
    g.moveTo(cx-r,cy); g.lineTo(cx-r*0.34,cy); g.moveTo(cx+r*0.34,cy); g.lineTo(cx+r,cy);
    g.moveTo(cx,cy-r); g.lineTo(cx,cy-r*0.34); g.moveTo(cx,cy+r*0.34); g.lineTo(cx,cy+r);
    g.stroke();
  }
  if (game.dmgFlash > 0){ g.fillStyle = `rgba(${WARN},${(game.dmgFlash*0.7).toFixed(3)})`; g.fillRect(v.x, v.y, v.w, v.h); }
  if (game.mode === 'dead' || game.mode === 'over'){ g.fillStyle = `rgba(${WARN},${Math.min(0.35, game.modeT*0.3).toFixed(3)})`; g.fillRect(v.x, v.y, v.w, v.h); }
  drawMessages(v);
  g.restore();
}

function textGlow(txt, x, y, size, rgb, alpha, align){
  g.font = `${size}px ui-monospace,Menlo,Consolas,monospace`;
  g.textAlign = align || 'center'; g.textBaseline = 'middle';
  if (opt.bloom){ g.fillStyle = `rgba(${rgb},${(alpha*0.25).toFixed(3)})`; g.fillText(txt, x+1, y+1); g.fillText(txt, x-1, y-1); }
  g.fillStyle = `rgba(${rgb},${alpha.toFixed(3)})`; g.fillText(txt, x, y);
}
function drawMessages(v){
  const size = Math.max(11, v.h*0.036);

  if (game.ts < 1)
    textGlow(`SPEED ${game.ts < 0.1 ? game.ts.toFixed(2) : game.ts.toFixed(2).replace(/0$/,'')}\u00d7`, v.x + v.w*0.015, v.y + size*1.1, size*0.8, LBL, 0.9, 'left');

    g.fillStyle = 'rgba(5,8,10,0.35)'; g.fillRect(v.x, v.y, v.w, v.h);
    textGlow('PAUSED', v.x + v.w/2, v.y + v.h*0.42, Math.max(18, v.h*0.08), PHOS, 0.95);
    textGlow('ESC OR CLICK TO RESUME   H HIDES THIS FOR SCREENSHOTS   - / = SPEED', v.x + v.w/2, v.y + v.h*0.42 + Math.max(18, v.h*0.08)*1.1, size*0.8, LBL, 0.85);
  }
  const boss = game.mode === 'play' && bossAlive();
  if (boss && boss.state > 0){
    const bw = v.w*0.42, bh = Math.max(4, v.h*0.014), bx = v.x + (v.w - bw)/2, by = v.y + v.h*0.045;
    g.fillStyle = 'rgba(5,8,10,0.6)'; g.fillRect(bx, by, bw, bh);
    g.fillStyle = `rgba(${WARN},0.85)`; g.fillRect(bx, by, bw*Math.max(0, boss.hp/boss.hp0), bh);
    g.strokeStyle = `rgba(${WARN},0.95)`; g.lineWidth = 1; g.strokeRect(bx + 0.5, by + 0.5, bw - 1, bh - 1);
    textGlow(boss.s.name, bx - size*0.4, by + bh/2, size*0.8, WARN, 0.95, 'right');
  }
  game.msgs = game.msgs.filter(m => m.until > game.t);
  game.msgs.forEach((m, i) => {
    const left = m.until - game.t, a = Math.min(1, left/0.4) * Math.min(1, (m.dur - left + 0.05)/0.12);
    textGlow(m.text, v.x + v.w/2, v.y + v.h*0.10 + i*size*1.5, size, m.rgb, 0.95*a);
  });
  const big = Math.max(18, v.h*0.08), mid = Math.max(11, v.h*0.034), cx = v.x + v.w/2, cy = v.y + v.h*0.42;
  const blink = 0.55 + 0.45*Math.sin(game.t*4);
  if (game.mode === 'title' || game.mode === 'loading'){
    g.fillStyle = 'rgba(5,8,10,0.55)'; g.fillRect(v.x, v.y, v.w, v.h);
    textGlow('BOUNTY HUNTER', cx, cy, big, PHOS, 0.95);
    textGlow(game.mode === 'loading' ? 'BAKING SPRITES\u2026' : touch.on ? 'TAP TO START' : 'CLICK OR PRESS ENTER', cx, cy + big*1.2, mid, PHOS, game.mode === 'loading' ? 0.7 : blink);
    textGlow(touch.on ? 'PAD MOVES AND TURNS   CENTRE FIRES   USE OR WALK INTO DOORS'
                      : 'W/S MOVE   A/D STRAFE   \u2190/\u2192 OR MOUSE TURN   SPACE OPEN   F/CLICK FIRE   M SOUND   V LOOK   G GUN   ESC PAUSE   - / = SPEED', cx, cy + big*2.1, mid*0.8, LBL, 0.8);
    textGlow('START ON FLOOR 01. FIND THE LIFT. GO UP.', cx, cy + big*2.8, mid*0.8, PHOS, 0.6);
  } else if (game.mode === 'dead'){
    textGlow('HUNTER DOWN', cx, cy, big, WARN, 0.95);
    textGlow(`LIVES LEFT ${game.lives}  \u2014  ${touch.on ? 'TAP' : 'PRESS R'}`, cx, cy + big*1.2, mid, PHOS, blink);
  } else if (game.mode === 'over'){
    textGlow('GAME OVER', cx, cy, big, WARN, 0.95);
    textGlow(`SCORE ${game.score}  \u2014  ${touch.on ? 'TAP' : 'PRESS ENTER'}`, cx, cy + big*1.2, mid, PHOS, blink);
  } else if (game.mode === 'won'){
    g.fillStyle = 'rgba(5,8,10,0.5)'; g.fillRect(v.x, v.y, v.w, v.h);
    textGlow('YOU REACHED THE ROOF', cx, cy, big, PHOS, 0.95);
    textGlow(`SCORE ${game.score}   CACHES ${game.treasure}  \u2014  ${touch.on ? 'TAP' : 'PRESS ENTER'}`, cx, cy + big*1.2, mid, PHOS, blink);
  }
}

function plate(x,y,w,h,r=3){
  const grd = g.createLinearGradient(x,y,x,y+h);
  grd.addColorStop(0,PANEL_L); grd.addColorStop(0.5,PANEL); grd.addColorStop(1,PANEL_D);

}
function rivet(x,y,r){

  g.fillStyle = 'rgba(0,0,0,.5)';
  g.beginPath(); g.arc(x+r*0.22,y+r*0.24,r*0.55,0,7); g.fill();
}
function well(x,y,w,h,r=3){
