<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Phosphor Field</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap">
<style>
/* Layout: one-screen arcade — thin control strip on top, letterboxed 4:3 vector screen fills the rest, touch pad below on phones. Single dark look by design. */
:root{
  --void:#000000;
  --bezel:#07090d;
  --phosphor:#dce7ff;
  --phosphor-dim:#7f93b8;
  --glow:#5f8dff;
  --line:#1c2433;
  --ui:"Share Tech Mono", ui-monospace, "SF Mono", Menlo, Consolas, monospace;
  color-scheme: dark;
}
html,body{height:100%}
body{
  background:var(--void);color:var(--phosphor-dim);font-family:var(--ui);
  display:flex;flex-direction:column;overflow:hidden;
  padding-left:max(16px, env(safe-area-inset-left, 0px));
  padding-right:max(16px, env(safe-area-inset-right, 0px));
  -webkit-user-select:none;user-select:none;
}
header{display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding-block:10px;border-bottom:1px solid var(--line)}
h1{margin:0;font-size:15px;font-weight:400;letter-spacing:.22em;text-transform:uppercase;color:var(--phosphor);text-shadow:0 0 6px var(--glow)}
.help{font-size:12px;letter-spacing:.04em;flex:1;min-width:0}
.ctl{display:flex;gap:8px}
button{
  font-family:var(--ui);font-size:12px;letter-spacing:.08em;text-transform:uppercase;
  background:var(--bezel);color:var(--phosphor);border:1px solid var(--line);border-radius:4px;
  padding:6px 10px;cursor:pointer;touch-action:none;
}
button:hover{border-color:var(--phosphor-dim)}
button:focus-visible{outline:2px solid var(--glow);outline-offset:2px}
.stage{flex:1;min-height:0;position:relative;background:var(--void)}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.glass{position:absolute;inset:0;pointer-events:none;
  background:radial-gradient(ellipse at 50% 50%, transparent 55%, rgba(0,0,0,.55) 100%),
             linear-gradient(160deg, rgba(120,150,210,.05) 0%, transparent 35%)}
.pad{display:none;grid-template-columns:1fr auto 1fr;gap:10px;padding-block:10px;border-top:1px solid var(--line)}
.grp{display:flex;gap:10px}
.grp:last-child{justify-content:flex-end}
.pad button{height:64px;min-width:64px;font-size:14px;flex:1;max-width:120px}
.pad button.small{font-size:11px;min-width:56px;flex:none}
.pad button.on{background:#121a2a;border-color:var(--phosphor);box-shadow:0 0 10px var(--glow) inset}
@media (pointer:coarse){ .pad{display:grid} .help{display:none} }
@media (max-width:520px){ .help{display:none} }
</style>

<header>
  <h1>Phosphor Field</h1>
  <span class="help">← → rotate · ↑ thrust · Space fire · Shift hyperspace · V display · M sound</span>
  <div class="ctl">
    <button id="modeBtn" type="button">Display: Vector</button>
    <button id="sndBtn" type="button">Sound: On</button>
  </div>
</header>
<div class="stage" id="stage">
  <canvas id="screen" aria-label="Vector arcade game screen"></canvas>
  <div class="glass"></div>
</div>
<div class="pad" id="pad">
  <div class="grp"><button id="bL" data-k="left" type="button">◀</button><button id="bR" data-k="right" type="button">▶</button></div>
  <button id="bH" data-k="hyper" class="small" type="button">Hyper</button>
  <div class="grp"><button id="bT" data-k="thrust" type="button">Thrust</button><button id="bF" data-k="fire" type="button">Fire</button></div>
</div>

<script>
(() => {
const W = 1024, H = 768;
let cvs = document.getElementById('screen');           // visible canvas
const scene = document.createElement('canvas');          // this frame's beam drawing
const ctx = scene.getContext('2d');
const low = document.createElement('canvas'); low.width = 320; low.height = 240;
const lctx = low.getContext('2d');
let dpr = 1, cw = 1, ch = 1, S = 1, OX = 0, OY = 0;

// WebGL phosphor buffer: out = max(prev*keep - bias, current).
// The bias pulls every pixel to true black; 8-bit alpha fades on a 2D canvas stall a few levels above zero and ghost.
let gl = null, view2d = null;
let progDecay = null, progShow = null, sceneTex = null, uKeep = null, uBias = null, ping = 0;
const fboTex = [], fbo = [];
function mkShader(type, src) {
  const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s);
  if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
  return s;
}
function mkProg(vs, fs) {
  const p = gl.createProgram();
  gl.attachShader(p, mkShader(gl.VERTEX_SHADER, vs)); gl.attachShader(p, mkShader(gl.FRAGMENT_SHADER, fs));
  gl.bindAttribLocation(p, 0, 'p'); gl.linkProgram(p);
  if (!gl.getProgramParameter(p, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(p));
  return p;
}
function mkTex(w, h) {
  const t = gl.createTexture(); gl.bindTexture(gl.TEXTURE_2D, t);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MIN_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_MAG_FILTER, gl.LINEAR);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_S, gl.CLAMP_TO_EDGE);
  gl.texParameteri(gl.TEXTURE_2D, gl.TEXTURE_WRAP_T, gl.CLAMP_TO_EDGE);
  if (w) gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, w, h, 0, gl.RGBA, gl.UNSIGNED_BYTE, null);
  return t;
}
function glInit() {
  const VS = 'attribute vec2 p;varying vec2 uv;void main(){uv=p*0.5+0.5;gl_Position=vec4(p,0.0,1.0);}';
  progDecay = mkProg(VS, 'precision mediump float;varying vec2 uv;uniform sampler2D prev;uniform sampler2D cur;uniform float keep;uniform float bias;' +
    'void main(){vec3 a=max(texture2D(prev,uv).rgb*keep-bias,0.0);vec3 b=texture2D(cur,uv).rgb;gl_FragColor=vec4(max(a,b),1.0);}');
  progShow = mkProg(VS, 'precision mediump float;varying vec2 uv;uniform sampler2D tex;void main(){gl_FragColor=vec4(texture2D(tex,uv).rgb,1.0);}');
  const quad = gl.createBuffer(); gl.bindBuffer(gl.ARRAY_BUFFER, quad);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]), gl.STATIC_DRAW);
  gl.enableVertexAttribArray(0); gl.vertexAttribPointer(0, 2, gl.FLOAT, false, 0, 0);
  gl.pixelStorei(gl.UNPACK_FLIP_Y_WEBGL, true);
  sceneTex = mkTex(0, 0);
  gl.useProgram(progDecay);
  gl.uniform1i(gl.getUniformLocation(progDecay, 'prev'), 0);
  gl.uniform1i(gl.getUniformLocation(progDecay, 'cur'), 1);
  uKeep = gl.getUniformLocation(progDecay, 'keep'); uBias = gl.getUniformLocation(progDecay, 'bias');
  gl.useProgram(progShow);
  gl.uniform1i(gl.getUniformLocation(progShow, 'tex'), 0);
}
try { gl = cvs.getContext('webgl', { alpha: false, antialias: false, depth: false, stencil: false }); } catch (e) { gl = null; }
if (gl) {
  try { glInit(); } catch (e) {
    console.warn('WebGL phosphor disabled:', e);
    gl = null;
    const fresh = cvs.cloneNode(false); cvs.replaceWith(fresh); cvs = fresh;
  }
}
if (!gl) view2d = cvs.getContext('2d');

function clearPersist() {
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
  if (!gl) return;
  gl.clearColor(0, 0, 0, 1);
  for (let k = 0; k < 2; k++) { gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[k]); gl.clear(gl.COLOR_BUFFER_BIT); }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function allocPersist() {
  if (!gl) return;
  for (let k = 0; k < 2; k++) {
    if (fboTex[k]) { gl.deleteTexture(fboTex[k]); gl.deleteFramebuffer(fbo[k]); }
    fboTex[k] = mkTex(cw, ch);
    fbo[k] = gl.createFramebuffer(); gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[k]);
    gl.framebufferTexture2D(gl.FRAMEBUFFER, gl.COLOR_ATTACHMENT0, gl.TEXTURE_2D, fboTex[k], 0);
  }
  gl.bindFramebuffer(gl.FRAMEBUFFER, null);
}
function present(keep, bias) {
  if (!gl) { view2d.drawImage(scene, 0, 0); return; }
  gl.activeTexture(gl.TEXTURE1); gl.bindTexture(gl.TEXTURE_2D, sceneTex);
  gl.texImage2D(gl.TEXTURE_2D, 0, gl.RGBA, gl.RGBA, gl.UNSIGNED_BYTE, scene);
  const nxt = ping ^ 1;
  gl.bindFramebuffer(gl.FRAMEBUFFER, fbo[nxt]); gl.viewport(0, 0, cw, ch);
  gl.useProgram(progDecay); gl.uniform1f(uKeep, keep); gl.uniform1f(uBias, bias);
  gl.activeTexture(gl.TEXTURE0); gl.bindTexture(gl.TEXTURE_2D, fboTex[ping]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  gl.bindFramebuffer(gl.FRAMEBUFFER, null); gl.viewport(0, 0, cw, ch);
  gl.useProgram(progShow);
  gl.bindTexture(gl.TEXTURE_2D, fboTex[nxt]);
  gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
  ping = nxt;
}

function resize() {
  const r = cvs.getBoundingClientRect();
  dpr = Math.min(window.devicePixelRatio || 1, 2);
  cw = Math.max(1, Math.round(r.width * dpr)); ch = Math.max(1, Math.round(r.height * dpr));
  cvs.width = cw; cvs.height = ch; scene.width = cw; scene.height = ch;
  S = Math.min(cw / W, ch / H);
  OX = (cw - W * S) / 2; OY = (ch - H * S) / 2;
  allocPersist(); clearPersist();
}
new ResizeObserver(resize).observe(cvs);
resize();

// ---------- stroke font (4x6 grid) ----------
const FONT = {
  '0':[[0,0,4,0,4,6,0,6,0,0],[4,0,0,6]], '1':[[2,0,2,6]], '2':[[0,0,4,0,4,3,0,3,0,6,4,6]],
  '3':[[0,0,4,0,4,6,0,6],[0,3,4,3]], '4':[[0,0,0,3,4,3],[4,0,4,6]], '5':[[4,0,0,0,0,3,4,3,4,6,0,6]],
  '6':[[0,0,0,6,4,6,4,3,0,3]], '7':[[0,0,4,0,4,6]], '8':[[0,0,4,0,4,6,0,6,0,0],[0,3,4,3]],
  '9':[[4,3,0,3,0,0,4,0,4,6]],
  'A':[[0,6,0,2,2,0,4,2,4,6],[0,4,4,4]], 'C':[[4,0,0,0,0,6,4,6]], 'D':[[0,0,3,0,4,2,4,4,3,6,0,6,0,0]],
  'E':[[4,0,0,0,0,6,4,6],[0,3,3,3]], 'F':[[4,0,0,0,0,6],[0,3,3,3]], 'G':[[4,0,0,0,0,6,4,6,4,4,2,4]],
  'H':[[0,0,0,6],[4,0,4,6],[0,3,4,3]], 'I':[[0,0,4,0],[2,0,2,6],[0,6,4,6]], 'L':[[0,0,0,6,4,6]],
  'M':[[0,6,0,0,2,2,4,0,4,6]], 'N':[[0,6,0,0,4,6,4,0]], 'O':[[0,0,4,0,4,6,0,6,0,0]],
  'P':[[0,6,0,0,4,0,4,3,0,3]], 'R':[[0,6,0,0,4,0,4,3,0,3],[1,3,4,6]], 'S':[[4,0,0,0,0,3,4,3,4,6,0,6]],
  'T':[[0,0,4,0],[2,0,2,6]], 'U':[[0,0,0,6,4,6,4,0]], 'V':[[0,0,2,6,4,0]], 'W':[[0,0,1,6,2,3,3,6,4,0]],
  'Y':[[0,0,2,3,4,0],[2,3,2,6]], 'K':[[0,0,0,6],[4,0,0,3,4,6]]
};

// ---------- display list ----------
const segs = [], dots = [];
function line(x1, y1, x2, y2, i) { segs.push(x1, y1, x2, y2, i); }
function dot(x, y, i) { dots.push(x, y, i); }
function poly(pts, x, y, a, sc, i, closed) {
  const c = Math.cos(a), s = Math.sin(a);
  let px = 0, py = 0, fx = 0, fy = 0;
  for (let k = 0; k < pts.length; k++) {
    const p = pts[k];
    const X = x + (p[0] * c - p[1] * s) * sc, Y = y + (p[0] * s + p[1] * c) * sc;
    if (k) line(px, py, X, Y, i); else { fx = X; fy = Y; }
    px = X; py = Y;
  }
  if (closed) line(px, py, fx, fy, i);
}
function text(str, x, y, size, i, align) {
  const u = size / 6, adv = 6 * u, w = str.length * adv - 2 * u;
  let sx = align === 'right' ? x - w : align === 'left' ? x : x - w / 2;
  for (const chr of str) {
    const g = FONT[chr];
    if (g) for (const pl of g) for (let k = 2; k < pl.length; k += 2)
      line(sx + pl[k - 2] * u, y + pl[k - 1] * u, sx + pl[k] * u, y + pl[k + 1] * u, i);
    sx += adv;
  }
}

// ---------- renderers ----------
let mode = 'vector', modeT = 0;
// Phosphor tuning: PERSIST_S = seconds for a lit pixel to fall to 10%; PERSIST_BIAS = linear drop per 60 Hz frame,
// which trims the dim tail so fast movers leave a short glint, not a streak.
const PERSIST_S = 0.045, PERSIST_BIAS = 6 / 255;
const PASSES = [[11, 0.06, '#4f7dff'], [5, 0.14, '#7fa6ff'], [2.4, 0.3, '#b4ccff'], [1.1, 0.95, '#f6f9ff']];

function renderVector(dt) {
  const keep = Math.pow(0.1, dt / 0.12);           // phosphor decay: ~10% left after 120 ms
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = gl ? '#000' : 'rgba(0,0,0,' + (1 - keep).toFixed(3) + ')';   // GL path decays in the shader
  ctx.fillRect(0, 0, cw, ch);
  ctx.globalCompositeOperation = 'lighter';
  ctx.lineCap = 'round';
  const n = segs.length;
  for (let p = 0; p < PASSES.length; p++) {
    const [w, a, col] = PASSES[p];
    ctx.strokeStyle = col; ctx.lineWidth = Math.max(1, w * S);
    for (let k = 0; k < n; k += 5) {
      const L = Math.hypot(segs[k + 2] - segs[k], segs[k + 3] - segs[k + 1]);
      const f = Math.min(1.4, 0.72 + 12 / (L + 5));   // short strokes: beam moves slower, draws brighter
      ctx.globalAlpha = Math.min(1, a * segs[k + 4] * f);
      ctx.beginPath();
      ctx.moveTo(OX + segs[k] * S, OY + segs[k + 1] * S);
      ctx.lineTo(OX + segs[k + 2] * S, OY + segs[k + 3] * S);
      ctx.stroke();
    }
  }
  // beam dwell at vertices
  ctx.fillStyle = '#ffffff';
  const v = Math.max(1.5, 1.7 * S);
  for (let k = 0; k < n; k += 5) {
    ctx.globalAlpha = 0.3 * segs[k + 4];
    ctx.fillRect(OX + segs[k] * S - v / 2, OY + segs[k + 1] * S - v / 2, v, v);
    ctx.fillRect(OX + segs[k + 2] * S - v / 2, OY + segs[k + 3] * S - v / 2, v, v);
  }
  // point plots (shots, sparks)
  for (let k = 0; k < dots.length; k += 3) {
    const x = OX + dots[k] * S, y = OY + dots[k + 1] * S, i = dots[k + 2];
    ctx.globalAlpha = 0.12 * i; ctx.fillStyle = '#4f7dff';
    ctx.beginPath(); ctx.arc(x, y, Math.max(5, 11 * S), 0, 6.2832); ctx.fill();
    ctx.globalAlpha = 0.28 * i; ctx.fillStyle = '#8fb2ff';
    ctx.beginPath(); ctx.arc(x, y, Math.max(3, 5 * S), 0, 6.2832); ctx.fill();
    ctx.globalAlpha = Math.min(1, i); ctx.fillStyle = '#ffffff';
    ctx.beginPath(); ctx.arc(x, y, Math.max(1.3, 1.7 * S), 0, 6.2832); ctx.fill();
  }
  ctx.globalAlpha = 1; ctx.globalCompositeOperation = 'source-over';
}

function renderLCD() {
  const k = 320 / W;
  lctx.globalAlpha = 1;
  lctx.fillStyle = '#1b2029'; lctx.fillRect(0, 0, 320, 240);   // backlight bleed: black is never black
  lctx.strokeStyle = '#c9d3e2'; lctx.lineWidth = 1;
  lctx.beginPath();
  for (let j = 0; j < segs.length; j += 5) {
    lctx.moveTo(segs[j] * k, segs[j + 1] * k);
    lctx.lineTo(segs[j + 2] * k, segs[j + 3] * k);
  }
  lctx.stroke();
  lctx.fillStyle = '#c9d3e2';
  for (let j = 0; j < dots.length; j += 3) lctx.fillRect(Math.round(dots[j] * k), Math.round(dots[j + 1] * k), 1, 1);
  ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = 1;
  ctx.fillStyle = '#000'; ctx.fillRect(0, 0, cw, ch);
  ctx.imageSmoothingEnabled = false;
  ctx.drawImage(low, OX, OY, W * S, H * S);
}

// ---------- audio ----------
let AC = null, master = null, noiseBuf = null, thrustGain = null, saucerOsc = null, saucerGain = null;
let sound = true;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { AC = null; return; }
  master = AC.createGain(); master.gain.value = sound ? 0.5 : 0; master.connect(AC.destination);
  const len = AC.sampleRate;
  noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
  const d = noiseBuf.getChannelData(0);
  for (let k = 0; k < len; k++) d[k] = Math.random() * 2 - 1;
  const ns = AC.createBufferSource(); ns.buffer = noiseBuf; ns.loop = true;
  const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 360;
  thrustGain = AC.createGain(); thrustGain.gain.value = 0;
  ns.connect(lp); lp.connect(thrustGain); thrustGain.connect(master); ns.start();
  saucerOsc = AC.createOscillator(); saucerOsc.type = 'square'; saucerOsc.frequency.value = 520;
  const lfo = AC.createOscillator(); lfo.frequency.value = 7;
  const lg = AC.createGain(); lg.gain.value = 90;
  lfo.connect(lg); lg.connect(saucerOsc.frequency);
  saucerGain = AC.createGain(); saucerGain.gain.value = 0;
  saucerOsc.connect(saucerGain); saucerGain.connect(master);
  saucerOsc.start(); lfo.start();
}
function blip(f1, f2, dur, type, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const o = AC.createOscillator(); o.type = type;
  o.frequency.setValueAtTime(f1, t); o.frequency.exponentialRampToValueAtTime(f2, t + dur);
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.03);
}
function boom(dur, freq, vol) {
  if (!AC) return;
  const t = AC.currentTime;
  const s = AC.createBufferSource(); s.buffer = noiseBuf;
  const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = freq;
  const g = AC.createGain(); g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.001, t + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.03);
}

// ---------- game ----------
const rnd = (a, b) => a + Math.random() * (b - a);
function wrap(o) { if (o.x < 0) o.x += W; else if (o.x >= W) o.x -= W; if (o.y < 0) o.y += H; else if (o.y >= H) o.y -= H; }
function wdist(a, b) {
  let dx = Math.abs(a.x - b.x), dy = Math.abs(a.y - b.y);
  if (dx > W / 2) dx = W - dx; if (dy > H / 2) dy = H - dy;
  return Math.hypot(dx, dy);
}
const ROCK_R = { 3: 42, 2: 22, 1: 11 };
const ROCK_PTS = { 3: 20, 2: 50, 1: 100 };
const SHIP = [[13, 0], [-10, -8], [-6, 0], [-10, 8]];
const FLAME = [[-7, -4], [-17, 0], [-7, 4]];
const SAUCER = [
  [[-1, 0], [-0.45, 0.38], [0.45, 0.38], [1, 0], [-1, 0]],
  [[-1, 0], [-0.45, -0.32], [0.45, -0.32], [1, 0]],
  [[-0.45, -0.32], [-0.25, -0.72], [0.25, -0.72], [0.45, -0.32]]
];

function rockShape() {
  const n = 10 + (Math.random() * 3 | 0), pts = [], notch = Math.random() * n | 0;
  for (let k = 0; k < n; k++) {
    const a = k / n * Math.PI * 2 + rnd(-0.12, 0.12);
    const r = k === notch ? rnd(0.4, 0.55) : rnd(0.78, 1.05);
    pts.push([Math.cos(a) * r, Math.sin(a) * r]);
  }
  return pts;
}
function makeRock(size, x, y, boost) {
  const a = rnd(0, Math.PI * 2), sp = (rnd(30, 70) * (4 - size) * 0.6 + 20) * (boost || 1);
  return { x, y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp, size, r: ROCK_R[size], shape: rockShape(), rot: rnd(0, 6.28) };
}
function newShip() { return { x: W / 2, y: H / 2, vx: 0, vy: 0, a: -Math.PI / 2, alive: true, hyper: 0, thrust: false }; }

let state = 'attract', score = 0, lives = 0, wave = 0, waveTime = 0, nextLife = 10000;
let rocks = [], bullets = [], ebullets = [], parts = [], debris = [];
let ship = newShip(); ship.alive = false;
let saucer = null, saucerT = 15, respawnT = 0, nextWaveT = -1, overT = 0, beatT = 0, beatHi = false, time = 0;
let hi = 0;
try { hi = parseInt(localStorage.getItem('phosphor-hi') || '0', 10) || 0; } catch (e) { hi = 0; }

function spawnWave() {
  wave++; waveTime = 0;
  const n = Math.min(11, 2 + wave * 2);
  for (let k = 0; k < n; k++) {
    let x, y, tries = 0;
    do {
      if (Math.random() < 0.5) { x = rnd(0, W); y = Math.random() < 0.5 ? 0 : H - 1; }
      else { x = Math.random() < 0.5 ? 0 : W - 1; y = rnd(0, H); }
      tries++;
    } while (ship.alive && wdist({ x, y }, ship) < 200 && tries < 20);
    rocks.push(makeRock(3, x, y));
  }
}
function attractField() {
  rocks = [];
  for (let k = 0; k < 7; k++) rocks.push(makeRock(1 + (k % 3), rnd(0, W), rnd(0, H)));
}
function newGame() {
  score = 0; lives = 3; wave = 0; nextLife = 10000;
  rocks = []; bullets = []; ebullets = []; parts = []; debris = [];
  saucer = null; saucerT = rnd(14, 20); nextWaveT = -1; beatT = 0.6;
  ship = newShip(); state = 'play';
  spawnWave();
}
function addScore(p) {
  score += p;
  if (score >= nextLife) { lives++; nextLife += 10000; blip(900, 1800, 0.25, 'square', 0.08); }
  if (score > hi) { hi = score; try { localStorage.setItem('phosphor-hi', String(hi)); } catch (e) {} }
}
function burst(x, y, n, spd) {
  for (let k = 0; k < n; k++) {
    const a = rnd(0, 6.283), v = rnd(30, spd);
    parts.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: rnd(0.4, 0.9) });
  }
}
function splitRock(idx, award) {
  const R = rocks[idx]; rocks.splice(idx, 1);
  if (award) addScore(ROCK_PTS[R.size]);
  burst(R.x, R.y, 4 + R.size * 4, 60 + R.size * 30);
  boom(0.25 + R.size * 0.12, 300 + (4 - R.size) * 250, 0.35);
  if (R.size > 1) for (let k = 0; k < 2; k++) rocks.push(makeRock(R.size - 1, R.x, R.y, 1.15));
}
function killShip() {
  ship.alive = false; ship.thrust = false;
  const c = Math.cos(ship.a), s = Math.sin(ship.a);
  for (let k = 0; k < SHIP.length; k++) {
    const p = SHIP[k], q = SHIP[(k + 1) % SHIP.length];
    const mx = (p[0] + q[0]) / 2, my = (p[1] + q[1]) / 2;
    const x = ship.x + mx * c - my * s, y = ship.y + mx * s + my * c;
    const len = Math.hypot(q[0] - p[0], q[1] - p[1]);
    debris.push({ x, y, vx: ship.vx * 0.3 + rnd(-60, 60), vy: ship.vy * 0.3 + rnd(-60, 60),
      a: Math.atan2(q[1] - p[1], q[0] - p[0]) + ship.a, va: rnd(-4, 4), len, life: rnd(1.2, 2) });
  }
  burst(ship.x, ship.y, 14, 140);
  boom(0.9, 700, 0.5);
  lives--; respawnT = 2.2;
}
function killSaucer(award) {
  if (award) addScore(saucer.small ? 1000 : 200);
  burst(saucer.x, saucer.y, 14, 160); boom(0.6, 900, 0.45);
  saucer = null; saucerT = rnd(8, 15);
}
function spawnSaucer() {
  const small = score >= 10000 ? Math.random() < 0.75 : Math.random() < 0.15 + wave * 0.05;
  const fromLeft = Math.random() < 0.5;
  saucer = { small, r: small ? 10 : 20, x: fromLeft ? -20 : W + 20, y: rnd(110, H - 110),
    vx: (fromLeft ? 1 : -1) * (small ? 160 : 115), vy: 0, dirT: rnd(1, 2.5), fireT: small ? 0.8 : 1.1 };
}
function fire() {
  if (bullets.length >= 4) return;
  const c = Math.cos(ship.a), s = Math.sin(ship.a);
  bullets.push({ x: ship.x + c * 13, y: ship.y + s * 13, vx: ship.vx + c * 620, vy: ship.vy + s * 620, life: 1.45 });
  blip(1400, 320, 0.11, 'square', 0.06);
}

// ---------- input ----------
const keys = { left: false, right: false, thrust: false };
let firePressed = false, hyperPressed = false;
const KEYMAP = { ArrowLeft: 'left', KeyA: 'left', ArrowRight: 'right', KeyD: 'right', ArrowUp: 'thrust', KeyW: 'thrust' };
window.addEventListener('keydown', e => {
  if (e.code in KEYMAP) { keys[KEYMAP[e.code]] = true; e.preventDefault(); audioInit(); return; }
  if (e.code === 'Space' || e.code === 'Enter') { if (!e.repeat) firePressed = true; e.preventDefault(); audioInit(); return; }
  if (e.code === 'ShiftLeft' || e.code === 'ShiftRight' || e.code === 'ArrowDown' || e.code === 'KeyS') { if (!e.repeat) hyperPressed = true; e.preventDefault(); return; }
  if (e.code === 'KeyV' && !e.repeat) toggleMode();
  if (e.code === 'KeyM' && !e.repeat) toggleSound();
});
window.addEventListener('keyup', e => { if (e.code in KEYMAP) keys[KEYMAP[e.code]] = false; });
window.addEventListener('blur', () => { keys.left = keys.right = keys.thrust = false; });

document.querySelectorAll('.pad button').forEach(b => {
  const k = b.dataset.k;
  const down = e => {
    e.preventDefault(); audioInit();
    try { b.setPointerCapture(e.pointerId); } catch (err) {}
    b.classList.add('on');
    if (k === 'fire') firePressed = true; else if (k === 'hyper') hyperPressed = true; else keys[k] = true;
  };
  const up = () => { b.classList.remove('on'); if (k in keys) keys[k] = false; };
  b.addEventListener('pointerdown', down);
  b.addEventListener('pointerup', up);
  b.addEventListener('pointercancel', up);
  b.addEventListener('contextmenu', e => e.preventDefault());
});
cvs.addEventListener('pointerdown', () => { audioInit(); if (state !== 'play') firePressed = true; });

const modeBtn = document.getElementById('modeBtn'), sndBtn = document.getElementById('sndBtn');
function toggleMode() {
  mode = mode === 'vector' ? 'lcd' : 'vector'; modeT = 1.6;
  modeBtn.textContent = 'Display: ' + (mode === 'vector' ? 'Vector' : 'LCD');
  clearPersist();
}
function toggleSound() {
  sound = !sound; sndBtn.textContent = 'Sound: ' + (sound ? 'On' : 'Off');
  if (master) master.gain.value = sound ? 0.5 : 0;
}
modeBtn.addEventListener('click', toggleMode);
sndBtn.addEventListener('click', () => { audioInit(); toggleSound(); });

// ---------- update ----------
function update(dt) {
  time += dt; waveTime += dt;
  if (modeT > 0) modeT -= dt;

  if (state !== 'play') {
    if (state === 'over') { overT -= dt; if (overT <= 0) state = 'attract'; }
    if (state === 'attract' && rocks.length === 0) attractField();
    if (firePressed && state === 'attract') newGame();
    else if (firePressed && state === 'over' && overT < 3.5) newGame();
    firePressed = false; hyperPressed = false;
  }

  if (state === 'play') {
    if (ship.alive) {
      if (ship.hyper > 0) {
        ship.hyper -= dt;
        if (ship.hyper <= 0) {
          ship.x = rnd(60, W - 60); ship.y = rnd(60, H - 60);
          if (Math.random() < 0.12) killShip();
        }
      } else {
        if (keys.left) ship.a -= 4.6 * dt;
        if (keys.right) ship.a += 4.6 * dt;
        ship.thrust = keys.thrust;
        if (ship.thrust) { ship.vx += Math.cos(ship.a) * 420 * dt; ship.vy += Math.sin(ship.a) * 420 * dt; }
        const drag = Math.pow(0.7, dt); ship.vx *= drag; ship.vy *= drag;
        const sp = Math.hypot(ship.vx, ship.vy);
        if (sp > 520) { ship.vx *= 520 / sp; ship.vy *= 520 / sp; }
        ship.x += ship.vx * dt; ship.y += ship.vy * dt; wrap(ship);
        if (firePressed) fire();
        if (hyperPressed) { ship.hyper = 0.55; ship.vx = ship.vy = 0; ship.thrust = false; }
      }
    } else if (lives > 0) {
      respawnT -= dt;
      if (respawnT <= 0) {
        const c = { x: W / 2, y: H / 2 };
        if (rocks.every(r => wdist(r, c) > 130) && (!saucer || wdist(saucer, c) > 160)) ship = newShip();
      }
    } else if (debris.length === 0) {
      state = 'over'; overT = 5;
    }
    firePressed = false; hyperPressed = false;

    // heartbeat
    if (rocks.length && ship.alive) {
      beatT -= dt;
      if (beatT <= 0) {
        blip(beatHi ? 64 : 54, 38, 0.12, 'square', 0.3); beatHi = !beatHi;
        beatT = Math.max(0.24, 1.0 - waveTime * 0.012);
      }
    }
    // saucer timer
    if (!saucer) { saucerT -= dt; if (saucerT <= 0 && rocks.length) spawnSaucer(); }
    // next wave
    if (rocks.length === 0) {
      if (nextWaveT < 0) nextWaveT = 2;
      nextWaveT -= dt;
      if (nextWaveT <= 0) { nextWaveT = -1; spawnWave(); }
    }
  }

  for (const r of rocks) { r.x += r.vx * dt; r.y += r.vy * dt; wrap(r); }
  for (let k = bullets.length - 1; k >= 0; k--) {
    const b = bullets[k]; b.x += b.vx * dt; b.y += b.vy * dt; wrap(b);
    if ((b.life -= dt) <= 0) bullets.splice(k, 1);
  }
  for (let k = ebullets.length - 1; k >= 0; k--) {
    const b = ebullets[k]; b.x += b.vx * dt; b.y += b.vy * dt; wrap(b);
    if ((b.life -= dt) <= 0) ebullets.splice(k, 1);
  }
  for (let k = parts.length - 1; k >= 0; k--) {
    const p = parts[k]; p.x += p.vx * dt; p.y += p.vy * dt;
    if ((p.life -= dt) <= 0) parts.splice(k, 1);
  }
  for (let k = debris.length - 1; k >= 0; k--) {
    const d = debris[k]; d.x += d.vx * dt; d.y += d.vy * dt; d.a += d.va * dt;
    if ((d.life -= dt) <= 0) debris.splice(k, 1);
  }

  if (saucer) {
    const sc = saucer;
    sc.x += sc.vx * dt; sc.y += sc.vy * dt;
    if (sc.y < 0) sc.y += H; else if (sc.y >= H) sc.y -= H;
    if ((sc.dirT -= dt) <= 0) { sc.vy = [-90, 0, 90][Math.random() * 3 | 0]; sc.dirT = rnd(1, 2.5); }
    if ((sc.fireT -= dt) <= 0 && state === 'play') {
      sc.fireT = sc.small ? 0.8 : 1.1;
      let a = rnd(0, 6.283);
      if (sc.small && ship.alive && ship.hyper <= 0) {
        const err = Math.max(0.05, 0.3 - score / 100000);
        a = Math.atan2(ship.y - sc.y, ship.x - sc.x) + rnd(-err, err);
      }
      ebullets.push({ x: sc.x, y: sc.y, vx: Math.cos(a) * 380, vy: Math.sin(a) * 380, life: 2.0 });
      blip(900, 500, 0.08, 'square', 0.04);
    }
    if (sc.x < -40 || sc.x > W + 40) { saucer = null; saucerT = rnd(8, 15); }
  }

  // collisions
  for (let b = bullets.length - 1; b >= 0; b--) {
    const B = bullets[b]; let hit = false;
    for (let r = rocks.length - 1; r >= 0; r--) {
      if (wdist(B, rocks[r]) < rocks[r].r) { splitRock(r, true); hit = true; break; }
    }
    if (!hit && saucer && wdist(B, saucer) < saucer.r) { killSaucer(true); hit = true; }
    if (hit) bullets.splice(b, 1);
  }
  for (let b = ebullets.length - 1; b >= 0; b--) {
    const B = ebullets[b]; let hit = false;
    if (ship.alive && ship.hyper <= 0 && wdist(B, ship) < 11) { killShip(); hit = true; }
    if (!hit) for (let r = rocks.length - 1; r >= 0; r--) {
      if (wdist(B, rocks[r]) < rocks[r].r) { splitRock(r, false); hit = true; break; }
    }
    if (hit) ebullets.splice(b, 1);
  }
  if (saucer) {
    for (let r = rocks.length - 1; r >= 0; r--) {
      if (wdist(saucer, rocks[r]) < rocks[r].r + saucer.r * 0.8) { splitRock(r, false); killSaucer(false); break; }
    }
  }
  if (state === 'play' && ship.alive && ship.hyper <= 0) {
    for (let r = rocks.length - 1; r >= 0; r--) {
      if (wdist(ship, rocks[r]) < rocks[r].r + 8) { splitRock(r, true); killShip(); break; }
    }
    if (ship.alive && saucer && wdist(ship, saucer) < saucer.r + 9) { killSaucer(true); killShip(); }
  }

  // continuous sounds
  if (AC) {
    const t = AC.currentTime;
    thrustGain.gain.setTargetAtTime(state === 'play' && ship.alive && ship.thrust ? 0.35 : 0, t, 0.03);
    saucerGain.gain.setTargetAtTime(saucer && state === 'play' ? 0.035 : 0, t, 0.05);
    if (saucer) saucerOsc.frequency.setValueAtTime(saucer.small ? 950 : 520, t);
  }
}

// ---------- scene ----------
function build() {
  segs.length = 0; dots.length = 0;
  for (const r of rocks) poly(r.shape, r.x, r.y, r.rot, r.r, 0.85, true);
  for (const b of bullets) dot(b.x, b.y, 1.2);
  for (const b of ebullets) dot(b.x, b.y, 1.1);
  for (const p of parts) dot(p.x, p.y, Math.min(1, p.life * 1.6));
  for (const d of debris) {
    const c = Math.cos(d.a) * d.len / 2, s = Math.sin(d.a) * d.len / 2;
    line(d.x - c, d.y - s, d.x + c, d.y + s, Math.min(1, d.life));
  }
  if (saucer) for (const pl of SAUCER) poly(pl, saucer.x, saucer.y, 0, saucer.r, 1, false);
  if (state === 'play' && ship.alive && ship.hyper <= 0) {
    poly(SHIP, ship.x, ship.y, ship.a, 1, 1, true);
    if (ship.thrust && ((time * 30) | 0) % 2) poly(FLAME, ship.x, ship.y, ship.a, 1, 0.9, false);
  }

  if (state === 'play' || state === 'over') {
    text(String(score).padStart(2, '0'), 200, 34, 30, 1, 'right');
    for (let k = 0; k < Math.min(lives, 8); k++) poly(SHIP, 190 - k * 22, 92, -Math.PI / 2, 0.8, 0.9, true);
    text(String(hi).padStart(2, '0'), W / 2, 34, 20, 0.8, 'center');
  }
  if (state === 'attract') {
    text('PHOSPHOR FIELD', W / 2, 220, 40, 1, 'center');
    if (time % 1.2 < 0.8) text('PRESS FIRE', W / 2, H - 230, 22, 1, 'center');
    text('HIGH SCORE ' + hi, W / 2, H - 170, 15, 0.8, 'center');
  }
  if (state === 'over') text('GAME OVER', W / 2, H / 2 - 20, 36, 1, 'center');
  if (modeT > 0) text(mode === 'vector' ? 'VECTOR' : 'LCD', W / 2, H - 70, 16, 0.85, 'center');
}

// ---------- loop ----------
let last = performance.now();
function frame(now) {
  const dt = Math.min(0.05, Math.max(0, (now - last) / 1000)); last = now;
  update(dt);
  build();
  if (mode === 'vector') { renderVector(dt); present(Math.pow(0.1, dt / PERSIST_S), PERSIST_BIAS * dt * 60); }
  else { renderLCD(); present(0, 0); }
  requestAnimationFrame(frame);
}
attractField();
requestAnimationFrame(frame);
})();
</script>
