<!--
  NORMANDY — first-person beach assault, Dog Green sector, 6 June 1944.

  Engine lineage:
    * world renderer is DECKRUNNER's solid hull: Freedoom textures, a low-res
      z-buffered software rasterizer (perspective-correct, mipped, one mip per
      span), sun shading against a horizon-height shadow map, fog. Here it draws
      a heightfield beach, Czech hedgehogs, a bevel-top seawall and a casemate.
    * soldiers are 8-direction billboard sprites rasterized into the same
      z-buffer, so the seawall's parapet hides their legs.
    * HUD frame, strip slots and instrument vocabulary are Bounty Hunter's.
    * sound is ZzFX (MIT, Frank Force), as in DECKRUNNER.

  World frame: metres. +x east along the beach, +z inland (south), +y up.
  Sea level y = 0. The landing craft grounds at z = -13; the seawall runs at
  z = 100; the casemate sits behind it at x 14..26, z 112..120.

  Controls: WASD move, mouse or arrows look, click / Space fire, Alt or C crouch,
  G grenade, R reload, M sound, P pause, Enter start.
  Touch: left thumb moves, right thumb looks, FIRE / NADE / DUCK buttons.
-->

// Czech hedgehogs: three beams, the (1,1,1) diagonal stood upright
function buildHedgehogs(){
  const up = [1/Math.sqrt(3), 1/Math.sqrt(3), 1/Math.sqrt(3)], a = [Math.SQRT1_2, -Math.SQRT1_2, 0];
  const b2 = [up[1]*a[2] - up[2]*a[1], up[2]*a[0] - up[0]*a[2], up[0]*a[1] - up[1]*a[0]];
  const L = 2.6, hl = L / 2, cy = hl * Math.sin(Math.asin(1/Math.sqrt(3)));
  for (const hdg of HEDGES){
    const cyw = Math.cos(hdg.yaw), syw = Math.sin(hdg.yaw), gy = terrainAt(hdg.x, hdg.z);
    const yawv = v => [v[0]*cyw + v[2]*syw, v[1], -v[0]*syw + v[2]*cyw];
    const axes = [0, 1, 2].map(i => yawv([a[i], up[i], b2[i]]));
    const cen = [hdg.x, gy + cy - 0.05, hdg.z];
    for (let i = 0; i < 3; i++){
      const A = axes[i], o1 = axes[(i + 1) % 3], o2 = axes[(i + 2) % 3];
      oboxGeo(POLYS, cen, A, o1, o2, hl, 0.08, 0.08, 'steel');
      for (let t = -hl; t <= hl; t += 0.25) shStamp(cen[0] + A[0]*t, cen[2] + A[2]*t, cen[1] + A[1]*t, 0.12);
    }
    hdg.top = gy + cy * 2;
  }
}

let RB = null;
function rbEnsure(v){
  const w = clamp(Math.round(v.w / (narrow() ? 2.4 : 3.0)), 160, 560), h = Math.max(90, Math.round(w * v.h / v.w));
  if (!RB || RB.w !== w || RB.h !== h){

    const gg = cv.getContext('2d'), img = gg.createImageData(w, h);
    RB = { w, h, cv, g: gg, img, px: new Uint32Array(img.data.buffer), zb: new Float32Array(w * h) };
  }

}
const CA = new Float64Array(24 * 8), CB = new Float64Array(24 * 8), SV = new Float64Array(24 * 8);
const XF = [0, 0, 0];
let rFx = 1, rFy = 1, rcx = 0, rcy = 0, rFlash = 0;
function drawPoly(p){
  const d = p.d, n = p.n;
  let m = 0, anyFront = false, anyNear = false;
  for (let i = 0; i < n; i++){
    const o = i * 8;
    toCam(d[o], d[o+1], d[o+2], XF);
    CA[o] = XF[0]; CA[o+1] = XF[1]; CA[o+2] = XF[2];
    CA[o+3] = d[o+3]; CA[o+4] = d[o+4]; CA[o+5] = d[o+5]; CA[o+6] = d[o+6]; CA[o+7] = d[o+7];
    if (XF[2] < FAR) anyFront = true;
    if (XF[2] >= NEAR) anyNear = true;
  }
  if (!anyFront || !anyNear) return;
  for (let i = 0; i < n; i++){
    const a = i * 8, b = ((i + 1) % n) * 8, za = CA[a+2], zb = CA[b+2];
    const ina = za >= NEAR, inb = zb >= NEAR;
    if (ina){ for (let k = 0; k < 8; k++) CB[m*8 + k] = CA[a + k]; m++; }
    if (ina !== inb){
      const t = (NEAR - za) / (zb - za);
      for (let k = 0; k < 8; k++) CB[m*8 + k] = CA[a + k] + (CA[b + k] - CA[a + k]) * t;
      m++;
    }
  }
  if (m < 3) return;
  let xmin = 1e9, xmax = -1e9, ymin = 1e9, ymax = -1e9;
  for (let i = 0; i < m; i++){
    const o = i * 8, iz = 1 / CB[o+2];
    const sx = rcx + CB[o] * iz * rFx, sy = rcy - CB[o+1] * iz * rFy;
    SV[o] = sx; SV[o+1] = sy; SV[o+2] = iz;
    SV[o+3] = CB[o+3]*iz; SV[o+4] = CB[o+4]*iz; SV[o+5] = CB[o+5]*iz; SV[o+6] = CB[o+6]*iz; SV[o+7] = CB[o+7]*iz;
    if (sx < xmin) xmin = sx; if (sx > xmax) xmax = sx; if (sy < ymin) ymin = sy; if (sy > ymax) ymax = sy;
  }
  const RW = RB.w, RH = RB.h;
  if (xmax < 0 || xmin > RW || ymax < 0 || ymin > RH) return;
  const v0 = p.p0;
  const dpl = Math.abs(p.nx*(cam.x - v0[0]) + p.ny*(cam.y - v0[1]) + p.nz*(cam.z - v0[2])) + 0.05;
  const mips = p.tex, nm = mips.length - 1;
  const fl = 1 + rFlash;
  const ar = AMB[0]*p.amb*fl, ag = AMB[1]*p.amb*fl, ab = AMB[2]*p.amb*fl;
  const sr = SUNC[0]*p.lam*fl, sg = SUNC[1]*p.lam*fl, sb = SUNC[2]*p.lam*fl;
  const sun = p.sun, Sm = SG.S, SW = SG.w, SWm = SG.w - 1.001, SHm = SG.h - 1.001;
  const px = RB.px, zbuf = RB.zb, lodK = 2.9 / rFx;
  const y0 = Math.max(0, Math.ceil(ymin - 0.5)), y1 = Math.min(RH, Math.ceil(ymax - 0.5));
  for (let y = y0; y < y1; y++){
    const yc = y + 0.5;
    let xl = 1e9, xr = -1e9;
    let lz = 0, lu = 0, lv = 0, lmx = 0, lmz = 0, ly = 0, rz = 0, ru = 0, rv = 0, rmx = 0, rmz = 0, ry = 0;
    for (let i = 0, j = m - 1; i < m; j = i++){
      const oi = i * 8, oj = j * 8, yi = SV[oi+1], yj = SV[oj+1];
      if ((yi <= yc && yc < yj) || (yj <= yc && yc < yi)){
        const t = (yc - yi) / (yj - yi), x = SV[oi] + t * (SV[oj] - SV[oi]);
        if (x < xl){
          xl = x; lz = SV[oi+2] + t*(SV[oj+2] - SV[oi+2]); lu = SV[oi+3] + t*(SV[oj+3] - SV[oi+3]); lv = SV[oi+4] + t*(SV[oj+4] - SV[oi+4]);
          lmx = SV[oi+5] + t*(SV[oj+5] - SV[oi+5]); lmz = SV[oi+6] + t*(SV[oj+6] - SV[oi+6]); ly = SV[oi+7] + t*(SV[oj+7] - SV[oi+7]);
        }
        if (x > xr){
          xr = x; rz = SV[oi+2] + t*(SV[oj+2] - SV[oi+2]); ru = SV[oi+3] + t*(SV[oj+3] - SV[oi+3]); rv = SV[oi+4] + t*(SV[oj+4] - SV[oi+4]);
          rmx = SV[oi+5] + t*(SV[oj+5] - SV[oi+5]); rmz = SV[oi+6] + t*(SV[oj+6] - SV[oi+6]); ry = SV[oi+7] + t*(SV[oj+7] - SV[oi+7]);
        }
      }
    }
    if (xr <= xl) continue;
    const x0 = Math.max(0, Math.ceil(xl - 0.5)), x1 = Math.min(RW, Math.ceil(xr - 0.5));
    if (x1 <= x0) continue;
    const k = 1 / (xr - xl);
    const dz = (rz - lz)*k, du = (ru - lu)*k, dv = (rv - lv)*k, dmx = (rmx - lmx)*k, dmz = (rmz - lmz)*k, dy = (ry - ly)*k;
    const pre = x0 + 0.5 - xl;
    let iz = lz + dz*pre, uz = lu + du*pre, vz = lv + dv*pre, mxz = lmx + dmx*pre, mzz = lmz + dmz*pre, yz = ly + dy*pre;
    const zm = 2 / (lz + rz), cosA = Math.min(1, dpl / zm);
    let lod = Math.log2(zm * lodK) + 0.35 * Math.log2(1 / Math.max(cosA, 0.06)) - 0.45;
    const lv_ = lod <= 0 ? 0 : lod >= nm ? nm : Math.round(lod);
    const T = mips[lv_], tp = T.px, wm = T.wm, hm = T.hm, sh = T.sh, ms = 1 / (1 << lv_);
    const row = y * RW;
    for (let x = x0; x < x1; x++){
      const z = 1 / iz, zi = row + x;
      if (z < zbuf[zi] && z < FAR){
        zbuf[zi] = z;
        const cc = tp[((((vz*z*ms) | 0) & hm) << sh) | (((uz*z*ms) | 0) & wm)];
        let lit = 0;
        if (sun){
          let gx = mxz*z, gz = mzz*z;
          gx = gx < 0 ? 0 : gx > SWm ? SWm : gx; gz = gz < 0 ? 0 : gz > SHm ? SHm : gz;
          const ix = gx | 0, iy = gz | 0, fx = gx - ix, fy = gz - iy, q = iy*SW + ix;
          const s0 = Sm[q] + (Sm[q+1] - Sm[q])*fx, s1 = Sm[q+SW] + (Sm[q+SW+1] - Sm[q+SW])*fx;
          lit = (yz*z - (s0 + (s1 - s0)*fy)) * 3 + 0.5;
          lit = lit < 0 ? 0 : lit > 1 ? 1 : lit;
        }
        const fi = (z*FOGK) | 0, fg = FOG[fi];
        const r = (cc & 255) * (ar + lit*sr) * fg + FOGR[fi], gg = ((cc >>> 8) & 255) * (ag + lit*sg) * fg + FOGG[fi], b = ((cc >>> 16) & 255) * (ab + lit*sb) * fg + FOGB[fi];
        px[zi] = 0xff000000 | ((b > 255 ? 255 : b) << 16) | ((gg > 255 ? 255 : gg) << 8) | (r > 255 ? 255 : r);
      }
      iz += dz; uz += du; vz += dv; mxz += dmx; mzz += dmz; yz += dy;
    }
  }
}

// sky: Freedoom's overcast panorama on a cylinder, blended to haze at the horizon
function drawSky(){
  const S = TX.skyRaw, px = RB.px, zb = RB.zb, RW = RB.w, RH = RB.h;
  const f = cam.f, r = cam.r, u = cam.u, fl = 1 + rFlash;
  for (let y = 0; y < RH; y++){
    const ky = (rcy - (y + 0.5)) / rFy;
    for (let x = 0; x < RW; x++){
      const kx = (x + 0.5 - rcx) / rFx;
      const dx = f[0] + r[0]*kx + u[0]*ky, dy = f[1] + r[1]*kx + u[1]*ky, dz = f[2] + r[2]*kx + u[2]*ky;
      const el = dy / Math.sqrt(dx*dx + dz*dz);
      let cr = FOGC[0], cg = FOGC[1], cb = FOGC[2];
      if (el > 0){

        const sx = ((az * S.w * 3) | 0) % S.w, sy = clamp((S.h * 0.46 * (1 - Math.atan(el) / (Math.PI / 2))) | 0, 0, S.h - 1);
        const cc = S.px[sy * S.w + sx], t = clamp(el * 7, 0, 1);

      }
      cr *= fl; cg *= fl; cb *= fl;

// ---- sprites into the z-buffer
let aimPick = null;
function spriteFrame(e){
  const dx = cam.x - e.x, dz = cam.z - e.z, L = Math.hypot(dx, dz) || 1;
  const vx = dx / L, vz = dz / L, fx = Math.sin(e.yaw), fz = Math.cos(e.yaw);
  const front = fx*vx + fz*vz, right = fx*vz - fz*vx;
  const ang = Math.atan2(right, front);
  return (Math.round(ang / (Math.PI / 4)) + 8) % 8;
}
function drawSprite(name, wx, wy, wz, tag, lit, src){
  const S_ = src || SPR, fr = S_.f[name]; if (!fr) return;
  toCam(wx, wy, wz, XF);
  const cz = XF[2]; if (cz < 0.4 || cz > FAR) return;
  const iz = 1 / cz, ax = rcx + XF[0]*iz*rFx, ay = rcy - XF[1]*iz*rFy, s = S_.mpp * iz * rFy;
  const [fx, fy, fw, fh, fax, fay] = fr;
  const left = ax - fax * s, top = ay - fay * s;
  const x0 = Math.max(0, Math.floor(left)), x1 = Math.min(RB.w, Math.ceil(left + fw * s));
  const y0 = Math.max(0, Math.floor(top)), y1 = Math.min(RB.h, Math.ceil(top + fh * s));
  if (x1 <= x0 || y1 <= y0) return;
  const fi = (cz*FOGK) | 0, fg = FOG[fi], fl = 1 + rFlash;
  const kr = (AMB[0] + lit*SUNC[0]*0.62) * fg * fl, kg = (AMB[1] + lit*SUNC[1]*0.62) * fg * fl, kb = (AMB[2] + lit*SUNC[2]*0.62) * fg * fl;
  const fr_ = FOGR[fi], fg_ = FOGG[fi], fb_ = FOGB[fi];
  const px = RB.px, zb = RB.zb, RW = RB.w, sp = S_.px, SW = S_.w, inv = 1 / s;
  const cxp = rcx | 0, cyp = rcy | 0;
  for (let y = y0; y < y1; y++){
    const ty = ((y + 0.5 - top) * inv) | 0; if (ty < 0 || ty >= fh) continue;
    const srow = (fy + ty) * SW + fx, row = y * RW;
    for (let x = x0; x < x1; x++){
      const tx = ((x + 0.5 - left) * inv) | 0; if (tx < 0 || tx >= fw) continue;
      const cc = sp[srow + tx];
      if ((cc >>> 24) < 128) continue;
      const i = row + x;
      if (cz >= zb[i]) continue;
      zb[i] = cz;
      const r = (cc & 255) * kr + fr_, gg = ((cc >>> 8) & 255) * kg + fg_, b = ((cc >>> 16) & 255) * kb + fb_;
      px[i] = 0xff000000 | ((b > 255 ? 255 : b) << 16) | ((gg > 255 ? 255 : gg) << 8) | (r > 255 ? 255 : r);
      if (tag && Math.abs(x - cxp) <= 1 && Math.abs(y - cyp) <= 1) aimPick = { tag, z: cz };
    }
  }
}
// soft dark patch on the ground under a soldier
function blobShadow(x, z, gy, rad){
  toCam(x, gy + 0.03, z, XF);
  if (XF[2] < 0.6 || XF[2] > 140) return;
  const iz = 1 / XF[2], cx = rcx + XF[0]*iz*rFx, cy = rcy - XF[1]*iz*rFy;
  const rx = rad * iz * rFx, ry = Math.max(1, rx * clamp((cam.y - gy) * iz, 0.08, 1));
  const zr = XF[2], tol = 0.6 + zr * 0.03, RW = RB.w, px = RB.px, zb = RB.zb;
  for (let y = Math.max(0, Math.floor(cy - ry)); y <= Math.min(RB.h - 1, Math.ceil(cy + ry)); y++)
    for (let x = Math.max(0, Math.floor(cx - rx)); x <= Math.min(RW - 1, Math.ceil(cx + rx)); x++){
      const ex = (x + 0.5 - cx) / rx, ey = (y + 0.5 - cy) / ry, e = ex*ex + ey*ey;
      if (e >= 1) continue;
      const i = y*RW + x; if (Math.abs(zb[i] - zr) > tol) continue;
      const k = 0.55 + 0.45 * e, cc = px[i];
      px[i] = 0xff000000 | ((((cc >>> 16) & 255) * k) << 16) | ((((cc >>> 8) & 255) * k) << 8) | ((cc & 255) * k);

}
// additive 3D line, depth-tested (tracers)
function zLine(x1, y1, z1, x2, y2, z2, rgb, a){
  const A = toCam(x1, y1, z1, [0, 0, 0]), B = toCam(x2, y2, z2, [0, 0, 0]);
  if (A[2] < NEAR && B[2] < NEAR) return;
  if (A[2] < NEAR){ const t = (NEAR - A[2]) / (B[2] - A[2]); for (let k = 0; k < 3; k++) A[k] += (B[k] - A[k]) * t; }
  if (B[2] < NEAR){ const t = (NEAR - B[2]) / (A[2] - B[2]); for (let k = 0; k < 3; k++) B[k] += (A[k] - B[k]) * t; }
  const ax = rcx + A[0]/A[2]*rFx, ay = rcy - A[1]/A[2]*rFy, bx = rcx + B[0]/B[2]*rFx, by = rcy - B[1]/B[2]*rFy;
  const n = Math.min(400, Math.max(1, Math.ceil(Math.max(Math.abs(bx - ax), Math.abs(by - ay)))));
  const ia = 1 / A[2], ib = 1 / B[2], RW = RB.w, RH = RB.h, px = RB.px, zb = RB.zb;
  for (let i = 0; i <= n; i++){
    const t = i / n, x = (ax + (bx - ax)*t) | 0, y = (ay + (by - ay)*t) | 0;
    if (x < 0 || y < 0 || x >= RW || y >= RH) continue;
    const z = 1 / (ia + (ib - ia)*t), q = y*RW + x;
    if (z > zb[q] + 0.2) continue;
    const k = a * (0.35 + 0.65 * t), cc = px[q];
    const r = (cc & 255) + rgb[0]*k, gg = ((cc >>> 8) & 255) + rgb[1]*k, b = ((cc >>> 16) & 255) + rgb[2]*k;
    px[q] = 0xff000000 | ((b > 255 ? 255 : b) << 16) | ((gg > 255 ? 255 : gg) << 8) | (r > 255 ? 255 : r);
  }
}
// particles: depth-tested squares, blended
function drawParticle(p){
  toCam(p.x, p.y, p.z, XF);
  if (XF[2] < 0.3 || XF[2] > FAR) return;
  const iz = 1 / XF[2], cx = rcx + XF[0]*iz*rFx, cy = rcy - XF[1]*iz*rFy, r = Math.max(0.6, p.size * iz * rFy * 0.5);
  const life = p.t / p.max, a = p.alpha * (p.fadeIn ? Math.min(1, life * 6) : 1) * (1 - life);
  if (a <= 0.01) return;
  const fi = (XF[2]*FOGK) | 0, fg = FOG[fi];
  const cr = p.col[0]*fg + FOGR[fi], cg = p.col[1]*fg + FOGG[fi], cb = p.col[2]*fg + FOGB[fi];
  const RW = RB.w, px = RB.px, zb = RB.zb, z = XF[2];
  for (let y = Math.max(0, (cy - r) | 0); y <= Math.min(RB.h - 1, (cy + r) | 0); y++)
    for (let x = Math.max(0, (cx - r) | 0); x <= Math.min(RW - 1, (cx + r) | 0); x++){
      const i = y*RW + x; if (z > zb[i]) continue;
      const cc = px[i];
      if (p.add){
        const rr = (cc & 255) + cr*a, gg = ((cc >>> 8) & 255) + cg*a, bb = ((cc >>> 16) & 255) + cb*a;
        px[i] = 0xff000000 | ((bb > 255 ? 255 : bb) << 16) | ((gg > 255 ? 255 : gg) << 8) | (rr > 255 ? 255 : rr);
      } else {
        const rr = (cc & 255) * (1 - a) + cr*a, gg = ((cc >>> 8) & 255) * (1 - a) + cg*a, bb = ((cc >>> 16) & 255) * (1 - a) + cb*a;
        px[i] = 0xff000000 | (bb << 16) | (gg << 8) | rr;
      }
    }
}

const VIS = [];
let tanX = 1, tanY = 1;
function renderWorld(v){
  const B = rbEnsure(v);
  const F = Math.min(v.w / 2 / Math.tan(40 * Math.PI / 180), v.h / 2 / Math.tan(33 * Math.PI / 180));
  rFx = F * B.w / v.w; rFy = F * B.h / v.h; rcx = B.w / 2; rcy = B.h / 2;
  tanX = rcx / rFx + 0.05; tanY = rcy / rFy + 0.05;
  drawSky();
  VIS.length = 0;
  const consider = p => {
    if (p.hidden) return;
    toCam(p.cx, p.cy, p.cz, XF);
    const zc = XF[2], r = p.rad;
    if (zc < -r || zc > FAR + r) return;
    if (XF[0] - r > (zc + r) * tanX || -XF[0] - r > (zc + r) * tanX) return;
    if (XF[1] - r > (zc + r) * tanY || -XF[1] - r > (zc + r) * tanY) return;
    const v0 = p.p0;
    if (!p.two && p.nx*(cam.x - v0[0]) + p.ny*(cam.y - v0[1]) + p.nz*(cam.z - v0[2]) <= 0) return;
    p.key = zc - r;
    VIS.push(p);
  };
  for (const p of POLYS) consider(p);
  for (const p of dynPolys) consider(p);
  VIS.sort((a, b) => a.key - b.key);
  for (const p of VIS) drawPoly(p);
  // soldiers: blob shadows, then sprites far to near is unnecessary with the z-buffer
  aimPick = null;
  for (const e of game.enemies){
    const gy = e.gy;
    if (e.state !== 'dead' && !e.crew) blobShadow(e.x, e.z, gy, 0.42);
    const lit = e.crew ? 0.55 : clamp((gy + 1.2 - shadowAt(e.x, e.z)) * 3 + 0.5, 0, 1);
    drawSprite(e.frame, e.x - Math.sin(e.yaw) * e.kick * 0.06, gy + (e.bob || 0), e.z - Math.cos(e.yaw) * e.kick * 0.06, e.state === 'dead' || e.state === 'hit' ? null : e, lit);
  }
  for (const m of MEDS){
    if (m.taken) continue;
    const lit = clamp((m.gy + 0.3 - shadowAt(m.x, m.z)) * 3 + 0.5, 0, 1);
    drawSprite('kit', m.x, m.gy + 0.02 + Math.abs(Math.sin(game.t * 2.2 + m.x)) * 0.06, m.z, null, lit, MEDKIT);
  }
  for (const m of AMMOS){
    if (m.taken) continue;
    const lit = clamp((m.gy + 0.3 - shadowAt(m.x, m.z)) * 3 + 0.5, 0, 1);
    drawSprite('can', m.x, m.gy + 0.02 + Math.abs(Math.sin(game.t * 2.2 + m.z)) * 0.06, m.z, null, lit, AMMOCAN);
  }
  for (const p of game.parts) drawParticle(p);
  for (const b of game.bullets) if (b.tracer) zLine(b.x, b.y, b.z, b.x - b.vx*0.022, b.y - b.vy*0.022, b.z - b.vz*0.022, [255, 214, 140], 1.0);
    else zLine(b.x, b.y, b.z, b.x - b.vx*0.012, b.y - b.vy*0.012, b.z - b.vz*0.012, [200, 180, 140], 0.35);
  for (const gr of game.grenades) drawParticle({ x: gr.x, y: gr.y, z: gr.z, size: 0.16, col: [40, 48, 34], alpha: 1, t: 0, max: 1 });
  B.g.putImageData(B.img, 0, 0);
  const sm = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  g.drawImage(B.cv, v.x, v.y, v.w, v.h);
  g.imageSmoothingEnabled = sm;
}

const voices = {};
function sfx(k, o){

  if (o.at){
    const dx = o.at[0] - cam.x, dz = o.at[2] - cam.z, d = Math.hypot(dx, dz, o.at[1] - cam.y);

// on to the next level with what you carry
function nextLevel(){
  const carry = { score: game.score, kills: pl.kills, clock: game.clock, clips: Math.max(pl.clips, 6), nades: Math.max(pl.nades, 3) };
  const k = LEVELS.indexOf(LV) + 1;
  stageNo = STAGES.findIndex(s => s.lv === k);
  newGame(carry);
}
function lastLevel(){ return LEVELS.indexOf(LV) === LEVELS.length - 1; }
function setMode(m){ game.mode = m; game.modeT = 0; }
// ===========================================================================
// COLLISION / LINE OF SIGHT
// ===========================================================================
function groundAt(x, z){ return LV.ground ? LV.ground(x, z) : terrainAt(x, z); }
function beachGround(x, z){
  const b = BOAT;
  if (x > b.x0 && x < b.x1 && z > b.z0 && z < b.z1) return b.deck;
  if (Math.abs(x) < b.x1){ const r = rampTopAt(z); if (r != null) return Math.max(r, terrainAt(x, z)); }
  return terrainAt(x, z);
}
// tree trunks: a vertical cylinder from the ground to t.top
function segTree(ax, ay, az, bx, by, bz, t, r){
  const dx = bx - ax, dz = bz - az, L2 = dx*dx + dz*dz || 1e-9;
  const u = clamp(((t.x - ax)*dx + (t.z - az)*dz) / L2, 0, 1);
  if (Math.hypot(ax + dx*u - t.x, az + dz*u - t.z) > r) return -1;
  return (ay + (by - ay)*u) < t.top ? u : -1;
}
function segBox(ax, ay, az, bx, by, bz, b){
  let t0 = 0, t1 = 1;
  const d = [bx - ax, by - ay, bz - az], o = [ax, ay, az], lo = [b.x0, b.y0, b.z0], hi = [b.x1, b.y1, b.z1];
  for (let k = 0; k < 3; k++){
    if (Math.abs(d[k]) < 1e-9){ if (o[k] < lo[k] || o[k] > hi[k]) return -1; continue; }
    let ta = (lo[k] - o[k]) / d[k], tb = (hi[k] - o[k]) / d[k];
    if (ta > tb){ const s = ta; ta = tb; tb = s; }
    if (ta > t0) t0 = ta; if (tb < t1) t1 = tb;
    if (t0 > t1) return -1;
  }
  return t0;
}
function segHedge(ax, ay, az, bx, by, bz, h, r){
  const dx = bx - ax, dz = bz - az, L2 = dx*dx + dz*dz || 1e-9;
  const t = clamp(((h.x - ax)*dx + (h.z - az)*dz) / L2, 0, 1);
  const px = ax + dx*t, pz = az + dz*t, d = Math.hypot(px - h.x, pz - h.z);
  if (d > r) return -1;
  return (ay + (by - ay)*t) < h.top - 0.1 ? t : -1;
}
// first blocker along a segment: {t, kind} or null
function trace(ax, ay, az, bx, by, bz, hedgeR){
  let best = 2, kind = null;
  const L = Math.hypot(bx - ax, bz - az), n = Math.max(2, Math.ceil(L / 0.9));
  for (let i = 1; i < n; i++){
    const t = i / n, y = ay + (by - ay)*t, x = ax + (bx - ax)*t, z = az + (bz - az)*t;
    if (y < terrainAt(x, z) - 0.04){ best = t; kind = 'ground'; break; }
  }
  for (const b of BOXES){ if (!b.los) continue; const t = segBox(ax, ay, az, bx, by, bz, b); if (t >= 0 && t < best){ best = t; kind = b.kind; } }
  for (const h of HEDGES){ const t = segHedge(ax, ay, az, bx, by, bz, h, hedgeR || 0.62); if (t >= 0 && t < best){ best = t; kind = 'hedge'; } }
  for (const tr of TREES){ const t = segTree(ax, ay, az, bx, by, bz, tr, tr.r * 0.8); if (t >= 0 && t < best){ best = t; kind = 'wood'; } }
  return kind ? { t: best, kind } : null;
}
function playerChest(){ return [pl.x, pl.fy + (pl.crouch ? 0.82 : 1.28), pl.z]; }
function playerHead(){ return [pl.x, pl.fy + pl.eye, pl.z]; }
function moveCircle(x, z, nx, nz, r, fy){
  let X = nx, Z = nz;
  for (let it = 0; it < 2; it++){
    for (const b of BOXES){
      if (!b.move || b.y1 <= fy + 0.45 || b.y0 >= fy + 1.7) continue;
      const cx = clamp(X, b.x0, b.x1), cz = clamp(Z, b.z0, b.z1), dx = X - cx, dz = Z - cz, d = Math.hypot(dx, dz);
      if (d < r){
        if (d > 1e-6){ X = cx + dx / d * r; Z = cz + dz / d * r; }
        else { // centre inside: push out along the shortest axis
          const pen = [X - b.x0, b.x1 - X, Z - b.z0, b.z1 - Z], m = Math.min(...pen), k = pen.indexOf(m);
          if (k === 0) X = b.x0 - r; else if (k === 1) X = b.x1 + r; else if (k === 2) Z = b.z0 - r; else Z = b.z1 + r;
        }
      }
    }
    if (LV.collide) Z = LV.collide(X, Z, z, r);
    for (const h of HEDGES){ const dx = X - h.x, dz = Z - h.z, d = Math.hypot(dx, dz), rr = 0.78 + r; if (d < rr && d > 1e-6){ X = h.x + dx / d * rr; Z = h.z + dz / d * rr; } }
    for (const s of STAKES){ const dx = X - s.x, dz = Z - s.z, d = Math.hypot(dx, dz), rr = 0.3 + r; if (d < rr && d > 1e-6){ X = s.x + dx / d * rr; Z = s.z + dz / d * rr; } }
    for (const s of TREES){ const dx = X - s.x, dz = Z - s.z, d = Math.hypot(dx, dz), rr = s.r + r; if (d < rr && d > 1e-6){ X = s.x + dx / d * rr; Z = s.z + dz / d * rr; } }
    for (const e of game.enemies){ if (e.state === 'dead') continue; const dx = X - e.x, dz = Z - e.z, d = Math.hypot(dx, dz), rr = 0.35 + r; if (d < rr && d > 1e-6){ X = e.x + dx / d * rr; Z = e.z + dz / d * rr; } }
  }
  const bd = LV.bounds;
  X = clamp(X, bd.x0, bd.x1); Z = clamp(Z, bd.z0, bd.z1);
  // a step up of more than 0.9 m stops you (the bluff past the casemate); where the level sets
  // maxSlope, so does ground steeper than that, and you slide along it instead
  const g0 = groundAt(x, z), ms = LV.maxSlope;
  const ok = (X_, Z_) => {
    const gy = groundAt(X_, Z_);
    if (gy - fy > 0.9) return false;
    return !ms || gy - g0 <= Math.hypot(X_ - x, Z_ - z) * ms + 0.004;
  };
  if (ok(X, Z)) return [X, Z];
  if (ms){ if (ok(X, z)) return [X, z]; if (ok(x, Z)) return [x, Z]; }
  return [x, z];
}

function part(o){ if (game.parts.length < 520) game.parts.push(Object.assign({ t: 0, alpha: 1, grav: -9.8, drag: 0.6, add: false }, o)); }
function puff(x, y, z, kind){
  if (kind === 'water'){
    for (let i = 0; i < 6; i++) part({ x, y, z, vx: rnd(-0.8, 0.8), vy: rnd(2.5, 5), vz: rnd(-0.8, 0.8), size: rnd(0.12, 0.22), col: [220, 230, 228], max: rnd(0.5, 0.8), alpha: 0.9 });
  } else if (kind === 'hedge' || kind === 'steel'){
    for (let i = 0; i < 5; i++) part({ x, y, z, vx: rnd(-3, 3), vy: rnd(0.5, 3.5), vz: rnd(-3, 3), size: 0.06, col: [255, 220, 120], max: rnd(0.15, 0.3), add: true });
  } else if (kind === 'concrete'){
    for (let i = 0; i < 4; i++) part({ x, y, z, vx: rnd(-1, 1), vy: rnd(0.5, 2), vz: rnd(-1, 1), size: rnd(0.1, 0.18), col: [176, 172, 160], max: rnd(0.4, 0.7), alpha: 0.85 });
  } else {
    for (let i = 0; i < 5; i++) part({ x, y, z, vx: rnd(-0.7, 0.7), vy: rnd(1.5, 3.6), vz: rnd(-0.7, 0.7), size: rnd(0.12, 0.24), col: [196, 176, 128], max: rnd(0.45, 0.8), alpha: 0.85 });
  }
}
function explode(x, y, z, big){
  sfx('boom', { at: [x, y, z], range: 60, cap: 4, vol: big ? 1.4 : 1 });
  rFlash = big ? 0.7 : 0.4;
  part({ x, y: y + 0.4, z, vx: 0, vy: 0, vz: 0, grav: 0, size: big ? 4.5 : 3.2, col: [255, 210, 120], max: 0.18, add: true });
  for (let i = 0; i < (big ? 46 : 28); i++){
    const a = rnd(0, TAU), s = rnd(2, big ? 11 : 8);
    part({ x, y: y + 0.2, z, vx: Math.cos(a)*s*0.6, vy: rnd(3, big ? 12 : 8), vz: Math.sin(a)*s*0.6, size: rnd(0.12, 0.3), col: [92, 82, 64], max: rnd(0.7, 1.3) });
  }
  for (let i = 0; i < (big ? 18 : 10); i++)
    part({ x: x + rnd(-0.6, 0.6), y: y + rnd(0, 1), z: z + rnd(-0.6, 0.6), vx: rnd(-0.5, 0.5), vy: rnd(0.6, 1.8), vz: rnd(-0.5, 0.5), grav: 0, drag: 0.4,
           size: rnd(1.2, 2.4), col: [96, 96, 92], max: rnd(2.2, 3.8), alpha: 0.55, fadeIn: true });
  for (const e of game.enemies){
    if (e.state === 'dead' || e.state === 'hit') continue;
    const d = Math.hypot(e.x - x, e.z - z);
    if (d < 4.5 && !trace(x, y + 0.4, z, e.x, e.gy + 1.0, e.z)) killEnemy(e);
  }
  const d = Math.hypot(pl.x - x, pl.z - z);
  if (d < 6 && !trace(x, y + 0.4, z, pl.x, pl.fy + 1.0, pl.z)) hurt(Math.round(80 * (1 - d / 6)));
  pl.shake = Math.max(pl.shake, clamp(1 - d / 30, 0, 1) * 0.6);
}
function killEnemy(e){
  if (e.state === 'dead' || e.state === 'hit') return;
  e.state = 'hit'; e.st = 0; game.score += 100; pl.kills++;
}
function hurt(dmg){
  if (game.mode !== 'play' || dmg <= 0) return;
  pl.hp -= dmg; pl.hurtT = 0.45; pl.shake = Math.max(pl.shake, 0.35); pl.safeT = 0;
  sfx('thud', { vol: 0.9, cap: 3 });
  if (pl.hp <= 0){ pl.hp = 0; setMode('down'); flash('YOU ARE DOWN', 3, WARN); }
}

// PLAYER
// ===========================================================================
const keys = new Set();
// which thumb moves: right by default, swappable for left-handers, remembered per browser
let stickRight = true;
try { const h = localStorage.getItem('normandy_stick'); if (h === 'L') stickRight = false; } catch (err) {}
function swapHands(){
  stickRight = !stickRight;
  try { localStorage.setItem('normandy_stick', stickRight ? 'R' : 'L'); } catch (err) {}
  touch.move = null; touch.mx = touch.mz = 0; touch.look = null;
  flash(stickRight ? 'MOVE ON THE RIGHT' : 'MOVE ON THE LEFT', 1.4, LBL);
}
const touch = { on: false, move: null, look: null, mx: 0, mz: 0, fire: false, btn: [] };
function updatePlayer(dt){
  // look
  let turn = 0, tilt = 0;
  if (keys.has('ArrowLeft')) turn -= 1.9 * dt;
  if (keys.has('ArrowRight')) turn += 1.9 * dt;
  if (keys.has('KeyQ')) turn -= 1.9 * dt;
  if (keys.has('KeyE')) turn += 1.9 * dt;
  if (ms.inView && !touch.on && document.pointerLockElement !== c){
    const edge = Math.max(0, Math.abs(ms.ex) - 0.78) / 0.22;          // outer 11% of each side
    turn += Math.sign(ms.ex) * edge * edge * 2.2 * dt;
  }
  if (keys.has('ArrowUp')) tilt += 1.2 * dt;
  if (keys.has('ArrowDown')) tilt -= 1.2 * dt;
  pl.yaw = wrapA(pl.yaw + turn); pl.pitch = clamp(pl.pitch + tilt, -1.1, 1.1);
  // move
  let fwd = 0, str = 0;
  if (keys.has('KeyW')) fwd += 1; if (keys.has('KeyS')) fwd -= 1;
  if (keys.has('KeyD')) str += 1; if (keys.has('KeyA')) str -= 1;
  if (touch.move){ fwd += touch.mz; str += touch.mx; }
  const mag = Math.hypot(fwd, str); if (mag > 1){ fwd /= mag; str /= mag; }
  const depth = Math.max(0, -pl.fy);
  let speed = (pl.crouch ? 2.3 : 5.0) * (1 - clamp(depth * 0.6, 0, 0.55));
  if (pl.reloadT > 0) speed *= 0.85;
  const sy = Math.sin(pl.yaw), cy = Math.cos(pl.yaw);
  const vx = (sy*fwd + cy*str) * speed, vz = (cy*fwd - sy*str) * speed;
  const [nx, nz] = moveCircle(pl.x, pl.z, pl.x + vx*dt, pl.z + vz*dt, 0.3, pl.fy);
  const moved = Math.hypot(nx - pl.x, nz - pl.z);
  pl.x = nx; pl.z = nz;
  pl.moving = moved / Math.max(dt, 1e-4);
  pl.bob += moved * 1.9;
  const gy = groundAt(pl.x, pl.z);
  pl.fy = pl.fy < gy ? lerp(pl.fy, gy, clamp(dt * 16, 0, 1)) : Math.max(gy, pl.fy - 6 * dt);
  pl.eye = lerp(pl.eye, pl.crouch ? EYE_C : EYE, clamp(dt * 10, 0, 1));
  if (depth > 0.1 && pl.moving > 1 && Math.random() < dt * 6) puff(pl.x + Math.sin(pl.yaw)*0.6, 0.02, pl.z + Math.cos(pl.yaw)*0.6, 'water');
  if (depth > 0.1 && pl.moving > 1 && Math.random() < dt * 2.5) sfx('splash', { vol: 0.35, cap: 2 });
  // weapon
  pl.fireT -= dt; pl.flashT -= dt; pl.recoil = Math.max(0, pl.recoil - dt * 6); pl.hurtT -= dt; pl.shake = Math.max(0, pl.shake - dt * 1.6);
  if (pl.reloadT > 0){ pl.reloadT -= dt; if (pl.reloadT <= 0){ pl.clip = 8; pl.clips--; sfx('click', { vol: 0.8 }); } }
  pl.lungeT = Math.max(0, (pl.lungeT || 0) - dt);
  const bay = bayonet();
  if (bay !== !!pl.bayo){
    pl.bayo = bay;
    if (game.mode === 'play') flash(bay ? 'OUT OF AMMO \u2014 FIX BAYONET' : 'RIFLE LOADED', 1.8, bay ? WARN : PHOS);
  }
  if ((keys.has('Space') || touch.fire || mouseDown) && game.mode === 'play') fireRifle();
  // regenerate when nothing has been able to see you for a while
  for (const m of MEDS){
    if (m.taken || pl.hp >= 100 || Math.hypot(pl.x - m.x, pl.z - m.z) > 1.2) continue;
    m.taken = true; pl.hp = Math.min(100, pl.hp + 50);
    sfx('ping', { vol: 0.5, rate: 0.7 }); flash('FIRST AID  +50', 1.4, PHOS);
  }
  for (const m of AMMOS){
    if (m.taken || (pl.clips >= 12 && pl.nades >= 6) || Math.hypot(pl.x - m.x, pl.z - m.z) > 1.2) continue;
    m.taken = true;
    const c0 = pl.clips, n0 = pl.nades;
    pl.clips = Math.min(12, pl.clips + 3); pl.nades = Math.min(6, pl.nades + 2);
    if (pl.clip <= 0) pl.reloadT = 1.9;
    sfx('click', { vol: 0.9 }); sfx('click', { vol: 0.6, rate: 0.8 });
    flash(`AMMO  +${pl.clips - c0} CLIPS  +${pl.nades - n0} NADES`, 1.6, PHOS);
  }
  pl.safeT += dt;
  if (pl.expo < 0.05 && pl.safeT > 3 && pl.hp < 100) pl.hp = Math.min(100, pl.hp + dt * 6);
}
let mouseDown = false;
// Out of clips and the rifle empty: the bayonet goes on. Fire becomes a lunge that
// takes the soldier in front of you within reach; any ammo pickup reloads and the
// rifle is back.
const REACH = 2.4;
function bayonet(){ return pl.clip <= 0 && pl.clips <= 0 && pl.reloadT <= 0; }
function lunge(){
  pl.fireT = 0.55; pl.lungeT = 0.32;
  sfx('toss', { vol: 0.9, rate: 0.7 });
  const fx = Math.sin(pl.yaw), fz = Math.cos(pl.yaw), ch = playerChest();
  let best = null, bd = 1e9;
  for (const e of game.enemies){
    if (e.state === 'dead' || e.state === 'hit') continue;
    if (e.crew && e.post !== 'door') continue;
    const dx = e.x - pl.x, dz = e.z - pl.z, d = Math.hypot(dx, dz);
    if (d > REACH || d < 0.05) continue;
    if ((dx * fx + dz * fz) / d < 0.82) continue;                      // about 35 degrees either side
    if (!e.crew && trace(ch[0], ch[1], ch[2], e.x, e.gy + 1.1, e.z)) continue;
    if (d < bd){ bd = d; best = e; }
  }
  if (best){
    killEnemy(best);
    sfx('thud', { vol: 1, cap: 3 });
    pl.shake = Math.max(pl.shake, 0.2);
  }
}
function fireRifle(){
  if (pl.fireT > 0 || pl.reloadT > 0) return;
  if (bayonet()){ lunge(); return; }
  if (pl.clip <= 0){ startReload(); return; }
  pl.clip--; pl.fireT = 0.24; pl.flashT = 0.06; pl.recoil = 1;
  pl.pitch = clamp(pl.pitch + 0.012, -1.1, 1.1);
  sfx('rifle', { vol: 0.9, cap: 3 });
  // hit: whatever soldier sits under the crosshair in the last frame, if nothing nearer blocks
  const tgt = aimPick && aimPick.tag;
  const f = cam.f, R = 140;
  if (tgt && tgt.state !== 'dead' && tgt.state !== 'hit'){
    killEnemy(tgt);
    puff(tgt.x, tgt.gy + 1.2, tgt.z, 'sand');
  } else {
    const hit = trace(cam.x, cam.y, cam.z, cam.x + f[0]*R, cam.y + f[1]*R, cam.z + f[2]*R, 0.35);
    if (hit) puff(cam.x + f[0]*R*hit.t, cam.y + f[1]*R*hit.t, cam.z + f[2]*R*hit.t, hit.kind);
    else if (f[1] < 0){ const t = -cam.y / f[1]; if (t < R) puff(cam.x + f[0]*t, 0.02, cam.z + f[2]*t, 'water'); }
  }
  if (pl.clip === 0){ sfx('ping', { vol: 0.8 }); flash('PING — CLIP OUT', 1.0, LBL); startReload(); }
}
function startReload(){
  if (pl.reloadT > 0 || pl.clip === 8) return;
  if (pl.clips <= 0){ flash('NO CLIPS LEFT', 1.2, WARN); return; }
  pl.reloadT = 1.9;
}
function throwGrenade(){
  if (game.mode !== 'play' || pl.nades <= 0) return;
  pl.nades--;
  const f = cam.f, sp = 14;
  game.grenades.push({ x: cam.x + f[0]*0.5, y: cam.y - 0.1, z: cam.z + f[2]*0.5, vx: f[0]*sp, vy: f[1]*sp + 4.2, vz: f[2]*sp, fuse: 2.8, inside: false });
  sfx('toss', { vol: 0.8 });
}
function updateGrenades(dt){
  for (const gr of game.grenades){
    gr.fuse -= dt;
    if (!gr.inside){
      const steps = 4, h = dt / steps;
      for (let k = 0; k < steps; k++){
        gr.vy -= 9.8 * h;
        const nx = gr.x + gr.vx*h, ny = gr.y + gr.vy*h, nz = gr.z + gr.vz*h;
        // into a casemate's slit or its open-able rear door
        for (const B of EMPS){
          if (!B.alive || B.kind !== 'casemate') continue;
          const s = B.slit, d = B.door;
          if (nx > s.x0 - 0.15 && nx < s.x1 + 0.15 && ny > s.y0 - 0.12 && ny < s.y1 + 0.12 && nz > B.z0 - 0.3 && nz < B.z0 + 1.2){ gr.inside = B; gr.fuse = Math.min(gr.fuse, 1.1); sfx('click', { at: [nx, ny, nz], vol: 1 }); flash('IN THE SLIT', 1.2, PHOS); break; }
          if (d && nx > d.x0 - 0.5 && nx < d.x1 + 0.5 && ny < d.y1 + 0.3 && ny > B.yb - 0.2 && nz < B.z1 + 0.6 && nz > B.z1 - 0.6){ gr.inside = B; gr.fuse = Math.min(gr.fuse, 1.1); flash('IN THE DOOR', 1.2, PHOS); break; }
        }
        if (gr.inside) break;
        let hitBox = null;
        for (const b of BOXES) if (nx > b.x0 && nx < b.x1 && ny > b.y0 && ny < b.y1 && nz > b.z0 && nz < b.z1){ hitBox = b; break; }
        if (hitBox){
          const b = hitBox;
          const pen = [[Math.abs(gr.x - b.x0), 0], [Math.abs(gr.x - b.x1), 0], [Math.abs(gr.y - b.y1), 1], [Math.abs(gr.z - b.z0), 2], [Math.abs(gr.z - b.z1), 2]];
          pen.sort((p, q) => p[0] - q[0]);
          const ax = pen[0][1];
          if (ax === 0) gr.vx *= -0.35; else if (ax === 1) gr.vy *= -0.3; else gr.vz *= -0.35;
          gr.vx *= 0.7; gr.vz *= 0.7;
          sfx('click', { at: [gr.x, gr.y, gr.z], vol: 0.4 });
          continue;
        }
        let hitH = null;
        for (const hh of HEDGES){ if (Math.hypot(nx - hh.x, nz - hh.z) < 0.5 && ny < hh.top){ hitH = hh; break; } }
        if (!hitH) for (const tr of TREES){ if (Math.hypot(nx - tr.x, nz - tr.z) < tr.r && ny < tr.top){ hitH = tr; break; } }
        if (hitH){ const dx = gr.x - hitH.x, dz = gr.z - hitH.z, L = Math.hypot(dx, dz) || 1; const vn = (gr.vx*dx + gr.vz*dz) / L; gr.vx -= 1.6*vn*dx/L; gr.vz -= 1.6*vn*dz/L; gr.vx *= 0.6; gr.vz *= 0.6; continue; }
        const gy = groundAt(nx, nz) + 0.06;
        if (ny < gy){
          gr.x = nx; gr.z = nz; gr.y = gy;
          if (gy < 0.06 && terrainAt(nx, nz) < 0){ gr.vx *= 0.2; gr.vz *= 0.2; gr.vy = 0; gr.y = Math.max(terrainAt(nx, nz) + 0.06, gr.y - 0.5); }
          else { gr.vy = Math.abs(gr.vy) * 0.28; gr.vx *= 0.55; gr.vz *= 0.55; if (Math.abs(gr.vy) < 0.6) gr.vy = 0; }
        } else { gr.x = nx; gr.y = ny; gr.z = nz; }
      }
    }
    if (gr.fuse <= 0){
      gr.dead = true;
      if (gr.inside && gr.inside.alive) destroyEmp(gr.inside);
      else { explode(gr.x, gr.y, gr.z, false); if (LV.onBlast) LV.onBlast(gr.x, gr.y, gr.z); }
    }
  }
  game.grenades = game.grenades.filter(gr => !gr.dead);
}

function updateMGs(dt){

function updateMG(m, dt){

  const yawTo = Math.atan2(dx, dz);
  const off = wrapA(yawTo - m.face);

  m.sees = inArc && (!trace(ox, oy, oz, hd[0], hd[1], hd[2]) || !trace(ox, oy, oz, ch[0], ch[1], ch[2]));
  if (m.sees) m.lastSeen = game.t;
  m.t -= dt;
  if (m.state === 'idle' && m.t <= 0){ m.state = 'burst'; m.t = rnd(m.burst[0], m.burst[1]); m.burstN++; }
  else if (m.state === 'burst' && m.t <= 0){ m.state = 'idle'; m.t = rnd(m.idle[0], m.idle[1]); }

  let ty, tp;

    ty = yawTo; tp = Math.atan2(ch[1] - oy, dist);

    tp = Math.atan2(terrainAt(ox + Math.sin(ty)*reach, oz + Math.cos(ty)*reach) + 0.9 - oy, reach);
    const rate = 0.9 * dt;
    m.yaw = wrapA(m.yaw + clamp(wrapA(ty - m.yaw), -rate, rate));
    m.pitch += clamp(tp - m.pitch, -rate, rate);
  }
  if (m.arc < Math.PI) m.yaw = m.face + clamp(wrapA(m.yaw - m.face), -m.arc, m.arc);
  if (m.state === 'burst'){
    m.fireAcc += dt * m.rate;

      m.fireAcc -= 1;
      const yy = m.yaw + rnd(-1, 1) * 0.016, pp = m.pitch + rnd(-1, 1) * 0.011, sp = 380;
      const cp = Math.cos(pp), mo = m.muzzle || 0.6;
      game.bullets.push({ x: ox + Math.sin(yy)*mo, y: oy, z: oz + Math.cos(yy)*mo, vx: Math.sin(yy)*cp*sp, vy: Math.sin(pp)*sp, vz: Math.cos(yy)*cp*sp,
                          life: 0.9, tracer: (m.burstN * 7 + game.bullets.length) % 3 === 0, near: false, dmg: m.dmg });
      sfx('mg', { at: o, range: 70, cap: 5, vol: 0.9 });
      part({ x: ox + Math.sin(yy)*(mo + 0.15), y: oy, z: oz + Math.cos(yy)*(mo + 0.15), vx: 0, vy: 0, vz: 0, grav: 0, size: 0.5, col: [255, 200, 110], max: 0.05, add: true });
    }

}
function updateBullets(dt){

    b.life -= dt;
    const ax = b.x, ay = b.y, az = b.z, bx = ax + b.vx*dt, by = ay + b.vy*dt, bz = az + b.vz*dt;
    // player capsule
    if (game.mode === 'play'){
      const t = clamp(((pl.x - ax)*(bx - ax) + (ch[1] - ay)*(by - ay) + (pl.z - az)*(bz - az)) / ((bx - ax)**2 + (by - ay)**2 + (bz - az)**2 || 1), 0, 1);
      const qx = ax + (bx - ax)*t, qy = ay + (by - ay)*t, qz = az + (bz - az)*t;

// ===========================================================================
// Riflemen hold a stretch of line around their post. Unalerted they patrol it at a walk;
// alerted they aim and fire from where they stand, and every few shots (or after a
// reload) they dash a few metres along the line before settling again. Moving soldiers
// face where they go, so the side and back columns of the sheet get used.
// The sheet has one drawing per state and direction, so gaits alternate two drawings:
// walk = walk/stand, run = run/walk, with a small bob on the footfall.
function freeSpot(e, x, z){
  const t = (x - e.hx) * e.ax + (z - e.hz) * e.az, bd = LV.bounds;
  if (Math.abs(t) > e.span || x < bd.x0 + 2 || x > bd.x1 - 2 || z < bd.z0 || z > bd.z1) return false;
  for (const b of BOXES) if (b.move && x > b.x0 - 0.6 && x < b.x1 + 0.6 && z > b.z0 - 0.6 && z < b.z1 + 0.6 && b.y1 > terrainAt(x, z) + 0.45) return false;
  for (const o of game.enemies) if (o !== e && o.state !== 'dead' && Math.hypot((o.gait ? o.tx : o.x) - x, (o.gait ? o.tz : o.z) - z) < 1.4) return false;
  return Math.abs(terrainAt(x, z) - terrainAt(e.hx, e.hz)) < (e.rise || 0.7);
}
function pickMove(e, lo, hi){
  if (e.fixed) return null;
  for (let k = 0; k < 6; k++){
    const d = (Math.random() < 0.5 ? -1 : 1) * rnd(lo, hi), x = e.x + e.ax * d, z = e.z + e.az * d;
    if (freeSpot(e, x, z)) return [x, z];

}

  const dx = e.tx - e.x, dz = e.tz - e.z, L = Math.hypot(dx, dz), sp = e.gait === 'run' ? 3.6 : 1.3;
  e.yaw = wrapA(e.yaw + clamp(wrapA(Math.atan2(dx, dz + (L < 1e-6 ? 1e-4 : 0)) - e.yaw), -6 * dt, 6 * dt));
  if (L <= sp * dt){ e.x = e.tx; e.z = e.tz; e.gait = null; e.gy = terrainAt(e.x, e.z); return true; }
  e.x += dx / L * sp * dt; e.z += dz / L * sp * dt;
  e.gy = terrainAt(e.x, e.z);

}
function gaitFrame(e, fr){

// the fall and down drawings are single side views: mirror them so the body lies along the

function bodyFrame(e, kind){

}
function crewAlive(B){ return game.enemies.filter(e => e.crew && e.emp === B && e.state !== 'dead' && e.state !== 'hit'); }
function gunManned(B){ return B.alive && !B.doorOpen && game.enemies.some(e => e.crew && e.emp === B && e.role === 'gun' && e.post === 'slit' && e.state !== 'dead' && e.state !== 'hit'); }

}
function takeCasemate(B){

// returns how exposed the player is to this crewman (0..1)
function updateCrew(e, dt){
  const B = e.emp;
  if (!B.alive){ e.frame = 'stand_' + spriteFrame(e); return 0; }
  if (e.post === 'slit'){
    // the loader steps onto the gun when the gunner falls
    if (e.role === 'load' && !game.enemies.some(o => o.crew && o.emp === B && o.role === 'gun' && o.state !== 'dead' && o.state !== 'hit')){
      B.takeT += dt;
      if (B.takeT > 3){ e.role = 'gun'; e.x = B.slitPos.gun[0]; e.z = B.slitPos.gun[1]; flash('LOADER TAKES THE GUN', 1.6, WARN); }
    }

    e.frame = (e.role === 'gun' ? (B.mgo && B.mgo.state === 'burst' && ((game.t * 15) | 0) % 2 ? 'fire_' : 'aim_') : 'reload_') + spriteFrame(e);

      const [x, z] = B.doorPos[e.role];

    }

  const sees = pl.z > B.z1 - 0.2 && !trace(e.x, e.gy + 1.5, B.z1 + 0.35, hd[0], hd[1], hd[2]);
  e.yaw = Math.atan2(pl.x - e.x, pl.z - e.z);
  if (e.state === 'fire' && e.st > 0.16){ e.state = 'aim'; e.st = 0; }
  e.fireT -= dt;
  if (sees && e.fireT <= 0){
    e.state = 'fire'; e.st = 0; e.fireT = rnd(1.4, 2.4); e.kick = 1;
    sfx('rifle', { at: [e.x, e.gy + 1.5, e.z], range: 40, cap: 4, vol: 0.9, rate: 0.9 });
    if (Math.random() < clamp(0.38 - dist / 150 - (pl.crouch ? 0.06 : 0) - (pl.moving > 2 ? 0.12 : 0), 0.08, 0.38)) hurt(11);

function updateEnemies(dt){
  const hd = playerHead(), ch = playerChest();
  let expo = MGS.some(m => m.sees) ? 1 : 0;
  for (const e of game.enemies){
    e.st += dt;
    e.kick = Math.max(0, e.kick - dt * 8);
    if (e.state === 'dead'){ e.bob = 0; e.frame = bodyFrame(e, 'down'); continue; }
    if (e.state === 'hit'){
      e.bob = 0;
      e.frame = e.st < 0.16 ? 'hit_' + spriteFrame(e) : bodyFrame(e, 'fall');
      if (e.st > 0.5) e.state = 'dead';
      continue;
    }
    if (game.mode !== 'play'){ e.bob = 0; e.frame = (e.crew ? (e.role === 'gun' ? 'aim_' : 'reload_') : e.pose ? e.pose + '_' : 'stand_') + spriteFrame(e); continue; }
    if (e.crew){ expo = Math.max(expo, updateCrew(e, dt)); continue; }
    if (e.custom){ expo = Math.max(expo, e.custom(e, dt) || 0); continue; }
    const eye = [e.x, e.gy + 1.55, e.z];
    const dist = Math.hypot(pl.x - e.x, pl.z - e.z);
    const sees = dist < (e.sight || 120) && (!trace(eye[0], eye[1], eye[2], hd[0], hd[1], hd[2]) || !trace(eye[0], eye[1], eye[2], ch[0], ch[1], ch[2]));
    if (sees && !e.alert){ e.alert = true; e.gait = null; e.state = 'aim'; e.st = 0; e.fireT = rnd(0.8, 1.8); }
    if (sees) expo = Math.max(expo, clamp(1.2 - dist / 120, 0.35, 1));

    if (!e.alert){
      // patrol: walk a few metres, look out to sea, walk back

      else {
        e.yaw = wrapA(e.yaw + clamp(wrapA(e.look - e.yaw), -2 * dt, 2 * dt));
        e.pauseT -= dt;
        if (e.pauseT <= 0){ const p = pickMove(e, 2, 5); if (p){ e.tx = p[0]; e.tz = p[1]; e.gait = 'walk'; } else e.pauseT = 1; }
      }
      e.frame = e.pose && !e.gait ? e.pose + '_' + spriteFrame(e) : gaitFrame(e, spriteFrame(e));

    }

    if (e.state === 'move'){

      e.frame = gaitFrame(e, spriteFrame(e));

    }

    const want = Math.atan2(pl.x - e.x, pl.z - e.z);
    e.yaw = wrapA(e.yaw + clamp(wrapA(want - e.yaw), -2.4 * dt, 2.4 * dt));
    const relocate = lo => { const p = pickMove(e, lo, lo + 4); if (p){ e.tx = p[0]; e.tz = p[1]; e.gait = 'run'; e.state = 'move'; e.st = 0; return true; } return false; };

    }

    else {

      e.fireT -= dt;
      if (sees && e.fireT <= 0){
        e.state = 'fire'; e.st = 0; e.shots++; e.fireT = rnd(1.9, 3.4); e.kick = 1;
        sfx('rifle', { at: [e.x, e.gy + 1.5, e.z], range: 40, cap: 4, vol: 0.8, rate: 0.85 });
        let p = 0.42 - dist / 200;
        if (pl.moving > 2) p -= 0.17;

}

function update(dt){
  game.t += dt; game.modeT += dt;
  rFlash = Math.max(0, rFlash - dt * 2.5);
  if (game.mode === 'loading' || game.mode === 'title'){ pl.yaw = (game.titleYaw || 0) + Math.sin(game.t * 0.12) * 0.35; return; }
  if (game.paused) return;
  if (game.mode === 'brief'){ if (LV.update) LV.update(dt); return; }
  if (game.mode === 'boat'){
    if (LV.boat) LV.boat(dt);
    updatePlayer(dt);
  } else if (game.mode === 'play' || game.mode === 'down' || game.mode === 'won'){
    if (game.mode === 'play'){ game.clock += dt; updatePlayer(dt); }
    updateMGs(dt); updateBullets(dt); updateEnemies(dt); updateGrenades(dt);
    if (game.wonAt && game.t > game.wonAt && game.mode === 'play'){ game.wonAt = 0; setMode('won'); }
  }
  if (LV.update) LV.update(dt);
  // burning casemates
  game.smokeT -= dt;
  if (game.smokeT <= 0){
    game.smokeT = 0.12;
    for (const B of EMPS){
      if (B.alive || !B.smoke) continue;
      const s = B.smoke;
      part({ x: s[0] + rnd(-2, 2), y: s[1], z: s[2], vx: rnd(-0.2, 0.2), vy: rnd(1, 2), vz: rnd(-0.5, 0), grav: 0, drag: 0.2, size: rnd(1.2, 2.2), col: [58, 58, 56], max: rnd(3, 5), alpha: 0.5, fadeIn: true });
    }
  }
  for (const p of game.parts){
    p.t += dt; p.vy += p.grav * dt;
    const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vz *= k; if (p.grav === 0) p.vy *= k;
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if (p.grav !== 0 && p.y < -0.5) p.t = p.max;
    if (p.fadeIn) p.size += dt * 0.6;
  }
  game.parts = game.parts.filter(p => p.t < p.max);
  // water frames
  const wf = 'water' + (((game.t * 5) | 0) & 3);
  if (TEXREADY) for (const p of WATERP) p.tex = TX[wf];
}

// ===========================================================================
// LEVEL 2 — D-1, THE VIERVILLE DRAW
// ===========================================================================
// Early afternoon, D-Day. The Texas has shelled the draw and WN72's 88 at the mouth is out,
// but the anti-tank wall still closes the only paved road off Omaha. An MG nest dug into the
// west bluff and an R35 turret on a Tobruk still cover the beach flat, and the garrison is
// coming back into the positions up the draw through its tunnels. The 121st Engineers'
// TNT is at the foot of the wall: set the fuse, get clear, then fight up the draw to the
// Vierville crossroads. Mortars on the west rim shell whoever stands still.
//
// Same world frame as the beach: +z inland (south), +x east, sea level 0. The beach flat
// and its promenade sit at y 3; the wall stands across the road at z 35, and the road climbs
// about 30 m to the village at z 255.
function pw(T, z){
  if (z <= T[0][0]) return T[0][1];
  for (let i = 1; i < T.length; i++) if (z <= T[i][0]){ const a = T[i-1], b = T[i]; return a[1] + (b[1] - a[1]) * (z - a[0]) / (b[0] - a[0]); }
  return T[T.length - 1][1];
}
const sstep = t => { t = clamp(t, 0, 1); return t*t*(3 - 2*t); };
const DR = {
  BEACH: [[-200, -3.2], [-70, -2.2], [-40, -0.8], [-16, 1.0], [-6, 2.3], [-4.6, 2.5]],
  FLOOR: [[-60, 3.0], [24, 3.2], [60, 6.2], [120, 13.2], [180, 21.2], [226, 29], [256, 33.6], [400, 35.5]],
  PLAT:  [[-60, 30], [80, 33], [200, 36.5], [400, 37.5]],
  GRAD:  [[-60, 1.9], [70, 1.9], [150, 1.15], [230, 0.6], [400, 0.5]],
  HALF:  [[-60, 7], [60, 7], [100, 9], [400, 9.5]],
  // benches cut into the sides for the firing trenches and the mortar pit. side: -1 west,
  // +1 east; s0: metres out from the floor edge; W: width
  BENCH: [{ side: -1, z0: 66, z1: 84, s0: 1.5, W: 3.5 }, { side: 1, z0: 96, z1: 116, s0: 1.5, W: 3.5 },
          { side: -1, z0: 138, z1: 158, s0: 1.2, W: 3.5 }, { side: 1, z0: 172, z1: 190, s0: 1.0, W: 3.5 },
          { side: -1, z0: 194, z1: 208, s0: 4.5, W: 7, pit: true }],
  WALLZ: [34, 36.2],
  NEST: { x: -15, z0: 21.5, z1: 26.5, hw: 2 },
  TURRET: [-6.5, 9],
  TUNNEL: { z: 128, hw: 0.8 },
};
// the road's centre line, the floor's height and half width
function drC(z){ return 2 + 7 * Math.sin(Math.max(0, z - 20) / 70) * sstep((z - 20) / 40); }
function drFloor(z){ return pw(DR.FLOOR, z); }
function drHalf(z){ return pw(DR.HALF, z); }
// height above the floor at s metres out from the floor edge on one side, benches cut in
function drRise(side, z, s){
  const gr = pw(DR.GRAD, z);
  let r = s * gr;
  for (const b of DR.BENCH){
    if (b.side !== side || z < b.z0 - 6 || z > b.z1 + 6) continue;
    const k = sstep((z - b.z0 + 6) / 6) * sstep((b.z1 + 6 - z) / 6);
    const rb = s < b.s0 ? s * gr : s < b.s0 + b.W ? b.s0 * gr : (s - b.W) * gr;
    r = lerp(r, rb, k);
  }
  return r;
}
function benchY(b, z){ return drFloor(z) + b.s0 * pw(DR.GRAD, z); }
function drawH0(x, z){
  if (z < -3.4) return pw(DR.BEACH, z) + (z > -40 ? vnoise(x / 9, z / 7) * 0.15 : 0);
  const flat = 3.0 + vnoise(x / 7, z / 7) * 0.1;
  if (z < 14) return flat;
  const P = pw(DR.PLAT, z) + vnoise(x / 13, z / 11) * 1.6;
  // the bluff face rises over about 28 m from a foot that wanders 0..4 m inland, gullied
  const f = clamp((z - 14 - (vnoise(x / 18, 1.3) + 0.5) * 4) / 28, 0, 1);
  const bluff = lerp(flat, P, sstep(f)) + vnoise(x / 6, z / 5) * 1.6 * Math.sin(Math.PI * f);
  const c = drC(z), dx = x - c, s = Math.abs(dx) - drHalf(z), fl = drFloor(z);
  const cut = s > 0 ? fl + drRise(Math.sign(dx), z, s) + vnoise(x / 4, z / 5) * 0.35 * clamp(s / 3, 0, 1) : fl + vnoise(x / 5, z / 5) * 0.06;
  return Math.max(flat, Math.min(bluff, cut));
}
// the nest stands on a pad levelled into the bluff face
let _nestY = null;
function nestY(){ if (_nestY == null){ const N = DR.NEST; _nestY = Math.max(drawH0(N.x - N.hw, N.z0 - 0.2), drawH0(N.x + N.hw, N.z0 - 0.2)) + 0.05; } return _nestY; }
// and the tunnel's mouth is cut back to the road's level, so men walk out of it on the flat
function drawH(x, z){
  const h = drawH0(x, z), N = DR.NEST, T = DR.TUNNEL;
  if (x > N.x - N.hw - 1 && x < N.x + N.hw + 1 && z > N.z0 - 1.2 && z < N.z1 + 1) return Math.min(h, nestY());
  if (Math.abs(z - T.z) < 1.4){ const x0 = drC(T.z) + drHalf(T.z) + 0.3; if (x > x0 - 0.5 && x < x0 + 2) return Math.min(h, drFloor(z) + 0.02); }
  return h;
}
function drawGrid(){
  const xs = [], zs = [];
  for (let x = -200; x < -46; x += 14) xs.push(x);
  for (let x = -46; x < -20; x += 4) xs.push(x);
  for (let x = -20; x <= 24; x += 2){ if (x === -2) xs.push(-1.1); else if (x === 6) xs.push(5.1, 6); else xs.push(x); }
  for (let x = 28; x <= 46; x += 4) xs.push(x);
  for (let x = 58; x <= 202; x += 12) xs.push(x);
  for (let z = -200; z < -40; z += 10) zs.push(z);
  for (let z = -40; z < -6; z += 4) zs.push(z);
  zs.push(-6, -4.6, -3.4);
  for (let z = -2; z < 20; z += 2){ zs.push(z); if (z === 2) zs.push(3.2); }
  for (let z = 20; z < 262; z += 3) zs.push(z);
  for (let z = 262; z <= 340; z += 6) zs.push(z);
  return { xs, zs };
}
function drawTex(cx, cy, cz, n){
  if (cz < -3.4) return cy < 0.55 ? 'wetsand' : 'sand';
  if (cz < 3.2) return 'road';                                        // the promenade
  if (Math.abs(cx - drC(cz)) < 3.1 && cz < 262) return 'road';         // D-1, the paved road
  if (n[1] < 0.6) return 'rock';
  if (cz < 15) return 'turf';
  return n[1] < 0.86 ? 'grass' : 'meadow';
}

// roofless shell: thin walls broken off at random heights, a doorway in the front (z0)
// wall, a window in each side
function ruin(x0, z0, x1, z1, h, tex, R){
  const t = 0.35, gy = Math.min(terrainAt(x0, z0), terrainAt(x1, z0), terrainAt(x0, z1), terrainAt(x1, z1)) - 0.8;
  const piece = (ax0, az0, ax1, az1, y0, y1) => {
    if (y1 - y0 < 0.2 || ax1 - ax0 < 0.05 || az1 - az0 < 0.05) return;
    boxGeo(POLYS, ax0, y0, az0, ax1, y1, az1, tex, tex);
    BOXES.push({ x0: ax0, x1: ax1, y0, y1, z0: az0, z1: az1, los: true, move: true, kind: 'concrete' });
  };
  // a run along one axis from a to b, broken into chunks; gaps: [from, to, sill]
  const run = (a, b, along, at, gaps) => {
    let u = a;
    while (u < b - 0.05){
      const gap = gaps.find(gp => u >= gp[0] - 0.01 && u < gp[1]);
      let v, top;
      if (gap){ v = gap[1]; top = gy + 0.8 + gap[2]; if (gap[2] <= 0){ u = v; continue; } }
      else {
        const next = gaps.filter(gp => gp[0] > u).reduce((m, gp) => Math.min(m, gp[0]), b);
        v = Math.min(next, u + 1.2 + R() * 1.6);
        top = gy + 0.8 + h * (R() < 0.3 ? 0.35 + R() * 0.3 : 0.75 + R() * 0.25);
      }
      if (along === 'x') piece(u, at, v, at + t, gy, top); else piece(at, u, at + t, v, gy, top);
      u = v;
    }
  };
  const dw = 1.4, dx0 = x0 + 1 + R() * (x1 - x0 - 2 - dw), wl = 1.3;
  const wz0 = z0 + 1.2 + R() * (z1 - z0 - 2.4 - wl), wz1 = z0 + 1.2 + R() * (z1 - z0 - 2.4 - wl);
  run(x0, x1, 'x', z0, [[dx0, dx0 + dw, 0]]);
  run(x0, x1, 'x', z1 - t, [[x0 + (x1 - x0) * 0.4, x0 + (x1 - x0) * 0.4 + wl, 1.0]]);
  run(z0 + t, z1 - t, 'z', x0, [[wz0, wz0 + wl, 1.0]]);
  run(z0 + t, z1 - t, 'z', x1 - t, [[wz1, wz1 + wl, 1.0]]);
}
// a tree: trunk, and a crown of two chamfered blocks
function tree(x, z, R){
  const gy = terrainAt(x, z) - 0.2, h = 2.3 + R() * 1.3, tr = 0.2 + R() * 0.08, cs = 1.2 + R() * 0.6;
  boxGeo(POLYS, x - tr, gy, z - tr, x + tr, gy + h, z + tr, 'timber', null);
  const cy = gy + h - 0.5;
  boxGeo(POLYS, x - cs, cy, z - cs, x + cs, cy + cs * 1.5, z + cs, 'leaves', 'leaves', { bev: cs * 0.45 });
  const c2 = cs * 0.7, ox = (R() - 0.5) * cs, oz = (R() - 0.5) * cs;
  boxGeo(POLYS, x + ox - c2, cy + cs * 1.1, z + oz - c2, x + ox + c2, cy + cs * 1.1 + c2 * 1.4, z + oz + c2, 'leaves', 'leaves', { bev: c2 * 0.45 });
  shStamp(x, z, cy + cs * 1.5, cs * 0.9);
  shStamp(x, z, gy + h, tr + 0.1);
  TREES.push({ x, z, r: tr + 0.08, top: gy + h });
}

  const sr = v.pad && v.pad.h > 90 ? Math.max(14, Math.min(20, v.pad.h * 0.09)) : Math.max(14, Math.min(v.w, v.h) * 0.045);
  L.push(v.pad && v.pad.h > 90 ? { id: 'swap', label: 'SWAP', x: stickRight ? W * 0.05 + sr : W * 0.95 - sr, y: v.pad.y + v.pad.h - sr - 4, r: sr }
                               : { id: 'swap', label: 'SWAP', x: v.x + v.w / 2, y: v.y + v.h - sr - 8, r: sr });

}
function touchLayoutBase(v){

function drawTouch(v){

  cam.y = Math.max(pl.fy + pl.eye + bobY + (inBoat ? Math.sin(game.t * 1.7) * 0.08 : 0), 0.25);
  cam.yaw = pl.yaw + rnd(-1, 1) * sh * 0.01;

  if (game.mode === 'down' && game.checkpoint && !game.picked) respawn();
  else if (game.mode === 'won' && !game.picked && !lastLevel()) nextLevel();

  else if (game.mode === 'down' && !game.picked){ newGame(game.carry); if (game.mode === 'brief'){ setMode('play'); if (LV.go) LV.go(); } }

addEventListener('keydown', e => {

  if (e.code === 'Enter') startOrRestart();
  if (/^Digit[0-9]$/.test(e.code) && +e.code.slice(5) < STAGES.length && (game.mode === 'title' || game.mode === 'won' || game.mode === 'down')) setStage(+e.code.slice(5));

  if (e.code === 'KeyG') throwGrenade();

  if (e.code === 'KeyL' && (game.mode === 'title' || game.mode === 'won' || game.mode === 'down')) skipLevel();
