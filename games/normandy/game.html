<title>Normandy</title>
<meta name="claude:viewport-fit-sides" content="cover">
<!--
  NORMANDY — first-person beach assault, Dog Green sector, 6 June 1944.

  Engine lineage:
    * world renderer is DECKRUNNER's solid hull: Freedoom textures, a low-res
      z-buffered software rasterizer (perspective-correct, mipped, one mip per
      span), sun shading against a horizon-height shadow map, fog. Here it draws
      a heightfield beach, Czech hedgehogs, a bevel-top seawall and a casemate.
    * soldiers are 8-direction billboard sprites rasterized into the same
      z-buffer, so the seawall's parapet hides their legs.
    * HUD frame, strip slots and instrument vocabulary are Bounty Hunter's.
    * sound is ZzFX (MIT, Frank Force), as in DECKRUNNER.

  World frame: metres. +x east along the beach, +z inland (south), +y up.
  Sea level y = 0. The landing craft grounds at z = -13; the seawall runs at
  z = 100; the casemate sits behind it at x 14..26, z 112..120.

  Controls: WASD move, mouse or arrows look, click / Space fire, Alt or C crouch,
  G grenade, R reload, M sound, P pause, Enter start.
  Touch: left thumb moves, right thumb looks, FIRE / NADE / DUCK buttons.
-->

</style>

<script>
"use strict";
/*@ASSETS@*/
/*@ZZFX@*/

const c = document.getElementById('c');
let g = c.getContext('2d');
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const rnd = (a, b) => a + Math.random() * (b - a);
const TAU = Math.PI * 2;
function wrapA(a){ while (a > Math.PI) a -= TAU; while (a < -Math.PI) a += TAU; return a; }

// ===========================================================================
// PALETTE — Bounty Hunter's frame, warmed to amber for 1944
// ===========================================================================
const PHOS   = '255,196,92';
const CELL_B = '232,170,60';
const NUM    = '255,246,222';
const LBL    = '206,196,150';
const WARN   = '226,72,52';
const PANEL  = '#4a5340', PANEL_D = '#333b2c', PANEL_L = '#5c6650';
const STEEL  = '#8d9686', WELL = '#070c11';
const MUST   = '#c19a33', MUST_D = '#8b6d1e', MUST_L = '#dcb84e';
const STENCIL= '38,28,8';
const opt = { post:true, bloom:true };

let W = 0, H = 0, DPR = 1;
function resize(){
  DPR = Math.min(devicePixelRatio || 1, 2);
  W = c.clientWidth; H = c.clientHeight;
  c.width = Math.max(1, W * DPR); c.height = Math.max(1, H * DPR);
  g.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener('resize', resize); resize();

function narrow(){ return W < 640; }
function viewportRect(){
  const side = Math.max(14, W * (narrow() ? 0.05 : 0.058));
  const band = H * (narrow() ? 0.19 : 0.215), top = H * 0.03, bot = H * 0.014;
  const v = { x: side, y: top, w: W - side * 2, h: H - top - band - bot, side, band, bot, pad: null };
  // tall phone: keep the view near square and give the spare height to a thumb deck below it
  if (v.h > v.w * 1.12){
    const nh = Math.round(v.w * 1.05), bz = Math.max(5, Math.min(side, band) * 0.16);
    v.pad = { x: 0, y: v.y + nh + bz * 2, w: W, h: v.h - nh - bz * 2 };
    v.h = nh;
  }
  return v;
}

// ===========================================================================
// WORLD CONSTANTS
// ===========================================================================
const FAR = 320, NEAR = 0.08, TD = 32;             // TD: texels per metre on walls
const EYE = 1.62, EYE_C = 1.02;                     // standing / crouched eye height
const SUN_EL = 22 * Math.PI / 180;
const SUN_H = (() => { const a = [0.92, -0.38], l = Math.hypot(a[0], a[1]); return [a[0]/l, a[1]/l]; })();
const SUNL = [SUN_H[0]*Math.cos(SUN_EL), Math.sin(SUN_EL), SUN_H[1]*Math.cos(SUN_EL)];
const TAN_EL = Math.tan(SUN_EL);
const AMB = [0.50, 0.54, 0.60], SUNC = [0.86, 0.78, 0.64];
const FOGC = [170, 178, 180];
const FOGN = 1024, FOGK = FOGN / FAR;
const FOG = new Float32Array(FOGN + 2), FOGR = new Float32Array(FOGN + 2), FOGG = new Float32Array(FOGN + 2), FOGB = new Float32Array(FOGN + 2);
for (let i = 0; i <= FOGN + 1; i++){
  const d = i / FOGK, v = d < 18 ? 1 : Math.pow(Math.max(0, 1 - (d - 18) / (FAR - 18)), 1.55);
  FOG[i] = v; FOGR[i] = FOGC[0]*(1 - v); FOGG[i] = FOGC[1]*(1 - v); FOGB[i] = FOGC[2]*(1 - v);
}

// ===========================================================================
// CAMERA (DECKRUNNER's basis)
// ===========================================================================
const cam = { x:0, y:2, z:-20, yaw:0, pitch:0, r:[1,0,0], u:[0,1,0], f:[0,0,1] };
function updateBasis(){
  const cy = Math.cos(cam.yaw), sy = Math.sin(cam.yaw), cp = Math.cos(cam.pitch), sp = Math.sin(cam.pitch);
  const f = [sy*cp, sp, cy*cp], r = [cy, 0, -sy];
  cam.f = f; cam.r = r;
  cam.u = [f[1]*r[2] - f[2]*r[1], f[2]*r[0] - f[0]*r[2], f[0]*r[1] - f[1]*r[0]];
}
function toCam(x, y, z, o){
  const dx = x - cam.x, dy = y - cam.y, dz = z - cam.z, r = cam.r, u = cam.u, f = cam.f;
  o[0] = dx*r[0] + dy*r[1] + dz*r[2];
  o[1] = dx*u[0] + dy*u[1] + dz*u[2];
  o[2] = dx*f[0] + dy*f[1] + dz*f[2];
  return o;
}

// ===========================================================================
// TEXTURES
// ===========================================================================
const TX = {};
let TEXREADY = false;
function texMips(w, h, px){
  const out = [{ w, h, sh: Math.log2(w), wm: w - 1, hm: h - 1, px }];
  while (w > 4 && h > 4){
    const nw = w >> 1, nh = h >> 1, s = out[out.length - 1].px, np = new Uint32Array(nw * nh);
    for (let y = 0; y < nh; y++) for (let x = 0; x < nw; x++){
      const a = s[2*y*w + 2*x], b = s[2*y*w + 2*x + 1], cc = s[(2*y + 1)*w + 2*x], d = s[(2*y + 1)*w + 2*x + 1];
      const r = ((a & 255) + (b & 255) + (cc & 255) + (d & 255)) >> 2;
      const gg = (((a >>> 8) & 255) + ((b >>> 8) & 255) + ((cc >>> 8) & 255) + ((d >>> 8) & 255)) >> 2;
      const bl = (((a >>> 16) & 255) + ((b >>> 16) & 255) + ((cc >>> 16) & 255) + ((d >>> 16) & 255)) >> 2;
      np[y*nw + x] = (0xff000000 | (bl << 16) | (gg << 8) | r) >>> 0;
    }
    out.push({ w: nw, h: nh, sh: Math.log2(nw), wm: nw - 1, hm: nh - 1, px: np });
    w = nw; h = nh;
  }
  return out;
}
function makeTex(w, h, fn){
  const px = new Uint32Array(w * h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++){
    const [r, gg, b] = fn(x, y);
    px[y*w + x] = (0xff000000 | (clamp(b|0, 0, 255) << 16) | (clamp(gg|0, 0, 255) << 8) | clamp(r|0, 0, 255)) >>> 0;
  }
  return texMips(w, h, px);
}
function hashN(x, y){ let h = (x * 374761393 + y * 668265263) >>> 0; h = Math.imul(h ^ (h >>> 13), 1274126177) >>> 0; return ((h ^ (h >>> 16)) >>> 0) / 4294967296; }
function loadImg(src){ return new Promise((ok, bad) => { const im = new Image(); im.onload = () => ok(im); im.onerror = bad; im.src = src; }); }
function imgPixels(im){
  const cv = document.createElement('canvas'); cv.width = im.width; cv.height = im.height;
  const gg = cv.getContext('2d'); gg.drawImage(im, 0, 0);
  return new Uint32Array(gg.getImageData(0, 0, im.width, im.height).data.buffer.slice(0));
}
const SPR = { px: null, w: 0, h: 0, f: {}, mpp: 0.022 };
const MEDKIT = (() => {
  const art = [
    '....oooooooooooo....',
    '...oOOOOOOOOOOOOo...',
    '..oOOOOOOOOOOOOOOo..',
    '.oOOOOwwwwwwwwOOOOo.',
    '.oOOOOwwwrrwwwOOOOo.',
    '.oOOOOwwwrrwwwOOOOo.',
    '.oOOOOwrrrrrrwOOOOo.',
    '.oOOOOwrrrrrrwOOOOo.',
    '.oOOOOwwwrrwwwOOOOo.',
    '.oOOOOwwwrrwwwOOOOo.',
    '.oOOOOwwwwwwwwOOOOo.',
    '.oOOOOOOOOOOOOOOOOo.',
    '.ossssssssssssssssso',
    '..oooooooooooooooo..',
  ];
  const col = { o: 0xff1c2a22, O: 0xff3a5a4a, s: 0xff2c4438, w: 0xffe6eef0, r: 0xff2a2ad0 };
  const w = art[0].length, h = art.length, px = new Uint32Array(w * h);
  art.forEach((row, y) => [...row].forEach((ch, x) => { px[y*w + x] = ch === '.' ? 0 : col[ch]; }));
  return { px, w, h, f: { kit: [0, 0, w, h, w / 2, h] }, mpp: 0.034 };
})();
const MEDS = [];
// ammo can: olive steel, yellow stencil band; +3 clips, +2 grenades
const AMMOCAN = (() => {
  const art = [
    '.....kkkkkkkk.......',
    '.....k......k.......',
    'kkkkkkkkkkkkkkkkkkkk',
    'kHHHHHHHHHHHHHHHHHHk',
    'kOOOOOOOOOOOOOOOOOOk',
    'kOOOOOOOOOOOOOOOOOOk',
    'kOyyyyyyyyyyyyyyyyOk',
    'kOOOOOOOOOOOOOOOOOOk',
    'kOOyOyOyyOyyyOyOOOOk',
    'kOOOOOOOOOOOOOOOOOOk',
    'kOOOOOOOOOOOOOOOOOOk',
    'kssssssssssssssssssk',
    'kkkkkkkkkkkkkkkkkkkk',
  ];
  const col = { k: 0xff141a16, H: 0xff4c6a5a, O: 0xff335043, s: 0xff253a30, y: 0xff3cc4e0 };
  const w = art[0].length, h = art.length, px = new Uint32Array(w * h);
  art.forEach((row, y) => [...row].forEach((ch, x) => { px[y*w + x] = ch === '.' ? 0 : col[ch]; }));
  return { px, w, h, f: { can: [0, 0, w, h, w / 2, h] }, mpp: 0.026 };
})();
const AMMOS = [];
async function loadAssets(){
  for (const [k, src] of Object.entries(NM_TEX)){
    const im = await loadImg(src);
    TX[k] = texMips(im.width, im.height, imgPixels(im));
    if (k === 'sky') TX.skyRaw = { w: im.width, h: im.height, px: TX[k][0].px };
  }
  TX.foam = makeTex(64, 64, (x, y) => {
    const n = hashN(x >> 1, y >> 1), s = Math.sin((y / 64) * TAU * 3 + Math.sin(x / 9) * 1.4);
    const v = 150 + 95 * Math.max(0, s) * (0.6 + 0.4 * n);
    return [v, v + 4, v + 4];
  });
  TX.dark = makeTex(8, 8, (x, y) => { const v = 14 + hashN(x, y) * 10; return [v, v, v * 0.9]; });
  const im = await loadImg(NM_SPR.img);
  SPR.px = imgPixels(im); SPR.w = im.width; SPR.h = im.height; SPR.f = NM_SPR.f;
  SPR.mpp = 1.78 / SPR.f.stand_0[5];
  TEXREADY = true;
}

// ===========================================================================
// TERRAIN — heightfield on a non-uniform grid, triangulated
// ===========================================================================
const PROF = [[-400,-3.2],[-60,-3.2],[-20,-1.0],[0,-0.35],[60,1.0],[86,1.8],[92,2.2],[100,2.7],[101.2,4.2],
              [126,4.2],[140,9],[160,15],[180,17],[400,17]];
function profile(z){
  for (let i = 1; i < PROF.length; i++) if (z <= PROF[i][0]){
    const a = PROF[i-1], b = PROF[i]; return a[1] + (b[1] - a[1]) * (z - a[0]) / (b[0] - a[0]);
  }
  return PROF[PROF.length - 1][1];
}
function vnoise(x, z){
  const ix = Math.floor(x), iz = Math.floor(z), fx = x - ix, fz = z - iz;
  const sx = fx*fx*(3 - 2*fx), sz = fz*fz*(3 - 2*fz);
  const a = hashN(ix, iz), b = hashN(ix + 1, iz), cc = hashN(ix, iz + 1), d = hashN(ix + 1, iz + 1);
  return lerp(lerp(a, b, sx), lerp(cc, d, sx), sz) - 0.5;
}
const GAP = { x0: -8, x1: -4, z0: 90, z1: 104 };
function inGap(x, z){ return x >= GAP.x0 && x <= GAP.x1 && z >= GAP.z0 && z <= GAP.z1; }
function hfun(x, z){
  if (inGap(x, z)) return 2.15 + (z - GAP.z0) / (GAP.z1 - GAP.z0) * 2.05;
  let h = profile(z);
  if (z > -20 && z < 88) h += vnoise(x / 9, z / 7) * 0.22 + Math.sin(x * 0.21 + z * 0.9) * 0.025;
  else if (z >= 128) h += vnoise(x / 11, z / 9) * clamp((z - 128) / 12, 0, 1) * 1.8;
  else if (z > 101.2 && z < 126) h += vnoise(x / 6, z / 6) * 0.12;
  return h;
}
const XS = [], ZS = [];
for (let x = -160; x < -84; x += 8) XS.push(x);
for (let x = -84; x <= 84; x += 4) XS.push(x);
for (let x = 92; x <= 160; x += 8) XS.push(x);
for (let z = -100; z < 86; z += 4) ZS.push(z);
for (let z = 86; z < 118; z += 2){ ZS.push(z); if (z === 100) ZS.push(101.2); }
for (let z = 118; z <= 184; z += 4) ZS.push(z);
const NX = XS.length, NZ = ZS.length;
const TH = new Float32Array(NX * NZ);
for (let j = 0; j < NZ; j++) for (let i = 0; i < NX; i++) TH[j*NX + i] = hfun(XS[i], ZS[j]);
function bsearch(arr, v){
  let lo = 0, hi = arr.length - 2;
  if (v <= arr[0]) return 0;
  if (v >= arr[hi + 1]) return hi;
  while (lo < hi){ const m = (lo + hi + 1) >> 1; if (arr[m] <= v) lo = m; else hi = m - 1; }
  return lo;
}
function terrainAt(x, z){
  const i = bsearch(XS, x), j = bsearch(ZS, z);
  const fx = clamp((x - XS[i]) / (XS[i+1] - XS[i]), 0, 1), fz = clamp((z - ZS[j]) / (ZS[j+1] - ZS[j]), 0, 1);
  const h00 = TH[j*NX + i], h10 = TH[j*NX + i + 1], h01 = TH[(j+1)*NX + i], h11 = TH[(j+1)*NX + i + 1];
  return fx >= fz ? h00 + (h10 - h00)*fx + (h11 - h10)*fz : h00 + (h11 - h01)*fx + (h01 - h00)*fz;
}

// ===========================================================================
// SHADOW MAP (DECKRUNNER) — S(x,z): height below which a point is in shadow
// ===========================================================================
const SG = (() => {
  const res = 0.5, x0 = -96, z0 = -40, w = 384, h = 344;
  return { x0, z0, w, h, res, H: new Float32Array(w*h).fill(-1e9), T: new Float32Array(w*h), S: new Float32Array(w*h).fill(-1e9) };
})();
function shStamp(x, z, y, r){
  const G = SG, i0 = Math.floor((x - r - G.x0) / G.res), i1 = Math.floor((x + r - G.x0) / G.res);
  const j0 = Math.floor((z - r - G.z0) / G.res), j1 = Math.floor((z + r - G.z0) / G.res);
  for (let j = Math.max(0, j0); j <= Math.min(G.h - 1, j1); j++)
    for (let i = Math.max(0, i0); i <= Math.min(G.w - 1, i1); i++){ const k = j*G.w + i; if (y > G.H[k]) G.H[k] = y; }
}
function shBox(b){
  const G = SG;
  for (let z = b.z0 + G.res*0.5; z < b.z1; z += G.res) for (let x = b.x0 + G.res*0.5; x < b.x1; x += G.res) shStamp(x, z, b.y1, 0);
}
function shMarch(){
  const G = SG, { w, h, H, S, T, res } = G, lx = SUN_H[0], lz = SUN_H[1], drop = res * TAN_EL;
  let maxH = -1e9;
  for (let k = 0; k < H.length; k++) if (H[k] > maxH) maxH = H[k];
  for (let j = 0; j < h; j++) for (let i = 0; i < w; i++){
    let s = -1e9;
    const floor = T[j*w + i] - 2;
    for (let k = 1; ; k++){
      const reach = maxH - k * drop;
      if (reach < s || reach < floor) break;
      const ii = Math.round(i + lx * k), jj = Math.round(j + lz * k);
      if (ii < 0 || jj < 0 || ii >= w || jj >= h) break;
      const v = H[jj*w + ii] - k * drop;
      if (v > s) s = v;
    }
    S[j*w + i] = s;
  }
}
function shadowAt(x, z){
  const G = SG, gx = clamp((x - G.x0) / G.res, 0, G.w - 1.001), gz = clamp((z - G.z0) / G.res, 0, G.h - 1.001);
  const ix = gx | 0, iy = gz | 0, fx = gx - ix, fy = gz - iy, q = iy*G.w + ix, Sm = G.S;
  const s0 = Sm[q] + (Sm[q+1] - Sm[q])*fx, s1 = Sm[q+G.w] + (Sm[q+G.w+1] - Sm[q+G.w])*fx;
  return s0 + (s1 - s0)*fy;
}

// ===========================================================================
// GEOMETRY — DECKRUNNER's polygon format: [gx,gy,gz,u,v,mx,mz,y] per vertex
// ===========================================================================
const POLYS = [], WATERP = [], BUNKERP = [];
let dynPolys = [];
function mkPoly(pts, tex, nrm, uvf, fl){
  fl = fl || {};
  const n = pts.length, d = new Float64Array(n * 8), G = SG;
  const off = (nrm[1] > 0.7 || fl.inner) ? 0 : 0.35;
  const ox = nrm[0]*off, oz = nrm[2]*off;
  let x0 = 1e9, x1 = -1e9, y0 = 1e9, y1 = -1e9, z0 = 1e9, z1 = -1e9;
  for (let i = 0; i < n; i++){
    const p = pts[i], o = i * 8, uv = uvf(p[0], p[1], p[2]);
    d[o] = p[0]; d[o+1] = p[1]; d[o+2] = p[2];
    d[o+3] = uv[0] + 65536; d[o+4] = uv[1] + 65536;
    d[o+5] = (p[0] + ox - G.x0) / G.res; d[o+6] = (p[2] + oz - G.z0) / G.res; d[o+7] = p[1];
    x0 = Math.min(x0, p[0]); x1 = Math.max(x1, p[0]); y0 = Math.min(y0, p[1]); y1 = Math.max(y1, p[1]); z0 = Math.min(z0, p[2]); z1 = Math.max(z1, p[2]);
  }
  const lam = nrm[0]*SUNL[0] + nrm[1]*SUNL[1] + nrm[2]*SUNL[2];
  return { n, d, tn: tex, tex: TX[tex], nx: nrm[0], ny: nrm[1], nz: nrm[2], p0: pts[0],
           lam: fl.dark ? 0 : Math.max(0, lam), sun: !fl.dark && lam > 0.02, amb: fl.dark ? 0.35 : (fl.amb || 1),
           cx: (x0 + x1)/2, cy: (y0 + y1)/2, cz: (z0 + z1)/2, rad: Math.hypot(x1 - x0, y1 - y0, z1 - z0)/2 + 0.5,
           two: !!fl.two, key: 0 };
}
function nrmOf(a, b, cc){
  const ux = b[0] - a[0], uy = b[1] - a[1], uz = b[2] - a[2], vx = cc[0] - a[0], vy = cc[1] - a[1], vz = cc[2] - a[2];
  let nx = uy*vz - uz*vy, ny = uz*vx - ux*vz, nz = ux*vy - uy*vx;
  const l = Math.hypot(nx, ny, nz) || 1; return [nx/l, ny/l, nz/l];
}
const uvGround = (x, y, z) => [x * 16, z * 16];
const uvWallX = yt => (x, y, z) => [x * TD, (yt - y) * TD];
const uvWallZ = yt => (x, y, z) => [z * TD, (yt - y) * TD];
const uvTop = (x, y, z) => [x * 20, z * 20];
function quad(list, a, b, cc, d, tex, nrm, uvf, fl){ list.push(mkPoly([a, b, cc, d], tex, nrm, uvf, fl)); }
function wall(list, x0, z0, x1, z1, yb, yt, tex, fl){
  if (yt - yb < 0.01) return;
  const dx = x1 - x0, dz = z1 - z0, L = Math.hypot(dx, dz) || 1, nrm = [dz/L, 0, -dx/L], ax = dx/L, az = dz/L;
  quad(list, [x0, yb, z0], [x1, yb, z1], [x1, yt, z1], [x0, yt, z0], tex, nrm, (x, y, z) => [(x*ax + z*az) * TD, (yt - y) * TD], fl);
}
function hrect(list, x0, z0, x1, z1, y, tex, fl, down){
  quad(list, [x0, y, z0], [x1, y, z0], [x1, y, z1], [x0, y, z1], tex, down ? [0, -1, 0] : [0, 1, 0], uvTop, fl);
}
// box with optional 45-degree chamfer of `bev` round the roof; o.skip = {f,b,l,r} drops faces
function boxGeo(list, x0, y0, z0, x1, y1, z1, side, top, o){
  o = o || {}; const B = o.bev || 0, yw = y1 - B, sk = o.skip || {};
  if (!sk.f) wall(list, x0, z0, x1, z0, y0, yw, side, o);
  if (!sk.b) wall(list, x1, z1, x0, z1, y0, yw, side, o);
  if (!sk.l) wall(list, x0, z1, x0, z0, y0, yw, side, o);
  if (!sk.r) wall(list, x1, z0, x1, z1, y0, yw, side, o);
  if (B && top){
    const a0 = x0 + B, a1 = x1 - B, b0 = z0 + B, b1 = z1 - B, S2 = Math.SQRT1_2;
    hrect(list, a0, b0, a1, b1, y1, top, o);
    quad(list, [x0, yw, z0], [x0, yw, z1], [a0, y1, b1], [a0, y1, b0], top, [-S2, S2, 0], uvTop, o);
    quad(list, [x1, yw, z1], [x1, yw, z0], [a1, y1, b0], [a1, y1, b1], top, [S2, S2, 0], uvTop, o);
    quad(list, [x1, yw, z0], [x0, yw, z0], [a0, y1, b0], [a1, y1, b0], top, [0, S2, -S2], uvTop, o);
    quad(list, [x0, yw, z1], [x1, yw, z1], [a1, y1, b1], [a0, y1, b1], top, [0, S2, S2], uvTop, o);

// oriented box: centre c, unit axes A (long), Bv, Cv; half sizes ha, hb, hc
function oboxGeo(list, c, A, Bv, Cv, ha, hb, hc, tex){
  const P = (sa, sb, sc) => [c[0] + A[0]*sa*ha + Bv[0]*sb*hb + Cv[0]*sc*hc,
                             c[1] + A[1]*sa*ha + Bv[1]*sb*hb + Cv[1]*sc*hc,
                             c[2] + A[2]*sa*ha + Bv[2]*sb*hb + Cv[2]*sc*hc];
  const uvA = t => (x, y, z) => { const dx = x - c[0], dy = y - c[1], dz = z - c[2];
    return [(dx*t[0] + dy*t[1] + dz*t[2]) * TD, (dx*A[0] + dy*A[1] + dz*A[2]) * TD]; };
  const neg = v => [-v[0], -v[1], -v[2]];
  quad(list, P(-1, 1, -1), P(1, 1, -1), P(1, 1, 1), P(-1, 1, 1), tex, Bv, uvA(Cv));
  quad(list, P(-1, -1, 1), P(1, -1, 1), P(1, -1, -1), P(-1, -1, -1), tex, neg(Bv), uvA(Cv));
  quad(list, P(-1, -1, 1), P(-1, 1, 1), P(1, 1, 1), P(1, -1, 1), tex, Cv, uvA(Bv));
  quad(list, P(1, -1, -1), P(1, 1, -1), P(-1, 1, -1), P(-1, -1, -1), tex, neg(Cv), uvA(Bv));
  quad(list, P(1, -1, -1), P(1, -1, 1), P(1, 1, 1), P(1, 1, -1), tex, A, uvA(Bv));
  quad(list, P(-1, 1, -1), P(-1, 1, 1), P(-1, -1, 1), P(-1, -1, -1), tex, neg(A), uvA(Bv));
}

// ---- scene layout
const BOXES = [];       // collision + line of sight: {x0,x1,y0,y1,z0,z1, los, move}

function rngSeed(s){ return () => { s = (s * 1664525 + 1013904223) >>> 0; return s / 4294967296; }; }

function buildWorld(){
  const R = rngSeed(1944);
  // terrain triangles
  for (let j = 0; j < NZ - 1; j++) for (let i = 0; i < NX - 1; i++){
    const P = (ii, jj) => [XS[ii], TH[jj*NX + ii], ZS[jj]];
    const v00 = P(i, j), v10 = P(i + 1, j), v01 = P(i, j + 1), v11 = P(i + 1, j + 1);
    for (const tri of [[v00, v11, v10], [v00, v01, v11]]){
      const my = Math.max(tri[0][1], tri[1][1], tri[2][1]);
      if (my < -0.3) continue;
      let n = nrmOf(tri[0], tri[1], tri[2]); if (n[1] < 0) n = [-n[0], -n[1], -n[2]];
      const cx = (tri[0][0] + tri[1][0] + tri[2][0]) / 3, cz = (tri[0][2] + tri[1][2] + tri[2][2]) / 3, cy = (tri[0][1] + tri[1][1] + tri[2][1]) / 3;
      let tex;
      if (inGap(cx, cz) && cz > 92) tex = 'shingle';
      else if (cz >= 128) tex = 'grass';
      else if (cz >= 101.2) tex = 'turf';

    p.water = true; POLYS.push(p); WATERP.push(p);
  }
  for (const [x0, x1, z0, z1] of [[-520, 520, -520, -100], [-520, -160, -100, 60], [160, 520, -100, 60]]){
    const p = mkPoly([[x0, 0, z0], [x1, 0, z0], [x1, 0, z1], [x0, 0, z1]], 'water0', [0, 1, 0], (x, y, z) => [x * 12, z * 12]);

    wall(list, s.x1, z, s.x1, z + dz, s.y0, s.y1, 'bunker', { inner: true, dark: true });

  // landing craft (LCVP): hull walls, deck, coxswain's stand; the ramp is dynamic
  {
    const b = BOAT;
    boxGeo(POLYS, b.x0, -0.6, b.z0, b.x0 + 0.14, 2.0, b.z1, 'hull', 'steel');
    boxGeo(POLYS, b.x1 - 0.14, -0.6, b.z0, b.x1, 2.0, b.z1, 'hull', 'steel');
    boxGeo(POLYS, b.x0, -0.6, b.z0 - 0.14, b.x1, 2.0, b.z0, 'hull', 'steel');
    boxGeo(POLYS, 0.7, b.deck, b.z0, b.x1 - 0.14, 2.35, b.z0 + 1.6, 'hull', 'steel');
    hrect(POLYS, b.x0 + 0.14, b.z0, b.x1 - 0.14, b.z1, b.deck, 'deck');
    BOXES.push({ x0: b.x0, x1: b.x0 + 0.14, y0: -0.6, y1: 2.0, z0: b.z0, z1: b.z1, los: true, move: true, kind: 'steel' });
    BOXES.push({ x0: b.x1 - 0.14, x1: b.x1, y0: -0.6, y1: 2.0, z0: b.z0, z1: b.z1, los: true, move: true, kind: 'steel' });

    BOXES.push({ x0: 0.7, x1: b.x1, y0: b.deck, y1: 2.35, z0: b.z0, z1: b.z0 + 1.6, los: true, move: true, kind: 'steel' });

  const up = [1/Math.sqrt(3), 1/Math.sqrt(3), 1/Math.sqrt(3)], a = [Math.SQRT1_2, -Math.SQRT1_2, 0];
  const b2 = [up[1]*a[2] - up[2]*a[1], up[2]*a[0] - up[0]*a[2], up[0]*a[1] - up[1]*a[0]];

  const L = 2.6, hl = L / 2, cy = hl * Math.sin(Math.asin(1/Math.sqrt(3)));

    for (let i = 0; i < 3; i++){

      oboxGeo(POLYS, cen, A, o1, o2, hl, 0.08, 0.08, 'steel');
      for (let t = -hl; t <= hl; t += 0.25) shStamp(cen[0] + A[0]*t, cen[2] + A[2]*t, cen[1] + A[1]*t, 0.12);
    }
    hdg.top = gy + cy * 2;
  }
  // timber stakes leaning seaward
  for (let k = 0; k < 12; k++){
    const x = -50 + k * 9 + (R() - 0.5) * 4, z = 22 + R() * 50, gy = terrainAt(x, z), tilt = 0.5;
    const A = [0, Math.cos(tilt), -Math.sin(tilt)], Bv = [1, 0, 0], Cv = [0, Math.sin(tilt), Math.cos(tilt)];

  for (const [tx, tz] of [[22, 30], [-28, 45], [26, 59], [-12, 73]]){

    for (const h of HEDGES){ const d = Math.hypot(h.x - tx, h.z - tz); if (d < bd){ bd = d; best = h; } }
    const dx = BUNKER.mg[0] - best.x, dz = BUNKER.mg[2] - best.z, L = Math.hypot(dx, dz);

  }
  for (const [x, z] of [[-11, 98.4], [32, 98.4], [-14, 106.8], [4, 110.5], [23, 123.2]]) AMMOS.push({ x, z });
  for (const m of AMMOS) m.gy = Math.max(terrainAt(m.x, m.z), 0.02);

  const G = SG;
  for (let j = 0; j < G.h; j++) for (let i = 0; i < G.w; i++){

  }
  for (const b of BOXES) shBox(b);
  shMarch();
  POLYS.sort((p, q) => p.cz - q.cz);
}

// ramp: an oriented slab hinged at the bow
function rampPolys(){
  const b = BOAT, th = b.ramp, ca = Math.cos(th), sa = Math.sin(th);
  const A = [0, sa, ca], Cv = [0, ca, -sa];
  const cen = [0, b.deck + sa * b.rampLen / 2 + Cv[1] * 0.06, b.hinge + ca * b.rampLen / 2 + Cv[2] * 0.06];
  const list = [];
  oboxGeo(list, cen, A, [1, 0, 0], Cv, b.rampLen / 2, b.x1, 0.06, 'ramp');

}
function rampTopAt(z){
  const b = BOAT, th = b.ramp;
  if (th > 0.6) return null;
  const run = Math.cos(th) * b.rampLen;
  if (z < b.hinge || z > b.hinge + run) return null;
  return b.deck + (z - b.hinge) * Math.tan(th) + 0.12;
}
function foamPolys(t){

let RB = null;
function rbEnsure(v){
  const w = clamp(Math.round(v.w / (narrow() ? 2.4 : 3.0)), 160, 560), h = Math.max(90, Math.round(w * v.h / v.w));
  if (!RB || RB.w !== w || RB.h !== h){

    const gg = cv.getContext('2d'), img = gg.createImageData(w, h);
    RB = { w, h, cv, g: gg, img, px: new Uint32Array(img.data.buffer), zb: new Float32Array(w * h) };

const CA = new Float64Array(24 * 8), CB = new Float64Array(24 * 8), SV = new Float64Array(24 * 8);
const XF = [0, 0, 0];
let rFx = 1, rFy = 1, rcx = 0, rcy = 0, rFlash = 0;
function drawPoly(p){
  const d = p.d, n = p.n;
  let m = 0, anyFront = false, anyNear = false;
  for (let i = 0; i < n; i++){
    const o = i * 8;
    toCam(d[o], d[o+1], d[o+2], XF);
    CA[o] = XF[0]; CA[o+1] = XF[1]; CA[o+2] = XF[2];
    CA[o+3] = d[o+3]; CA[o+4] = d[o+4]; CA[o+5] = d[o+5]; CA[o+6] = d[o+6]; CA[o+7] = d[o+7];
    if (XF[2] < FAR) anyFront = true;
    if (XF[2] >= NEAR) anyNear = true;
  }
  if (!anyFront || !anyNear) return;
  for (let i = 0; i < n; i++){
    const a = i * 8, b = ((i + 1) % n) * 8, za = CA[a+2], zb = CA[b+2];
    const ina = za >= NEAR, inb = zb >= NEAR;
    if (ina){ for (let k = 0; k < 8; k++) CB[m*8 + k] = CA[a + k]; m++; }
    if (ina !== inb){
      const t = (NEAR - za) / (zb - za);
      for (let k = 0; k < 8; k++) CB[m*8 + k] = CA[a + k] + (CA[b + k] - CA[a + k]) * t;
      m++;
    }
  }
  if (m < 3) return;
  let xmin = 1e9, xmax = -1e9, ymin = 1e9, ymax = -1e9;
  for (let i = 0; i < m; i++){
    const o = i * 8, iz = 1 / CB[o+2];
    const sx = rcx + CB[o] * iz * rFx, sy = rcy - CB[o+1] * iz * rFy;
    SV[o] = sx; SV[o+1] = sy; SV[o+2] = iz;
    SV[o+3] = CB[o+3]*iz; SV[o+4] = CB[o+4]*iz; SV[o+5] = CB[o+5]*iz; SV[o+6] = CB[o+6]*iz; SV[o+7] = CB[o+7]*iz;
    if (sx < xmin) xmin = sx; if (sx > xmax) xmax = sx; if (sy < ymin) ymin = sy; if (sy > ymax) ymax = sy;
  }
  const RW = RB.w, RH = RB.h;
  if (xmax < 0 || xmin > RW || ymax < 0 || ymin > RH) return;
  const v0 = p.p0;
  const dpl = Math.abs(p.nx*(cam.x - v0[0]) + p.ny*(cam.y - v0[1]) + p.nz*(cam.z - v0[2])) + 0.05;
  const mips = p.tex, nm = mips.length - 1;
  const fl = 1 + rFlash;
  const ar = AMB[0]*p.amb*fl, ag = AMB[1]*p.amb*fl, ab = AMB[2]*p.amb*fl;
  const sr = SUNC[0]*p.lam*fl, sg = SUNC[1]*p.lam*fl, sb = SUNC[2]*p.lam*fl;
  const sun = p.sun, Sm = SG.S, SW = SG.w, SWm = SG.w - 1.001, SHm = SG.h - 1.001;
  const px = RB.px, zbuf = RB.zb, lodK = 2.9 / rFx;
  const y0 = Math.max(0, Math.ceil(ymin - 0.5)), y1 = Math.min(RH, Math.ceil(ymax - 0.5));
  for (let y = y0; y < y1; y++){
    const yc = y + 0.5;
    let xl = 1e9, xr = -1e9;
    let lz = 0, lu = 0, lv = 0, lmx = 0, lmz = 0, ly = 0, rz = 0, ru = 0, rv = 0, rmx = 0, rmz = 0, ry = 0;
    for (let i = 0, j = m - 1; i < m; j = i++){
      const oi = i * 8, oj = j * 8, yi = SV[oi+1], yj = SV[oj+1];
      if ((yi <= yc && yc < yj) || (yj <= yc && yc < yi)){
        const t = (yc - yi) / (yj - yi), x = SV[oi] + t * (SV[oj] - SV[oi]);
        if (x < xl){
          xl = x; lz = SV[oi+2] + t*(SV[oj+2] - SV[oi+2]); lu = SV[oi+3] + t*(SV[oj+3] - SV[oi+3]); lv = SV[oi+4] + t*(SV[oj+4] - SV[oi+4]);
          lmx = SV[oi+5] + t*(SV[oj+5] - SV[oi+5]); lmz = SV[oi+6] + t*(SV[oj+6] - SV[oi+6]); ly = SV[oi+7] + t*(SV[oj+7] - SV[oi+7]);
        }
        if (x > xr){
          xr = x; rz = SV[oi+2] + t*(SV[oj+2] - SV[oi+2]); ru = SV[oi+3] + t*(SV[oj+3] - SV[oi+3]); rv = SV[oi+4] + t*(SV[oj+4] - SV[oi+4]);
          rmx = SV[oi+5] + t*(SV[oj+5] - SV[oi+5]); rmz = SV[oi+6] + t*(SV[oj+6] - SV[oi+6]); ry = SV[oi+7] + t*(SV[oj+7] - SV[oi+7]);
        }
      }
    }
    if (xr <= xl) continue;
    const x0 = Math.max(0, Math.ceil(xl - 0.5)), x1 = Math.min(RW, Math.ceil(xr - 0.5));
    if (x1 <= x0) continue;
    const k = 1 / (xr - xl);
    const dz = (rz - lz)*k, du = (ru - lu)*k, dv = (rv - lv)*k, dmx = (rmx - lmx)*k, dmz = (rmz - lmz)*k, dy = (ry - ly)*k;
    const pre = x0 + 0.5 - xl;
    let iz = lz + dz*pre, uz = lu + du*pre, vz = lv + dv*pre, mxz = lmx + dmx*pre, mzz = lmz + dmz*pre, yz = ly + dy*pre;
    const zm = 2 / (lz + rz), cosA = Math.min(1, dpl / zm);
    let lod = Math.log2(zm * lodK) + 0.35 * Math.log2(1 / Math.max(cosA, 0.06)) - 0.45;
    const lv_ = lod <= 0 ? 0 : lod >= nm ? nm : Math.round(lod);
    const T = mips[lv_], tp = T.px, wm = T.wm, hm = T.hm, sh = T.sh, ms = 1 / (1 << lv_);
    const row = y * RW;
    for (let x = x0; x < x1; x++){
      const z = 1 / iz, zi = row + x;
      if (z < zbuf[zi] && z < FAR){
        zbuf[zi] = z;
        const cc = tp[((((vz*z*ms) | 0) & hm) << sh) | (((uz*z*ms) | 0) & wm)];
        let lit = 0;
        if (sun){
          let gx = mxz*z, gz = mzz*z;
          gx = gx < 0 ? 0 : gx > SWm ? SWm : gx; gz = gz < 0 ? 0 : gz > SHm ? SHm : gz;
          const ix = gx | 0, iy = gz | 0, fx = gx - ix, fy = gz - iy, q = iy*SW + ix;
          const s0 = Sm[q] + (Sm[q+1] - Sm[q])*fx, s1 = Sm[q+SW] + (Sm[q+SW+1] - Sm[q+SW])*fx;
          lit = (yz*z - (s0 + (s1 - s0)*fy)) * 3 + 0.5;
          lit = lit < 0 ? 0 : lit > 1 ? 1 : lit;
        }
        const fi = (z*FOGK) | 0, fg = FOG[fi];
        const r = (cc & 255) * (ar + lit*sr) * fg + FOGR[fi], gg = ((cc >>> 8) & 255) * (ag + lit*sg) * fg + FOGG[fi], b = ((cc >>> 16) & 255) * (ab + lit*sb) * fg + FOGB[fi];
        px[zi] = 0xff000000 | ((b > 255 ? 255 : b) << 16) | ((gg > 255 ? 255 : gg) << 8) | (r > 255 ? 255 : r);
      }
      iz += dz; uz += du; vz += dv; mxz += dmx; mzz += dmz; yz += dy;
    }
  }
}

// sky: Freedoom's overcast panorama on a cylinder, blended to haze at the horizon
function drawSky(){
  const S = TX.skyRaw, px = RB.px, zb = RB.zb, RW = RB.w, RH = RB.h;
  const f = cam.f, r = cam.r, u = cam.u, fl = 1 + rFlash;
  for (let y = 0; y < RH; y++){
    const ky = (rcy - (y + 0.5)) / rFy;
    for (let x = 0; x < RW; x++){
      const kx = (x + 0.5 - rcx) / rFx;
      const dx = f[0] + r[0]*kx + u[0]*ky, dy = f[1] + r[1]*kx + u[1]*ky, dz = f[2] + r[2]*kx + u[2]*ky;
      const el = dy / Math.sqrt(dx*dx + dz*dz);
      let cr = FOGC[0], cg = FOGC[1], cb = FOGC[2];
      if (el > 0){
        const az = Math.atan2(dx, dz) / TAU + 0.5;
        const sx = ((az * S.w * 3) | 0) % S.w, sy = clamp((S.h * 0.46 * (1 - Math.atan(el) / (Math.PI / 2))) | 0, 0, S.h - 1);
        const cc = S.px[sy * S.w + sx], t = clamp(el * 7, 0, 1);
        cr = lerp(cr, cc & 255, t); cg = lerp(cg, (cc >>> 8) & 255, t); cb = lerp(cb, (cc >>> 16) & 255, t);
      }
      cr *= fl; cg *= fl; cb *= fl;
      const i = y * RW + x;
      px[i] = 0xff000000 | ((cb > 255 ? 255 : cb) << 16) | ((cg > 255 ? 255 : cg) << 8) | (cr > 255 ? 255 : cr);
      zb[i] = 1e9;
    }
  }
}

// ---- sprites into the z-buffer
let aimPick = null;
function spriteFrame(e){
  const dx = cam.x - e.x, dz = cam.z - e.z, L = Math.hypot(dx, dz) || 1;
  const vx = dx / L, vz = dz / L, fx = Math.sin(e.yaw), fz = Math.cos(e.yaw);
  const front = fx*vx + fz*vz, right = fx*vz - fz*vx;
  const ang = Math.atan2(right, front);
  return (Math.round(ang / (Math.PI / 4)) + 8) % 8;
}
function drawSprite(name, wx, wy, wz, tag, lit, src){
  const S_ = src || SPR, fr = S_.f[name]; if (!fr) return;
  toCam(wx, wy, wz, XF);
  const cz = XF[2]; if (cz < 0.4 || cz > FAR) return;
  const iz = 1 / cz, ax = rcx + XF[0]*iz*rFx, ay = rcy - XF[1]*iz*rFy, s = S_.mpp * iz * rFy;
  const [fx, fy, fw, fh, fax, fay] = fr;
  const left = ax - fax * s, top = ay - fay * s;
  const x0 = Math.max(0, Math.floor(left)), x1 = Math.min(RB.w, Math.ceil(left + fw * s));
  const y0 = Math.max(0, Math.floor(top)), y1 = Math.min(RB.h, Math.ceil(top + fh * s));
  if (x1 <= x0 || y1 <= y0) return;
  const fi = (cz*FOGK) | 0, fg = FOG[fi], fl = 1 + rFlash;
  const kr = (AMB[0] + lit*SUNC[0]*0.62) * fg * fl, kg = (AMB[1] + lit*SUNC[1]*0.62) * fg * fl, kb = (AMB[2] + lit*SUNC[2]*0.62) * fg * fl;
  const fr_ = FOGR[fi], fg_ = FOGG[fi], fb_ = FOGB[fi];
  const px = RB.px, zb = RB.zb, RW = RB.w, sp = S_.px, SW = S_.w, inv = 1 / s;
  const cxp = rcx | 0, cyp = rcy | 0;
  for (let y = y0; y < y1; y++){
    const ty = ((y + 0.5 - top) * inv) | 0; if (ty < 0 || ty >= fh) continue;
    const srow = (fy + ty) * SW + fx, row = y * RW;
    for (let x = x0; x < x1; x++){
      const tx = ((x + 0.5 - left) * inv) | 0; if (tx < 0 || tx >= fw) continue;
      const cc = sp[srow + tx];
      if ((cc >>> 24) < 128) continue;
      const i = row + x;
      if (cz >= zb[i]) continue;
      zb[i] = cz;
      const r = (cc & 255) * kr + fr_, gg = ((cc >>> 8) & 255) * kg + fg_, b = ((cc >>> 16) & 255) * kb + fb_;
      px[i] = 0xff000000 | ((b > 255 ? 255 : b) << 16) | ((gg > 255 ? 255 : gg) << 8) | (r > 255 ? 255 : r);
      if (tag && Math.abs(x - cxp) <= 1 && Math.abs(y - cyp) <= 1) aimPick = { tag, z: cz };
    }
  }
}
// soft dark patch on the ground under a soldier
function blobShadow(x, z, gy, rad){
  toCam(x, gy + 0.03, z, XF);
  if (XF[2] < 0.6 || XF[2] > 140) return;
  const iz = 1 / XF[2], cx = rcx + XF[0]*iz*rFx, cy = rcy - XF[1]*iz*rFy;
  const rx = rad * iz * rFx, ry = Math.max(1, rx * clamp((cam.y - gy) * iz, 0.08, 1));
  const zr = XF[2], tol = 0.6 + zr * 0.03, RW = RB.w, px = RB.px, zb = RB.zb;
  for (let y = Math.max(0, Math.floor(cy - ry)); y <= Math.min(RB.h - 1, Math.ceil(cy + ry)); y++)
    for (let x = Math.max(0, Math.floor(cx - rx)); x <= Math.min(RW - 1, Math.ceil(cx + rx)); x++){
      const ex = (x + 0.5 - cx) / rx, ey = (y + 0.5 - cy) / ry, e = ex*ex + ey*ey;
      if (e >= 1) continue;
      const i = y*RW + x; if (Math.abs(zb[i] - zr) > tol) continue;
      const k = 0.55 + 0.45 * e, cc = px[i];
      px[i] = 0xff000000 | ((((cc >>> 16) & 255) * k) << 16) | ((((cc >>> 8) & 255) * k) << 8) | ((cc & 255) * k);
    }
}
// additive 3D line, depth-tested (tracers)
function zLine(x1, y1, z1, x2, y2, z2, rgb, a){
  const A = toCam(x1, y1, z1, [0, 0, 0]), B = toCam(x2, y2, z2, [0, 0, 0]);
  if (A[2] < NEAR && B[2] < NEAR) return;
  if (A[2] < NEAR){ const t = (NEAR - A[2]) / (B[2] - A[2]); for (let k = 0; k < 3; k++) A[k] += (B[k] - A[k]) * t; }
  if (B[2] < NEAR){ const t = (NEAR - B[2]) / (A[2] - B[2]); for (let k = 0; k < 3; k++) B[k] += (A[k] - B[k]) * t; }
  const ax = rcx + A[0]/A[2]*rFx, ay = rcy - A[1]/A[2]*rFy, bx = rcx + B[0]/B[2]*rFx, by = rcy - B[1]/B[2]*rFy;
  const n = Math.min(400, Math.max(1, Math.ceil(Math.max(Math.abs(bx - ax), Math.abs(by - ay)))));
  const ia = 1 / A[2], ib = 1 / B[2], RW = RB.w, RH = RB.h, px = RB.px, zb = RB.zb;
  for (let i = 0; i <= n; i++){
    const t = i / n, x = (ax + (bx - ax)*t) | 0, y = (ay + (by - ay)*t) | 0;
    if (x < 0 || y < 0 || x >= RW || y >= RH) continue;
    const z = 1 / (ia + (ib - ia)*t), q = y*RW + x;
    if (z > zb[q] + 0.2) continue;
    const k = a * (0.35 + 0.65 * t), cc = px[q];
    const r = (cc & 255) + rgb[0]*k, gg = ((cc >>> 8) & 255) + rgb[1]*k, b = ((cc >>> 16) & 255) + rgb[2]*k;
    px[q] = 0xff000000 | ((b > 255 ? 255 : b) << 16) | ((gg > 255 ? 255 : gg) << 8) | (r > 255 ? 255 : r);
  }
}
// particles: depth-tested squares, blended
function drawParticle(p){
  toCam(p.x, p.y, p.z, XF);
  if (XF[2] < 0.3 || XF[2] > FAR) return;
  const iz = 1 / XF[2], cx = rcx + XF[0]*iz*rFx, cy = rcy - XF[1]*iz*rFy, r = Math.max(0.6, p.size * iz * rFy * 0.5);
  const life = p.t / p.max, a = p.alpha * (p.fadeIn ? Math.min(1, life * 6) : 1) * (1 - life);
  if (a <= 0.01) return;
  const fi = (XF[2]*FOGK) | 0, fg = FOG[fi];
  const cr = p.col[0]*fg + FOGR[fi], cg = p.col[1]*fg + FOGG[fi], cb = p.col[2]*fg + FOGB[fi];
  const RW = RB.w, px = RB.px, zb = RB.zb, z = XF[2];
  for (let y = Math.max(0, (cy - r) | 0); y <= Math.min(RB.h - 1, (cy + r) | 0); y++)
    for (let x = Math.max(0, (cx - r) | 0); x <= Math.min(RW - 1, (cx + r) | 0); x++){
      const i = y*RW + x; if (z > zb[i]) continue;
      const cc = px[i];
      if (p.add){
        const rr = (cc & 255) + cr*a, gg = ((cc >>> 8) & 255) + cg*a, bb = ((cc >>> 16) & 255) + cb*a;
        px[i] = 0xff000000 | ((bb > 255 ? 255 : bb) << 16) | ((gg > 255 ? 255 : gg) << 8) | (rr > 255 ? 255 : rr);
      } else {
        const rr = (cc & 255) * (1 - a) + cr*a, gg = ((cc >>> 8) & 255) * (1 - a) + cg*a, bb = ((cc >>> 16) & 255) * (1 - a) + cb*a;
        px[i] = 0xff000000 | (bb << 16) | (gg << 8) | rr;
      }
    }
}

const VIS = [];
let tanX = 1, tanY = 1;
function renderWorld(v){
  const B = rbEnsure(v);
  const F = Math.min(v.w / 2 / Math.tan(40 * Math.PI / 180), v.h / 2 / Math.tan(33 * Math.PI / 180));
  rFx = F * B.w / v.w; rFy = F * B.h / v.h; rcx = B.w / 2; rcy = B.h / 2;
  tanX = rcx / rFx + 0.05; tanY = rcy / rFy + 0.05;
  drawSky();
  VIS.length = 0;
  const consider = p => {
    if (p.hidden) return;
    toCam(p.cx, p.cy, p.cz, XF);
    const zc = XF[2], r = p.rad;
    if (zc < -r || zc > FAR + r) return;
    if (XF[0] - r > (zc + r) * tanX || -XF[0] - r > (zc + r) * tanX) return;
    if (XF[1] - r > (zc + r) * tanY || -XF[1] - r > (zc + r) * tanY) return;
    const v0 = p.p0;
    if (!p.two && p.nx*(cam.x - v0[0]) + p.ny*(cam.y - v0[1]) + p.nz*(cam.z - v0[2]) <= 0) return;
    p.key = zc - r;
    VIS.push(p);
  };
  for (const p of POLYS) consider(p);
  for (const p of dynPolys) consider(p);
  VIS.sort((a, b) => a.key - b.key);
  for (const p of VIS) drawPoly(p);
  // soldiers: blob shadows, then sprites far to near is unnecessary with the z-buffer
  aimPick = null;
  for (const e of game.enemies){
    const gy = e.gy;
    if (e.state !== 'dead' && !e.crew) blobShadow(e.x, e.z, gy, 0.42);
    const lit = e.crew ? 0.55 : clamp((gy + 1.2 - shadowAt(e.x, e.z)) * 3 + 0.5, 0, 1);
    drawSprite(e.frame, e.x - Math.sin(e.yaw) * e.kick * 0.06, gy + (e.bob || 0), e.z - Math.cos(e.yaw) * e.kick * 0.06, e.state === 'dead' || e.state === 'hit' ? null : e, lit);
  }
  for (const m of MEDS){
    if (m.taken) continue;
    const lit = clamp((m.gy + 0.3 - shadowAt(m.x, m.z)) * 3 + 0.5, 0, 1);
    drawSprite('kit', m.x, m.gy + 0.02 + Math.abs(Math.sin(game.t * 2.2 + m.x)) * 0.06, m.z, null, lit, MEDKIT);
  }
  for (const m of AMMOS){
    if (m.taken) continue;
    const lit = clamp((m.gy + 0.3 - shadowAt(m.x, m.z)) * 3 + 0.5, 0, 1);
    drawSprite('can', m.x, m.gy + 0.02 + Math.abs(Math.sin(game.t * 2.2 + m.z)) * 0.06, m.z, null, lit, AMMOCAN);
  }
  for (const p of game.parts) drawParticle(p);
  for (const b of game.bullets) if (b.tracer) zLine(b.x, b.y, b.z, b.x - b.vx*0.022, b.y - b.vy*0.022, b.z - b.vz*0.022, [255, 214, 140], 1.0);
    else zLine(b.x, b.y, b.z, b.x - b.vx*0.012, b.y - b.vy*0.012, b.z - b.vz*0.012, [200, 180, 140], 0.35);
  for (const gr of game.grenades) drawParticle({ x: gr.x, y: gr.y, z: gr.z, size: 0.16, col: [40, 48, 34], alpha: 1, t: 0, max: 1 });
  B.g.putImageData(B.img, 0, 0);
  const sm = g.imageSmoothingEnabled;
  g.imageSmoothingEnabled = false;
  g.drawImage(B.cv, v.x, v.y, v.w, v.h);
  g.imageSmoothingEnabled = sm;
}

function initAudio(){
  if (AC) return;
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = sndOn ? 0.55 : 0;
    const comp = AC.createDynamicsCompressor(); comp.threshold.value = -16; comp.ratio.value = 5;
    master.connect(comp); comp.connect(AC.destination);
    for (const [k, p] of Object.entries(SDEF)){
      const data = zzfxBuild(AC.sampleRate, ...p), buf = AC.createBuffer(1, data.length, AC.sampleRate);
      buf.getChannelData(0).set(data); SND[k] = buf;
    }
    // surf: brown noise through a low-pass, swelling slowly
    const len = AC.sampleRate * 4, nb = AC.createBuffer(2, len, AC.sampleRate);
    for (let ch = 0; ch < 2; ch++){ const d = nb.getChannelData(ch); let last = 0; for (let i = 0; i < len; i++){ last = (last + 0.02 * (Math.random()*2 - 1)) / 1.02; d[i] = last * 3.2; } }
    const src = AC.createBufferSource(); src.buffer = nb; src.loop = true;
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 700;
    const sg = AC.createGain(); sg.gain.value = 0.35;
    const lfo = AC.createOscillator(), lg = AC.createGain(); lfo.frequency.value = 0.09; lg.gain.value = 0.18;
    lfo.connect(lg); lg.connect(sg.gain);
    src.connect(lp); lp.connect(sg); sg.connect(master); src.start(); lfo.start();
    game.surf = sg;
  } catch (err){ AC = null; }
}
const voices = {};
function sfx(k, o){
  if (!AC || !SND[k] || !sndOn) return;
  o = o || {};
  voices[k] = (voices[k] || []).filter(t => t > AC.currentTime);
  if (voices[k].length >= (o.cap || 6)) return;
  let vol = o.vol == null ? 1 : o.vol, pan = 0;
  if (o.at){
    const dx = o.at[0] - cam.x, dz = o.at[2] - cam.z, d = Math.hypot(dx, dz, o.at[1] - cam.y);
    vol *= 1 / (1 + d / (o.range || 30));
    pan = clamp((dx * cam.r[0] + dz * cam.r[2]) / (d + 1), -0.85, 0.85);
  }
  if (vol < 0.02) return;
  const s = AC.createBufferSource(); s.buffer = SND[k];
  s.playbackRate.value = o.rate || (0.94 + Math.random() * 0.12);
  const gn = AC.createGain(); gn.gain.value = vol;
  let node = gn;
  if (AC.createStereoPanner){ const p = AC.createStereoPanner(); p.pan.value = pan; gn.connect(p); node = p; }
  s.connect(gn); node.connect(master); s.start();
  voices[k].push(AC.currentTime + SND[k].duration);
}
function toggleSnd(){ sndOn = !sndOn; if (master) master.gain.value = sndOn ? 0.55 : 0; flash(sndOn ? 'SOUND ON' : 'SOUND OFF', 1.2, LBL); }

// COLLISION / LINE OF SIGHT
// ===========================================================================
function groundAt(x, z){

}

    if (Math.abs(d[k]) < 1e-9){ if (o[k] < lo[k] || o[k] > hi[k]) return -1; continue; }

}

  for (const h of HEDGES){ const t = segHedge(ax, ay, az, bx, by, bz, h, hedgeR || 0.62); if (t >= 0 && t < best){ best = t; kind = 'hedge'; } }

function playerChest(){ return [pl.x, pl.fy + (pl.crouch ? 0.82 : 1.28), pl.z]; }
function playerHead(){ return [pl.x, pl.fy + pl.eye, pl.z]; }
function moveCircle(x, z, nx, nz, r, fy){

const keys = new Set();

  stickRight = !stickRight;

  flash(stickRight ? 'MOVE ON THE RIGHT' : 'MOVE ON THE LEFT', 1.4, LBL);

const touch = { on: false, move: null, look: null, mx: 0, mz: 0, fire: false, btn: [] };
function updatePlayer(dt){
  // look
  let turn = 0, tilt = 0;

  if (keys.has('ArrowRight')) turn += 1.9 * dt;
  if (keys.has('KeyQ')) turn -= 1.9 * dt;
  if (keys.has('KeyE')) turn += 1.9 * dt;
  if (ms.inView && !touch.on && document.pointerLockElement !== c){
    const edge = Math.max(0, Math.abs(ms.ex) - 0.78) / 0.22;          // outer 11% of each side
    turn += Math.sign(ms.ex) * edge * edge * 2.2 * dt;
  }

  if (keys.has('ArrowDown')) tilt -= 1.2 * dt;

        for (const b of BOXES) if (nx > b.x0 && nx < b.x1 && ny > b.y0 && ny < b.y1 && nz > b.z0 && nz < b.z1){ hitBox = b; break; }
        if (hitBox){

          pen.sort((p, q) => p[0] - q[0]);

          gr.vx *= 0.7; gr.vz *= 0.7;

          continue;
        }
        let hitH = null;
        for (const hh of HEDGES){ if (Math.hypot(nx - hh.x, nz - hh.z) < 0.5 && ny < hh.top){ hitH = hh; break; } }
        if (hitH){ const dx = gr.x - hitH.x, dz = gr.z - hitH.z, L = Math.hypot(dx, dz) || 1; const vn = (gr.vx*dx + gr.vz*dz) / L; gr.vx -= 1.6*vn*dx/L; gr.vz -= 1.6*vn*dz/L; gr.vx *= 0.6; gr.vz *= 0.6; continue; }
        const gy = groundAt(nx, nz) + 0.06;

          if (gy < 0.06 && terrainAt(nx, nz) < 0){ gr.vx *= 0.2; gr.vz *= 0.2; gr.vy = 0; gr.y = Math.max(terrainAt(nx, nz) + 0.06, gr.y - 0.5); }

    }
  }

}
function destroyBunker(){

function updateMG(dt){
  if (!BUNKER.alive || game.mode !== 'play') return;
  if (!gunManned()){ mg.sees = false; mg.state = 'idle'; return; }
  const m = mg, o = BUNKER.mg, ox = o[0], oy = o[1], oz = o[2];
  const ch = playerChest(), hd = playerHead();
  const dx = ch[0] - ox, dz = ch[2] - oz, dist = Math.hypot(dx, dz);
  const yawTo = Math.atan2(dx, dz);                                       // pi faces the sea
  const off = wrapA(yawTo - Math.PI);
  const inArc = Math.abs(off) < 1.05 && dist < 170;
  m.sees = inArc && (!trace(ox, oy, oz, hd[0], hd[1], hd[2]) || !trace(ox, oy, oz, ch[0], ch[1], ch[2]));
  if (m.sees) m.lastSeen = game.t;
  m.t -= dt;
  if (m.state === 'idle' && m.t <= 0){ m.state = 'burst'; m.t = rnd(2.0, 3.0); m.burstN++; }
  else if (m.state === 'burst' && m.t <= 0){ m.state = 'idle'; m.t = rnd(1.8, 2.7); }
  // aim: track the player with lag while he is in sight, otherwise sweep the beach
  let ty, tp;
  if (game.t - m.lastSeen < 1.2 && inArc){
    ty = yawTo; tp = Math.atan2(ch[1] - oy, dist);
    const rate = 0.3 * dt, dy = wrapA(ty - m.yaw);
    m.yaw = wrapA(m.yaw + clamp(dy, -rate, rate));
    m.pitch += clamp(tp - m.pitch, -rate, rate);
  } else {
    m.sweepT += dt * 0.5;
    ty = Math.PI + Math.sin(m.sweepT) * 0.85;
    const reach = 30 + 25 * (0.5 + 0.5 * Math.sin(m.sweepT * 0.37 + 1));
    tp = Math.atan2(terrainAt(ox + Math.sin(ty)*reach, oz + Math.cos(ty)*reach) + 0.9 - oy, reach);
    const rate = 0.9 * dt;
    m.yaw = wrapA(m.yaw + clamp(wrapA(ty - m.yaw), -rate, rate));
    m.pitch += clamp(tp - m.pitch, -rate, rate);
  }
  m.yaw = Math.PI + clamp(wrapA(m.yaw - Math.PI), -1.05, 1.05);
  if (m.state === 'burst'){
    m.fireAcc += dt * 15;
    while (m.fireAcc >= 1){
      m.fireAcc -= 1;
      const yy = m.yaw + rnd(-1, 1) * 0.016, pp = m.pitch + rnd(-1, 1) * 0.011, sp = 380;
      const cp = Math.cos(pp);
      game.bullets.push({ x: ox + Math.sin(yy)*0.6, y: oy, z: oz + Math.cos(yy)*0.6, vx: Math.sin(yy)*cp*sp, vy: Math.sin(pp)*sp, vz: Math.cos(yy)*cp*sp,
                          life: 0.9, tracer: (m.burstN * 7 + game.bullets.length) % 3 === 0, near: false });
      sfx('mg', { at: o, range: 70, cap: 5, vol: 0.9 });
      part({ x: ox + Math.sin(yy)*0.75, y: oy, z: oz + Math.cos(yy)*0.75, vx: 0, vy: 0, vz: 0, grav: 0, size: 0.5, col: [255, 200, 110], max: 0.05, add: true });
    }
  }
}
function updateBullets(dt){
  const ch = playerChest();
  for (const b of game.bullets){
    b.life -= dt;
    const ax = b.x, ay = b.y, az = b.z, bx = ax + b.vx*dt, by = ay + b.vy*dt, bz = az + b.vz*dt;
    // player capsule
    if (game.mode === 'play'){
      const t = clamp(((pl.x - ax)*(bx - ax) + (ch[1] - ay)*(by - ay) + (pl.z - az)*(bz - az)) / ((bx - ax)**2 + (by - ay)**2 + (bz - az)**2 || 1), 0, 1);
      const qx = ax + (bx - ax)*t, qy = ay + (by - ay)*t, qz = az + (bz - az)*t;
      const top = pl.fy + pl.eye + 0.1, yc = clamp(qy, pl.fy + 0.1, top);
      const dd = Math.hypot(qx - pl.x, qy - yc, qz - pl.z);

      } else if (dd < 2.2 && !b.near){ b.near = true; sfx('zip', { vol: 0.5, cap: 3 }); }
    }
    const hit = trace(ax, ay, az, bx, by, bz, 0.4);
    if (hit){

    }

    b.x = bx; b.y = by; b.z = bz;

}

// ===========================================================================
// RIFLEMEN
// ===========================================================================
// Riflemen hold a stretch of line around their post. Unalerted they patrol it at a walk;
// alerted they aim and fire from where they stand, and every few shots (or after a
// reload) they dash a few metres along the line before settling again. Moving soldiers
// face where they go, so the side and back columns of the sheet get used.
// The sheet has one drawing per state and direction, so gaits alternate two drawings:
// walk = walk/stand, run = run/walk, with a small bob on the footfall.
function freeSpot(e, x){
  const z = e.hz;
  if (Math.abs(x - e.hx) > 9 || x < -60 || x > 60) return false;
  for (const b of BOXES) if (x > b.x0 - 0.6 && x < b.x1 + 0.6 && z > b.z0 - 0.6 && z < b.z1 + 0.6) return false;
  for (const o of game.enemies) if (o !== e && o.state !== 'dead' && Math.abs(o.z - z) < 1.5 && Math.abs((o.gait ? o.tx : o.x) - x) < 1.4) return false;
  return Math.abs(terrainAt(x, z) - terrainAt(e.hx, e.hz)) < 0.7;
}
function pickMove(e, lo, hi){
  for (let k = 0; k < 6; k++){
    const x = e.x + (Math.random() < 0.5 ? -1 : 1) * rnd(lo, hi);
    if (freeSpot(e, x)) return x;
  }
  return null;
}
function stepEnemy(e, dt){
  const dx = e.tx - e.x, sp = e.gait === 'run' ? 3.6 : 1.3;
  e.yaw = wrapA(e.yaw + clamp(wrapA(Math.atan2(dx, 0.0001) - e.yaw), -6 * dt, 6 * dt));
  if (Math.abs(dx) <= sp * dt){ e.x = e.tx; e.gait = null; return true; }
  e.x += Math.sign(dx) * sp * dt;
  e.gy = terrainAt(e.x, e.z);
  e.phase += dt * (e.gait === 'run' ? 6 : 3.4);
  return false;
}
function gaitFrame(e, fr){
  const step = (e.phase | 0) & 1;
  e.bob = e.gait ? (step ? 0.05 : 0) * (e.gait === 'run' ? 1.4 : 0.8) : 0;
  return e.gait === 'run' ? (step ? 'run_' : 'walk_') + fr : (step ? 'walk_' : 'stand_') + fr;
}
// the fall and down drawings are single side views: mirror them so the body lies along the
// way the soldier was facing as seen from the camera; fall back to the sheet's die row
function bodyFrame(e, kind){
  if (!SPR.f[kind]) return 'die_' + spriteFrame(e);
  const sx = Math.sin(e.yaw) * cam.r[0] + Math.cos(e.yaw) * cam.r[2];
  return kind + (sx < 0 ? '_m' : '');
}
function crewAlive(){ return game.enemies.filter(e => e.crew && e.state !== 'dead' && e.state !== 'hit'); }
function gunManned(){ return BUNKER.alive && !BUNKER.doorOpen && game.enemies.some(e => e.crew && e.role === 'gun' && e.post === 'slit' && e.state !== 'dead' && e.state !== 'hit'); }

  const B = BUNKER;

  for (const p of B.recess) p.hidden = false;
  sfx('clang', { at: [19, 5, 120], vol: 1 });
  flash('REAR DOOR OPEN \u2014 THE CREW IS COMING', 2.4, PHOS);

}
function takeCasemate(){

// returns how exposed the player is to this crewman (0..1)
function updateCrew(e, dt){
  const B = BUNKER;
  if (!B.alive){ e.frame = 'stand_' + spriteFrame(e); return 0; }
  if (e.post === 'slit'){
    // the loader steps onto the gun when the gunner falls
    if (e.role === 'load' && !game.enemies.some(o => o.crew && o.role === 'gun' && o.state !== 'dead' && o.state !== 'hit')){
      B.takeT += dt;
      if (B.takeT > 3){ e.role = 'gun'; e.x = SLIT_POS.gun[0]; e.z = SLIT_POS.gun[1]; flash('LOADER TAKES THE GUN', 1.6, WARN); }
    }
    e.yaw = Math.PI;
    e.frame = (e.role === 'gun' ? (mg.state === 'burst' && ((game.t * 15) | 0) % 2 ? 'fire_' : 'aim_') : 'reload_') + spriteFrame(e);
    return 0;
  }
  if (e.post === 'moving'){
    e.frame = 'stand_' + spriteFrame(e);
    if (e.st > (e.role === 'gun' ? 1.1 : 0.7)){
      const [x, z] = DOOR_POS[e.role];
      e.x = x; e.z = z; e.post = 'door'; e.yaw = 0; e.fireT = rnd(0.5, 1.2); e.state = 'aim'; e.st = 0;
    }
    return 0;
  }
  // holding the doorway: aim and fire out of it
  const hd = playerHead(), dist = Math.hypot(pl.x - e.x, pl.z - e.z);
  const sees = pl.z > B.z1 - 0.2 && !trace(e.x, e.gy + 1.5, B.z1 + 0.35, hd[0], hd[1], hd[2]);
  e.yaw = Math.atan2(pl.x - e.x, pl.z - e.z);
  if (e.state === 'fire' && e.st > 0.16){ e.state = 'aim'; e.st = 0; }
  e.fireT -= dt;
  if (sees && e.fireT <= 0){
    e.state = 'fire'; e.st = 0; e.fireT = rnd(1.4, 2.4); e.kick = 1;
    sfx('rifle', { at: [e.x, e.gy + 1.5, e.z], range: 40, cap: 4, vol: 0.9, rate: 0.9 });
    if (Math.random() < clamp(0.38 - dist / 150 - (pl.crouch ? 0.06 : 0) - (pl.moving > 2 ? 0.12 : 0), 0.08, 0.38)) hurt(11);
    else sfx('zip', { vol: 0.45, cap: 3 });
  }
  e.frame = (e.state === 'fire' ? 'fire_' : 'aim_') + spriteFrame(e);
  return sees ? clamp(1.2 - dist / 60, 0.4, 1) : 0;
}
function updateEnemies(dt){
  const hd = playerHead(), ch = playerChest();
  let expo = mg.sees ? 1 : 0;
  for (const e of game.enemies){
    e.st += dt;
    e.kick = Math.max(0, e.kick - dt * 8);
    if (e.state === 'dead'){ e.bob = 0; e.frame = bodyFrame(e, 'down'); continue; }
    if (e.state === 'hit'){
      e.bob = 0;
      e.frame = e.st < 0.16 ? 'hit_' + spriteFrame(e) : bodyFrame(e, 'fall');
      if (e.st > 0.5) e.state = 'dead';
      continue;
    }
    if (game.mode !== 'play'){ e.bob = 0; e.frame = (e.crew ? (e.role === 'gun' ? 'aim_' : 'reload_') : 'stand_') + spriteFrame(e); continue; }
    if (e.crew){ expo = Math.max(expo, updateCrew(e, dt)); continue; }
    const eye = [e.x, e.gy + 1.55, e.z];
    const dist = Math.hypot(pl.x - e.x, pl.z - e.z);
    const sees = dist < 120 && (!trace(eye[0], eye[1], eye[2], hd[0], hd[1], hd[2]) || !trace(eye[0], eye[1], eye[2], ch[0], ch[1], ch[2]));
    if (sees && !e.alert){ e.alert = true; e.gait = null; e.state = 'aim'; e.st = 0; e.fireT = rnd(0.8, 1.8); }
    if (sees) expo = Math.max(expo, clamp(1.2 - dist / 120, 0.35, 1));

    if (!e.alert){
      // patrol: walk a few metres, look out to sea, walk back
      if (e.gait){ if (stepEnemy(e, dt)){ e.pauseT = rnd(1.5, 4); } }
      else {
        e.yaw = wrapA(e.yaw + clamp(wrapA(Math.PI - e.yaw), -2 * dt, 2 * dt));
        e.pauseT -= dt;
        if (e.pauseT <= 0){ const x = pickMove(e, 2, 5); if (x != null){ e.tx = x; e.gait = 'walk'; } else e.pauseT = 1; }
      }
      e.frame = gaitFrame(e, spriteFrame(e));
      continue;
    }

    if (e.state === 'move'){
      if (stepEnemy(e, dt)){ e.state = 'aim'; e.st = 0; e.fireT = rnd(0.6, 1.3); }
      e.frame = gaitFrame(e, spriteFrame(e));
      continue;
    }
    // facing the player while engaged
    const want = Math.atan2(pl.x - e.x, pl.z - e.z);
    e.yaw = wrapA(e.yaw + clamp(wrapA(want - e.yaw), -2.4 * dt, 2.4 * dt));
    const relocate = lo => { const x = pickMove(e, lo, lo + 4); if (x != null){ e.tx = x; e.gait = 'run'; e.state = 'move'; e.st = 0; return true; } return false; };
    if (e.state === 'reload'){
      if (e.st > 2.4){ e.shots = 0; if (!(Math.random() < 0.6 && relocate(3))){ e.state = 'aim'; e.st = 0; } }
    }
    else if (e.state === 'fire'){ if (e.st > 0.16){ e.state = 'aim'; e.st = 0; } }
    else {
      if (e.state !== 'aim'){ e.state = 'aim'; e.st = 0; }
      e.fireT -= dt;
      if (sees && e.fireT <= 0){
        e.state = 'fire'; e.st = 0; e.shots++; e.fireT = rnd(1.9, 3.4); e.kick = 1;
        sfx('rifle', { at: [e.x, e.gy + 1.5, e.z], range: 40, cap: 4, vol: 0.8, rate: 0.85 });
        let p = 0.42 - dist / 200;
        if (pl.moving > 2) p -= 0.17;
        if (pl.crouch) p -= 0.08;
        if (Math.random() < clamp(p, 0.05, 0.5)) hurt(11);
        else { sfx('zip', { vol: 0.45, cap: 3 }); puff(pl.x + rnd(-1.6, 1.6), groundAt(pl.x, pl.z) + 0.05, pl.z + rnd(-1.6, 1.6), pl.fy < 0 ? 'water' : 'sand'); }
        if (e.shots >= 5){ e.state = 'reload'; e.st = -0.16; }
        else if (e.shots % 2 === 0 && Math.random() < 0.45) e.fireT = 0.35, e.relocNext = true;
      } else if (e.relocNext && e.fireT <= 0.2){ e.relocNext = false; relocate(3); }
      else if (!sees && e.st > 4 && Math.random() < dt * 0.4) relocate(2);
    }
    const fr = spriteFrame(e);
    e.bob = 0;
    e.frame = (e.state === 'fire' ? 'fire_' : e.state === 'reload' ? 'reload_' : 'aim_') + fr;
  }
  pl.expo = lerp(pl.expo, expo, clamp(dt * 5, 0, 1));
  if (game.mode === 'play' && BUNKER.alive){
    if (!crewAlive().length && game.enemies.some(e => e.crew)) takeCasemate();
    if (!BUNKER.doorOpen && Math.hypot(pl.x - 19, pl.z - 121) < 2.3) openDoor();
    if (!game.hintCase && pl.z > 101.5){
      game.hintCase = true;
      flash('CASEMATE: GRENADE THE SLIT, SHOOT THE CREW IN IT,', 4, LBL);
      flash('OR GO ROUND AND TAKE THE REAR DOOR', 4, LBL);
    }
  }
}

function update(dt){
  game.t += dt; game.modeT += dt;
  rFlash = Math.max(0, rFlash - dt * 2.5);
  if (game.mode === 'loading' || game.mode === 'title'){ pl.yaw = Math.sin(game.t * 0.12) * 0.35; return; }
  if (game.paused) return;
  if (game.mode === 'boat'){
    const left = 4.5 - game.modeT;
    if (left > 0 && Math.ceil(left) !== game.lastCount && left < 3.5){ game.lastCount = Math.ceil(left); flash(String(game.lastCount), 0.8, PHOS); sfx('click', { vol: 0.5 }); }
    if (left <= 0){ setMode('play'); sfx('clang', { vol: 1.2 }); flash('RAMP DOWN — GO GO GO', 2.2, PHOS); flash('GET TO THE SEAWALL. SILENCE THE CASEMATE.', 4, LBL); game.rampT = 0; }
    updatePlayer(dt);
  } else if (game.mode === 'play' || game.mode === 'down' || game.mode === 'won'){
    if (game.mode === 'play'){ game.clock += dt; updatePlayer(dt); }
    updateMG(dt); updateBullets(dt); updateEnemies(dt); updateGrenades(dt);
    if (game.wonAt && game.t > game.wonAt && game.mode === 'play'){ game.wonAt = 0; setMode('won'); }
  }
  // ramp
  const target = game.mode === 'boat' || game.mode === 'loading' || game.mode === 'title' ? Math.PI / 2 : -0.16;
  if (BOAT.ramp !== target){
    BOAT.rampV = (BOAT.rampV || 0) + (BOAT.ramp > target ? -1 : 1) * dt * 5;
    BOAT.ramp += BOAT.rampV * dt;
    if (BOAT.ramp < target){ BOAT.ramp = target; if (Math.abs(BOAT.rampV) > 0.6){ sfx('splash', { vol: 1 }); for (let i = 0; i < 20; i++) puff(rnd(-1.6, 1.6), 0.05, BOAT.hinge + 1.9, 'water'); } BOAT.rampV = 0; }
  }
  // burning casemate
  if (!BUNKER.alive){
    game.smokeT -= dt;
    if (game.smokeT <= 0){ game.smokeT = 0.12;
      part({ x: 20 + rnd(-2, 2), y: 6, z: 111.8, vx: rnd(-0.2, 0.2), vy: rnd(1, 2), vz: rnd(-0.5, 0), grav: 0, drag: 0.2, size: rnd(1.2, 2.2), col: [58, 58, 56], max: rnd(3, 5), alpha: 0.5, fadeIn: true }); }
  }
  for (const p of game.parts){
    p.t += dt; p.vy += p.grav * dt;
    const k = Math.max(0, 1 - p.drag * dt); p.vx *= k; p.vz *= k; if (p.grav === 0) p.vy *= k;
    p.x += p.vx*dt; p.y += p.vy*dt; p.z += p.vz*dt;
    if (p.grav !== 0 && p.y < -0.5) p.t = p.max;
    if (p.fadeIn) p.size += dt * 0.6;
  }
  game.parts = game.parts.filter(p => p.t < p.max);
  // water frames
  const wf = 'water' + (((game.t * 5) | 0) & 3);
  if (TEXREADY) for (const p of WATERP) p.tex = TX[wf];
}

function post(v){
  g.save(); g.beginPath(); g.rect(v.x, v.y, v.w, v.h); g.clip();
  if (opt.post){
    const rad = g.createRadialGradient(v.x + v.w/2, v.y + v.h/2, Math.min(v.w, v.h)*0.3, v.x + v.w/2, v.y + v.h/2, Math.max(v.w, v.h)*0.75);
    rad.addColorStop(0, 'rgba(0,0,0,0)'); rad.addColorStop(1, 'rgba(0,0,0,0.45)');
    g.fillStyle = rad; g.fillRect(v.x, v.y, v.w, v.h);
  }
  if (pl.hurtT > 0){ g.fillStyle = `rgba(230,200,150,${(pl.hurtT/0.45*0.35).toFixed(3)})`; g.fillRect(v.x, v.y, v.w, v.h); }
  if (pl.hp < 30 && game.mode === 'play'){ g.fillStyle = `rgba(60,40,20,${(0.25 + 0.1*Math.sin(game.t*5)).toFixed(3)})`; g.fillRect(v.x, v.y, v.w, v.h); }
  g.restore();
}

// ---- touch controls
function touchLayout(v){
  const L = touchLayoutBase(v);
  const mir = v.pad && v.pad.h > 90 ? x => W - x : x => 2*v.x + v.w - x;
  if (stickRight) for (const b of L) b.x = mir(b.x);
  const sr = v.pad && v.pad.h > 90 ? Math.max(14, Math.min(20, v.pad.h * 0.09)) : Math.max(14, Math.min(v.w, v.h) * 0.045);
  L.push(v.pad && v.pad.h > 90 ? { id: 'swap', label: 'SWAP', x: stickRight ? W * 0.05 + sr : W * 0.95 - sr, y: v.pad.y + v.pad.h - sr - 4, r: sr }
                               : { id: 'swap', label: 'SWAP', x: v.x + v.w / 2, y: v.y + v.h - sr - 8, r: sr });
  return L;
}
function touchLayoutBase(v){
  if (v.pad && v.pad.h > 90){
    const P = v.pad, r = Math.min(P.h * 0.3, W * 0.12), cy = P.y + P.h / 2;
    return [
      { id: 'fire', label: 'FIRE', x: W - W*0.06 - r, y: cy, r },
      { id: 'nade', label: 'NADE', x: W - W*0.06 - r*2.75, y: cy + r*0.45, r: r*0.6 },
      { id: 'duck', label: 'DUCK', x: W - W*0.06 - r*2.75, y: cy - r*0.95, r: r*0.6 },
    ];
  }
  const r = Math.max(26, Math.min(v.w, v.h) * 0.1), m = r * 0.45;
  return [
    { id: 'fire', label: 'FIRE', x: v.x + v.w - m - r, y: v.y + v.h - m - r, r },
    { id: 'nade', label: 'NADE', x: v.x + v.w - m - r*2.9, y: v.y + v.h - m - r*0.62, r: r*0.62 },
    { id: 'duck', label: 'DUCK', x: v.x + v.w - m - r*0.62, y: v.y + v.h - m - r*2.9, r: r*0.62 },
  ];
}
function drawTouch(v){
  if (!touch.on) return;
  const live = game.mode === 'play' || game.mode === 'boat';
  for (const b of touchLayout(v)){
    if (!live && b.id !== 'swap') continue;
    const on = (b.id === 'fire' && touch.fire) || (b.id === 'duck' && pl.crouch);
    g.fillStyle = on ? 'rgba(232,170,60,0.35)' : 'rgba(10,12,10,0.28)'; g.beginPath(); g.arc(b.x, b.y, b.r, 0, 7); g.fill();
    g.strokeStyle = 'rgba(232,200,140,0.7)'; g.lineWidth = 1.5; g.stroke();
    textGlow(b.label, b.x, b.y, Math.max(9, b.r*0.36), NUM, 0.9);
  }
  if (touch.move){
    const mv = touch.move;
    g.strokeStyle = 'rgba(232,200,140,0.5)'; g.lineWidth = 1.5; g.beginPath(); g.arc(mv.ox, mv.oy, 44, 0, 7); g.stroke();
    g.fillStyle = 'rgba(232,170,60,0.4)'; g.beginPath(); g.arc(mv.ox + touch.mx*40, mv.oy - touch.mz*40, 16, 0, 7); g.fill();
  }
}

function stageLineY(v){
  const big = Math.max(20, Math.min(v.h*0.1, v.w*0.11)), mid = Math.max(10, Math.min(v.h*0.034, v.w*0.034));
  return v.y + v.h*0.4 + big*2.35 + mid*4.8;
}
function drawMessages(v){
  const size = Math.max(11, Math.min(v.h*0.036, v.w*0.04));
  game.msgs = game.msgs.filter(m => m.until > game.t);
  game.msgs.forEach((m, i) => {
    const left = m.until - game.t, a = Math.min(1, left / 0.4) * Math.min(1, (m.dur - left + 0.05) / 0.12);
    textGlow(m.text, v.x + v.w/2, v.y + v.h*0.12 + i*size*1.5, size, m.rgb, 0.95*a);
  });
  const big = Math.max(20, Math.min(v.h*0.1, v.w*0.11)), mid = Math.max(10, Math.min(v.h*0.034, v.w*0.034)), cx = v.x + v.w/2, cy = v.y + v.h*0.4;
  const blink = 0.55 + 0.45*Math.sin(game.t*4);
  const shade = a => { g.fillStyle = `rgba(5,8,10,${a})`; g.fillRect(v.x, v.y, v.w, v.h); };
  if (game.mode === 'title' || game.mode === 'loading'){
    shade(0.45);
    textGlow('NORMANDY', cx, cy, big, PHOS, 0.96);
    textGlow('OMAHA  ·  DOG GREEN  ·  6 JUNE 1944', cx, cy + big*0.85, mid, LBL, 0.9);
    textGlow(game.mode === 'loading' ? 'LOADING…' : touch.on ? 'TAP TO HIT THE BEACH' : 'CLICK OR PRESS ENTER', cx, cy + big*1.65, mid, PHOS, game.mode === 'loading' ? 0.7 : blink);
    const help = touch.on ? [stickRight ? 'RIGHT THUMB MOVES   LEFT THUMB LOOKS' : 'LEFT THUMB MOVES   RIGHT THUMB LOOKS', 'SWAP FLIPS THE SIDES'] :
      ['WASD MOVE   MOUSE OR Q/E LOOK   CLICK/SPACE FIRE', 'ALT/C CROUCH   G GRENADE   R RELOAD   M SOUND   P PAUSE'];
    help.forEach((h, i) => textGlow(h, cx, cy + big*2.35 + i*mid*1.4, mid*0.8, LBL, 0.8));
    textGlow('CROUCH BEHIND THE STEEL. FIRST AID AND AMMO WAIT IN COVER.', cx, cy + big*2.35 + mid*3.2, mid*0.8, PHOS, 0.65);
    if (game.mode === 'title')
      textGlow('STAGE ' + stageNo + '  \u00b7  ' + STAGES[stageNo].label + (touch.on ? '   (TAP HERE TO CHANGE)' : '   (KEYS 0\u20135)'), cx, stageLineY(v), mid*0.85, NUM, 0.9);
  } else if (game.mode === 'down'){
    shade(0.35 * clamp(game.modeT, 0, 1));
    textGlow('DOWN ON THE SAND', cx, cy, big*0.7, WARN, 0.95);
    textGlow((touch.on ? 'TAP' : 'PRESS ENTER') + (game.checkpoint ? ' TO GO AGAIN FROM THE SEAWALL' : ' TO GO AGAIN'), cx, cy + big*0.9, mid, PHOS, blink);
  } else if (game.mode === 'won'){
    shade(0.4);
    const t = game.clock || 0;
    textGlow('SECTOR CLEAR', cx, cy, big*0.8, PHOS, 0.96);
    textGlow(`TIME ${(t/60)|0}:${String((t%60)|0).padStart(2, '0')}   RIFLEMEN ${pl.kills}   SCORE ${game.score}`, cx, cy + big*0.9, mid, LBL, 0.9);
    textGlow(touch.on ? 'TAP TO LAND AGAIN' : 'PRESS ENTER TO LAND AGAIN', cx, cy + big*1.6, mid, PHOS, blink);
  }
  if (game.paused){ shade(0.4); textGlow('PAUSED', cx, cy, big*0.7, PHOS, 0.95); }
}

// ===========================================================================
// LOOP
// ===========================================================================
function setCamera(){
  const sh = pl.shake, bobY = Math.abs(Math.sin(pl.bob)) * 0.05 * clamp(pl.moving / 4, 0, 1);
  const inBoat = game.mode === 'boat' || game.mode === 'title' || game.mode === 'loading';
  cam.x = pl.x + rnd(-1, 1) * sh * 0.06; cam.z = pl.z + rnd(-1, 1) * sh * 0.06;
  cam.y = Math.max(pl.fy + pl.eye + bobY + (inBoat ? Math.sin(game.t * 1.7) * 0.08 : 0), 0.25);
  cam.yaw = pl.yaw + rnd(-1, 1) * sh * 0.01;
  cam.pitch = pl.pitch + rnd(-1, 1) * sh * 0.01 + (game.mode === 'down' ? -0.25 * clamp(game.modeT, 0, 1) : 0);
  if (game.mode === 'down') cam.y = lerp(cam.y, pl.fy + 0.35, clamp(game.modeT, 0, 1));
  updateBasis();
}
let last = 0;
function frame(now){
  const dt = Math.min(0.05, (now - last) / 1000 || 0.016); last = now;
  if (!window.__qa || !window.__qa.frozen) update(dt);
  render();
  requestAnimationFrame(frame);
}
function render(){
  const v = viewportRect();
  g.fillStyle = '#0a0c0b'; g.fillRect(0, 0, W, H);
  if (TEXREADY){
    dynPolys = rampPolys().concat(foamPolys(game.t));
    setCamera();
    renderWorld(v);
    if (game.mode === 'play' || game.mode === 'boat'){ drawGun(v); drawCross(v); }
    post(v);
  }
  drawMessages(v);
  drawFrame(v);
  if (TEXREADY) drawTouch(v);
}

// ===========================================================================
// INPUT
// ===========================================================================
// back at the seawall: the beach stays as you left it, you come back whole
function respawn(){
  const cp = game.checkpoint;
  Object.assign(pl, { x: cp.x, z: cp.z, fy: groundAt(cp.x, cp.z), yaw: Math.PI * 0.0, pitch: 0.05, hp: 100, crouch: true, eye: EYE_C,
                      clip: 8, clips: Math.max(pl.clips, 4), nades: Math.max(pl.nades, 2), reloadT: 0, hurtT: 0, shake: 0, expo: 0, safeT: 0 });
  game.bullets = []; game.grenades = [];
  mg.state = 'idle'; mg.t = 2.5;
  setMode('play');
  flash('BACK AT THE SEAWALL', 2, PHOS);
}
function startOrRestart(){
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  if (game.mode === 'down' && game.checkpoint) respawn();
  else if (game.mode === 'title' || game.mode === 'down' || game.mode === 'won') newGame();
}
addEventListener('keydown', e => {
  if (e.code === 'Tab') return;
  keys.add(e.code);
  if (['Space', 'ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'AltLeft', 'AltRight'].includes(e.code)) e.preventDefault();
  if (e.code === 'Enter') startOrRestart();
  if (/^Digit[0-5]$/.test(e.code) && (game.mode === 'title' || game.mode === 'won' || game.mode === 'down')) setStage(+e.code.slice(5));
  if ((e.code === 'KeyC' || e.code === 'AltLeft' || e.code === 'AltRight') && !e.repeat) pl.crouch = !pl.crouch;
  if (e.code === 'KeyG') throwGrenade();
  if (e.code === 'KeyR' && !bayonet()) startReload();
  if (e.code === 'KeyM') toggleSnd();
  if (e.code === 'KeyP' || e.code === 'Escape') { if (game.mode === 'play' || game.mode === 'boat') game.paused = !game.paused; }
  if (e.code === 'KeyV') opt.post = !opt.post;
});
addEventListener('keyup', e => { keys.delete(e.code); if (e.code === 'AltLeft' || e.code === 'AltRight') e.preventDefault(); });
addEventListener('blur', () => { keys.clear(); mouseDown = false; touch.fire = false; });
c.addEventListener('mousedown', e => {
  c.focus();
  if (game.mode === 'title' || game.mode === 'down' || game.mode === 'won'){ startOrRestart(); return; }
  initAudio();
  // pointer lock when the browser allows it; when it refuses (some embedded frames do),
  // the free-cursor steering below takes over and the click still fires
  if (document.pointerLockElement !== c && lockTries < 3){
    lockTries++;
    try { const r = c.requestPointerLock(); if (r && r.catch) r.catch(() => {}); } catch (err) {}
  }
  if (e.button === 0) mouseDown = true;
  if (e.button === 2) throwGrenade();
});
addEventListener('mouseup', () => { mouseDown = false; });
c.addEventListener('contextmenu', e => e.preventDefault());
let lockTries = 0;
document.addEventListener('pointerlockchange', () => { if (document.pointerLockElement === c) lockTries = 0; });
// free cursor: moving the mouse over the view turns you as if locked, and resting it near
// the left or right edge keeps turning, so a cursor pinned at the screen edge still steers
const ms = { inView: false, ex: 0, ey: 0 };
addEventListener('mousemove', e => {
  const locked = document.pointerLockElement === c;
  if (!locked){
    const rect = c.getBoundingClientRect(), v = viewportRect();
    const x = e.clientX - rect.left, y = e.clientY - rect.top;
    // the edge zone reaches out over the frame, so a cursor that slides off the view still turns you
    ms.inView = x >= 0 && x <= W && y >= v.y && y <= v.y + v.h;
    ms.ex = ms.inView ? clamp(((x - v.x) / v.w - 0.5) * 2, -1, 1) : 0;
    ms.ey = ms.inView ? clamp(((y - v.y) / v.h - 0.5) * 2, -1, 1) : 0;
    if (!ms.inView || touch.on || x < v.x || x > v.x + v.w) return;
  }
  if (game.mode !== 'play' && game.mode !== 'boat') return;
  const k = locked ? 0.0024 : 0.0034;
  const mx = clamp(e.movementX || 0, -80, 80), my = clamp(e.movementY || 0, -80, 80);   // some browsers report a jump on entry
  pl.yaw = wrapA(pl.yaw + mx * k);
  pl.pitch = clamp(pl.pitch - my * k, -1.1, 1.1);
});
c.addEventListener('mouseleave', () => { ms.inView = false; ms.ex = ms.ey = 0; });
function onTouchStart(e){
  e.preventDefault();
  const wasOn = touch.on; touch.on = true;
  {
    const v = viewportRect(), rect = c.getBoundingClientRect(), t = e.changedTouches[0];
    const sw = touchLayout(v).find(b => b.id === 'swap');
    if (wasOn && t && Math.hypot(t.clientX - rect.left - sw.x, t.clientY - rect.top - sw.y) < sw.r * 1.4){ swapHands(); return; }
  }
  if (game.mode === 'title' && wasOn){
    const v = viewportRect(), rect = c.getBoundingClientRect(), t = e.changedTouches[0];
    if (t && Math.abs(t.clientY - rect.top - stageLineY(v)) < 22){ setStage(stageNo + 1); return; }
  }
  if (game.mode === 'title' || game.mode === 'down' || game.mode === 'won'){ startOrRestart(); return; }
  initAudio(); if (AC && AC.state === 'suspended') AC.resume();
  const v = viewportRect(), rect = c.getBoundingClientRect();
  for (const t of e.changedTouches){
    const x = t.clientX - rect.left, y = t.clientY - rect.top;
    const btn = touchLayout(v).find(b => Math.hypot(x - b.x, y - b.y) < b.r * 1.15);
    if (btn){
      if (btn.id === 'fire'){ touch.fire = true; touch.fireId = t.identifier; }
      if (btn.id === 'nade') throwGrenade();
      if (btn.id === 'duck') pl.crouch = !pl.crouch;
      continue;
    }
    const moveSide = stickRight ? (v.pad ? x > W * 0.5 : x > v.x + v.w * 0.55) : (v.pad ? x < W * 0.5 : x < v.x + v.w * 0.45);
    if (moveSide && (!v.pad || y > v.y + v.h) && !touch.move) touch.move = { id: t.identifier, ox: x, oy: y };
    else if (!touch.look) touch.look = { id: t.identifier, lx: x, ly: y };
  }
}
function onTouchMove(e){
  e.preventDefault();
  const rect = c.getBoundingClientRect();
  for (const t of e.changedTouches){
    const x = t.clientX - rect.left, y = t.clientY - rect.top;
    if (touch.move && t.identifier === touch.move.id){
      const dx = (x - touch.move.ox) / 44, dy = (y - touch.move.oy) / 44, m = Math.hypot(dx, dy), k = m > 1 ? 1 / m : 1;
      touch.mx = dx * k; touch.mz = -dy * k;
    } else if (touch.look && t.identifier === touch.look.id){
      pl.yaw = wrapA(pl.yaw + (x - touch.look.lx) * 0.006);
      pl.pitch = clamp(pl.pitch - (y - touch.look.ly) * 0.005, -1.1, 1.1);
      touch.look.lx = x; touch.look.ly = y;
    }
  }
}
function onTouchEnd(e){
  e.preventDefault();
  for (const t of e.changedTouches){
    if (touch.move && t.identifier === touch.move.id){ touch.move = null; touch.mx = touch.mz = 0; }
    if (touch.look && t.identifier === touch.look.id) touch.look = null;
    if (t.identifier === touch.fireId) touch.fire = false;
  }
}
c.addEventListener('touchstart', onTouchStart, { passive: false });
c.addEventListener('touchmove', onTouchMove, { passive: false });
c.addEventListener('touchend', onTouchEnd, { passive: false });
c.addEventListener('touchcancel', onTouchEnd, { passive: false });

// ---- headless hooks for screenshots and tests
window.__qa = {
  frozen: false,
  start(){ newGame(); },
  play(){ const s = stageNo; stageNo = 0; newGame(); stageNo = s; setMode('play'); BOAT.ramp = -0.16; },
  stage(n){ stageNo = n; newGame(); },
  place(x, z, yaw, pitch, crouch){ pl.x = x; pl.z = z; pl.fy = groundAt(x, z); if (yaw != null) pl.yaw = yaw; if (pitch != null) pl.pitch = pitch; if (crouch != null) pl.crouch = crouch; pl.eye = pl.crouch ? EYE_C : EYE; },
  advance(sec){ const n = Math.round(sec / 0.02); for (let i = 0; i < n; i++){ setCamera(); update(0.02); } },
  freeze(f){ this.frozen = f; },
  grenade(){ throwGrenade(); },
  fire(){ pl.fireT = 0; fireRifle(); },
  state(){ return { mode: game.mode, hp: pl.hp, expo: +pl.expo.toFixed(2), x: +pl.x.toFixed(2), z: +pl.z.toFixed(2), fy: +pl.fy.toFixed(2),
    bunker: BUNKER.alive, mgSees: mg.sees, alive: game.enemies.filter(e => e.state !== 'dead').length, bullets: game.bullets.length, polys: VIS.length, nades: pl.nades }; },
  los(){ const o = BUNKER.mg, h = playerHead(); return trace(o[0], o[1], o[2], h[0], h[1], h[2]); },
  render(){ render(); },
  touchOn(){ touch.on = true; },
  pick(){ return aimPick ? (aimPick.tag.id + '@' + aimPick.z.toFixed(2)) : null; },
  dbg(){ return { spriteFrame, AMMOS, MEDS, mg, game, trace, BUNKER, BOXES, HEDGES, pl, cam, setCamera, updateBasis }; },
};

(async () => {
  buildWorldWhenReady();
  requestAnimationFrame(frame);
})();
async function buildWorldWhenReady(){
  try {
    await loadAssets();
    const t0 = performance.now();
    buildWorld();
    window.__qa.buildMs = Math.round(performance.now() - t0);
    for (const p of BUNKERP) p.amb0 = p.amb;
    game.enemies = ENEMY_POS.map(([x, z], i) => mkEnemy(i, x, z)).concat([mkCrew(8, 'gun'), mkCrew(9, 'load')]);
    pl.x = 0; pl.z = -21.2; pl.fy = BOAT.deck;
    setMode('title');
    window.__qa.ready = true;
    // ?start=1 skips the title screen (used for the arcade thumbnail; sound stays off until a tap)
    try { if (new URLSearchParams(location.search).has('start')){ newGame(); game.msgs = []; } } catch (err) {}
  } catch (err){
    console.error(err);
    flash('COULD NOT LOAD THE BEACH', 30, WARN);
  }
}
